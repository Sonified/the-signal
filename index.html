<!-- The experience is drawn by the GPU. The only temporary DOM overlays are
     first light below (removed at the first rendered frame) and the mobile
     broadcast receiver's audio-unlock gesture. -->
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; position:fixed; inset:0; width:100vw; height:100vh;
           touch-action:none; outline:none; -webkit-user-select:none; user-select:none; }
  #follow-audio-gate {
    display:none; position:fixed; inset:0; z-index:1000; align-items:center;
    justify-content:center; padding:28px; box-sizing:border-box; background:rgba(0,0,0,.42);
    /* Styled to read as the canvas hint's sibling: same system stack the
       glyph atlas rasterises, light weight, the hint's ink colour. */
    color:#b9c6d4; font:300 27px/1.3 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    letter-spacing:.04em; text-align:center; text-shadow:0 1px 12px #000;
    opacity:1; transition:opacity .55s ease; touch-action:manipulation;
    -webkit-user-select:none; user-select:none; cursor:pointer;
  }
  #follow-audio-gate.show { display:flex; }
  #follow-audio-gate.done { opacity:0; pointer-events:none; }

  /* First light: holds the screen while the modules and the GPU device
     arrive, then fades on main.js's first-light event (sent once the first
     real frame is on its way). Rings ripple outward from the centre with a
     few sparks between them — radially even, nothing pulls the eye aside.
     Compositor-only (transform + opacity on a handful of nodes), so it
     costs nothing that the boot needs. pointer-events:none keeps it out of
     the way of the ?follow gate above it and the canvas beneath. */
  #first-light {
    --fl: min(64vmin, 560px);
    position:fixed; inset:0; z-index:900; display:grid; place-items:center;
    background:#000; pointer-events:none;
    opacity:1; transition:opacity .9s ease;
  }
  #first-light.done { opacity:0; }
  #first-light > * { grid-area:1/1; }
  #first-light .ring {
    width:var(--fl); height:var(--fl); border-radius:50%;
    border:1px solid rgba(185,198,212,.5);
    animation:fl-ring 3.6s linear infinite;
  }
  #first-light .ring:nth-child(2) { animation-delay:-1.2s; }
  #first-light .ring:nth-child(3) { animation-delay:-2.4s; }
  @keyframes fl-ring {
    0%   { transform:scale(.10); opacity:0; }
    14%  { opacity:.55; }
    100% { transform:scale(1);   opacity:0; }
  }
  #first-light .dot {
    width:3px; height:3px; border-radius:50%; background:#cdd8e4;
    animation:fl-dot 2.8s linear infinite;
  }
  @keyframes fl-dot {
    0%   { transform:rotate(var(--a)) translateY(calc(var(--fl) * -.07)); opacity:0; }
    16%  { opacity:.85; }
    100% { transform:rotate(var(--a)) translateY(calc(var(--fl) * -.52)); opacity:0; }
  }
  #first-light .word {
    color:#b9c6d4; font:300 clamp(19px, 3.2vmin, 26px)/1 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    letter-spacing:.34em; margin-right:-.34em; text-shadow:0 1px 12px #000;
    animation:fl-breathe 3.6s ease-in-out infinite alternate;
  }
  @keyframes fl-breathe { from { opacity:.4; } to { opacity:.95; } }
  @media (prefers-reduced-motion: reduce) {
    #first-light .ring, #first-light .dot { animation:none; opacity:0; }
    #first-light .ring:first-child { opacity:.3; transform:scale(.5); }
    #first-light .word { animation:none; opacity:.8; }
  }
</style>
</head>
<body>
<canvas id="v1" tabindex="0"></canvas>
<div id="first-light" aria-hidden="true">
  <div class="ring"></div><div class="ring"></div><div class="ring"></div>
  <div class="dot" style="--a:0deg"></div><div class="dot" style="--a:45deg;animation-delay:-.35s"></div>
  <div class="dot" style="--a:90deg;animation-delay:-.7s"></div><div class="dot" style="--a:135deg;animation-delay:-1.05s"></div>
  <div class="dot" style="--a:180deg;animation-delay:-1.4s"></div><div class="dot" style="--a:225deg;animation-delay:-1.75s"></div>
  <div class="dot" style="--a:270deg;animation-delay:-2.1s"></div><div class="dot" style="--a:315deg;animation-delay:-2.45s"></div>
  <div class="word">arriving</div>
</div>
<script>
  (() => {
    // Fades at the first rendered frame (main.js dispatches first-light); the
    // timer is insurance so a stalled boot never hides its own error behind
    // the loader. A fatal message (platform/web.js) clears the body, loader
    // included, so the failure paths need nothing here.
    const fl = document.getElementById('first-light');
    const done = () => { fl.classList.add('done'); setTimeout(() => fl.remove(), 950); };
    document.addEventListener('first-light', done, { once:true });
    setTimeout(done, 15000);
  })();
</script>
<div id="follow-audio-gate" role="button" aria-label="Tap to join the live stream">Tap to join the live stream</div>
<script>
  (() => {
    // One prompt, one tap. A stream link is a join, on every device: the
    // same gesture that reveals the session also wakes the audio, so there
    // is no separate audio toll booth and nothing plays before the tap.
    const gate = document.getElementById('follow-audio-gate');
    const follow = new URLSearchParams(location.search).get('follow');
    if (follow) gate.classList.add('show');
    else gate.remove();
  })();
</script>
<!-- Temporary boot tracing: brackets the module-import phase, so a hang
     before the first [boot] line means an import never finished. -->

<script type="module">import { applyFreshVisit, applyPendingLoad } from './platform/settings-file.js'; applyFreshVisit(); applyPendingLoad();</script>
<script type="module" src="main.js"></script>
<script type="module" src="platform/midi-in.js"></script>
