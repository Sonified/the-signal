[package]
name = "heart"
version = "0.1.0"
edition = "2024"
description = "The Signal's audio engine: a Web Audio twin in Rust, rendered ahead in workers"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
realfft = "3"
rustfft = "6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
