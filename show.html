<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Show Remote</title>
<!--
  The show controller: the iPad Robert carries round the room, driving
  Presence (the app at /, on the laptop, opened with ?remote). This page is
  always the controller; the receiving end is platform/show-remote.js.

  Tap a cue and Presence jumps to that journey step. Four faders (the Max
  surface's four): VOLUME the app's Master volume and LP / HP its global
  Lowpass and Highpass, all of its sound (slides, music, the Sun's hum);
  SPEED the slides' speed. Play/pause toggles the slides' transport; Duck
  drops the slides', the heartbeat's and the Sun hum's sound under the
  voice, its amount and fades set behind the gear, which also holds the
  slides' Crossfade and the global filters' resonance and interpolation.

  TRANSPORT: the mirror test's (remote.html), lifted. The Cloudflare relay
  and, when this page came from the laptop (http://<mac>.local:8800/show.html,
  tools/mirror-local.mjs), the laptop's own relay too, both at once; each
  command goes down every open path numbered (src, n) and Presence acts on
  whichever copy lands first. This page broadcasts on 'mirror-<room>' and
  follows 'mirror-<room>-status', where Presence reports the step playing and
  the faders' controls ({t:'state', k:'step', i, n, p, sl}), kept by each
  relay for a late joiner. The password is the mirror rooms' one (POST /auth,
  remembered as localStorage 'mirror.pw', handed over in #k= on a switch).

  COMMANDS, each {t:'word', src, n, k, ...} (src the sender's id, n its
  count; NOT 'id', which is the control's id in a ctl):
    {k:'jump', i}  i 0-based          {k:'next'} / {k:'prev'}
    {k:'seek', f}  the playing cue tapped again: its video to share f (0..1)
    {k:'ctl', id, v}  v in the control's OWN position units (what
        byId(id).set takes in core/schema-audio.js / schema-slides.js):
          vol 0..100 (the app's Master volume, %, default 50: VOLUME)
          lpf 0..1000 (global Lowpass, log 20 Hz..20 kHz, 1000 open: LP)
          hpf 0..1000 (global Highpass, same taper, 0 open: HP)
          lpfRes, hpfRes 0..24 (their resonance, dB of peak at the corner,
            0 flat, in 0.5 dB steps; the gear's Filters)
          filterGlide 0..200 (ms, the time constant of the exponential
            smooth all four glide with, 0 a jump; the gear's Filters)
          slideRate 0..1000 (500 = 1x, log 0.25..2x: SPEED)
          slidePlay true (play) / false (pause), idempotent
          slideRestart (v ignored)
          slideXfade 0..1000 (hundredths of a second, 0 a cut; the gear's
            Crossfade, sent on each change and remembered with the duck's)
          heartMaster 0..100 (the Heartbeat's Master, %, its sound and its
            flash together: HEART)
          mwtsVolume 0..100 (meditatewiththesun.com's Master volume, %, the
            phones following the broadcast: MWTS)
          screenGate 0..100 (the room's picture's master brightness, %, 0
            black, live only: SCREEN)
          finaleDrone, finalePiano, finaleChoir, finaleAmb 0..100 (the
            finale row: each linear onto its levels, 100 = the finale's own;
            DRONE Drone level + the tone's Level + Clouds level, PIANO Piano
            level, CHOIR Choir level, AMBIENCE Ambience level)
          finaleHum 0..100 (the Sun hum's Speed: 1x at 0, 2x at 100, even
            in pitch: HUM)
          finaleSun 0..100 (the Sun's Speed 2x..8x, even in ratio, with its
            Speed variance 0..78% and Breath Amount 0..67%: SUN)
          finaleWind 0..100 (the Sun's Feedback Amount 0..83% and Opacity
            0..36%, the rings' opacity 0..29% over the top half, the
            flowers' 0..15% over the top quarter: WIND)
    {k:'duck', on, amt, dn, up}  amt 0..1, dn and up in seconds; DUCK is
        hold-and-release: on at pointerdown, off at pointerup, pointercancel
        or the finger sliding off the button

  LAYOUT follows Robert's TouchOSC/Max surface (thumb reach, iPad held in
  two hands): the cues down the left; on the right edge, top corner one
  play/pause toggle (green playing with a pause glyph, red paused with a
  play glyph, the four faders' width), below it the four tall
  faders (half-width,
  hugging the right edge, as the photo has them) in the
  surface's order LP, HP, SPEED, VOLUME, and in the bottom corner DUCK.
  The middle holds the faders that are not the surface's, level with the
  four: SCREEN (the picture's master brightness, down to black), SUN beside
  it (the Sun's speed, its variance and its breath together), WIND beside
  that (the Sun's feedback, the rings and the flowers), HEART (the
  Heartbeat's Master), then MWTS (meditatewiththesun.com's volume), one
  row 10px apart. Above them, column for column, the finale row: five of
  the same faders, DRONE (the drone file, the tone and the
  clouds together), PIANO, CHOIR, AMBIENCE, and HUM (the Sun hum's
  speed, 1x to 2x).

  ?room=<name> (default 'show'), ?mac=<host:port> (the laptop, default
  Roberts-MacBook-Pro-2.local:8800), ?relay=<host> (the cloud relay),
  ?cloud=<origin> (where Switch to Cloud goes).
-->
<style>
:root {
  --bg: #0b0d12; --panel: #151922; --line: #262c3a; --ink: #e8ecf4; --dim: #8a93a6;
  --gold: #f2c14e; --flash: #ffe28a; --ok: #6fd08c; --bad: #ff7a7a; --btn: #1d2230;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-bottom: 12px; flex: none; }
h1 { font-size: 20px; margin: 0; }
#title { cursor: pointer; }
#title:active { color: var(--gold); }
.status { color: var(--dim); font-size: 13px; }
.status b { color: var(--ink); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
.dot.on { background: var(--ok); }
#paths { display: flex; flex: none; gap: 12px; }
.path-status { display: grid; grid-template-columns: 8px 5ch 7ch 10ch; gap: 6px; align-items: center;
  white-space: nowrap; font-variant-numeric: tabular-nums; }
.path-status .dot { margin-right: 0; }
.path-latency { text-align: right; }
.path-latency, .path-peers { overflow: hidden; text-overflow: ellipsis; }
#appHealth { margin: 0 6px; vertical-align: middle; }
.spacer { margin-left: auto; }
.header-actions { display: flex; flex: none; gap: 12px; align-items: center; }
.big { height: 54px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--btn); color: var(--ink);
  font-family: inherit; font-weight: 600; font-size: 16px; touch-action: manipulation; }
.small { height: 40px; font-size: 14px; padding: 0 14px; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(227px, 0.689fr) 1.311fr; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-height: 0; }
.card h2 { font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }

/* the cues */
#cuesCard { display: flex; flex-direction: column; }
#cues { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: grid; gap: 8px; align-content: start; padding: 2px; }
.cue { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 14px; text-align: left;
  border-radius: 12px; border: 1px solid var(--line); background: var(--btn); color: var(--ink);
  font-family: inherit; font-weight: 600; font-size: 18px; touch-action: manipulation; transition: opacity .2s, background .2s; }
.cue .num { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: #0f1219; border: 1px solid var(--line); color: var(--dim); font-size: 15px; font-variant-numeric: tabular-nums; }
.cue-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cue-thumb { flex: 0 0 80px; width: 80px; height: 45px; margin-left: auto;
  border-radius: 5px; background: #000; overflow: hidden; pointer-events: none; }
.cue-thumb img, .cue-thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.cue-thumb video { background: #000; }
@media (max-width: 1024px) {
  .cue { font-size: 16px; gap: 8px; padding-left: 10px; padding-right: 10px; }
  .cue-thumb { flex-basis: 72px; width: 72px; height: 41px; }
}
.cue.past { opacity: .42; }
/* the playing cue's video, filling left to right in soft yellow */
.cue { position: relative; overflow: hidden; }
.cue > span { position: relative; }
.cue .prog { position: absolute; left: 0; top: 0; bottom: 0; width: 0; display: none; pointer-events: none;
  background: linear-gradient(90deg, rgba(255, 226, 138, .10), rgba(255, 226, 138, .32)); border-right: 2px solid rgba(255, 226, 138, .75); }
.cue.now .prog.on { display: block; }
.cue.now { background: #3a2e0e; border-color: var(--gold); color: #fff; box-shadow: 0 0 22px rgba(242, 193, 78, .45), inset 0 0 0 1px var(--gold); }
.cue.now .num { background: var(--gold); color: #000; border-color: var(--gold); }
.cue.tap { animation: flash .45s ease-out; }
@keyframes flash { 0% { background: var(--flash); color: #000; box-shadow: 0 0 28px var(--flash); } }

/* the right side: everything on the right edge, the middle left empty */
#stage { position: relative; min-height: 0; display: flex; justify-content: flex-end; gap: 14px; }
/* the middle: its faders level with the edge's four (the edge's top row is
   the 178px play/pause block, its bottom row the 110px DUCK) */
#middle { flex: 1; min-width: 0; min-height: 0; display: grid; grid-template-rows: 178px 1fr 110px; gap: 12px; }
/* HEART and MWTS carry on the SCREEN, SUN, WIND row: HEART under
   AMBIENCE, MWTS under HUM, the finale row's fourth and fifth columns. Their
   box starts where SCREEN's does and is shifted right by three faders and
   their gaps (3 x (72 + 10) = 246px); a relative shift, so it never widens
   the page's columns, and the box itself is 0 wide for the same reason (see
   #topFaders). All the middle's faders but the finale row sit 122px lower
   than the edge's four (DUCK's 110px row and its 12px gap), the same
   height, their bottoms level with DUCK's. */
#midFaders { grid-row: 2 / 4; min-height: 282px; padding-top: 122px; display: flex; gap: 10px;
  justify-self: start; width: 0; position: relative; left: 246px; }
#midFaders .fader { width: 72px; flex: none; }
/* SCREEN at the middle's left edge, next to the cues, SUN and WIND
   beside it 10px apart. The box itself is 0 wide, so the three spill out visibly instead
   of widening the page's columns (see #topFaders) */
#leftFader { grid-row: 2 / 4; grid-column: 1; min-height: 282px; padding-top: 122px; display: flex; gap: 10px; justify-self: start; width: 0; }
#leftFader .fader { width: 72px; flex: none; }
#midFaders { grid-column: 1; }
/* The finale row: five more of the same 72px faders in the band above
   SCREEN, HEART and MWTS, starting over SCREEN and running right. Its box
   ends 12px above their labels (the middle's 178px top row, its 12px gap and
   their 122px drop, less 12), and starts 48px down, clear of Presence's
   status line; it runs on past #middle into the edge's empty left half, as
   #midFaders does. Its own box is 0 wide, so its 400px of faders spill
   out visibly instead of widening the page's columns (the cues and the
   edge both size from the stage's content). */
#topFaders { grid-row: 1 / 3; grid-column: 1; align-self: start; width: 0; height: 300px; padding-top: 48px;
  display: flex; gap: 10px; }
#topFaders .fader { width: 72px; flex: none; }
#edge { width: min(100%, 460px); min-height: 0; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; }
/* Presence's status and the show's bar across the whole stage, from the
   finale row's left edge (DRONE's) to the play button's right, in the strip
   above the finale row and the button (both start 48px down); laid over
   the stage, so it never widens it */
#info { position: absolute; left: 0; right: 0; top: 0; padding-top: 4px; display: grid; gap: 8px; }
.bar { height: 10px; border-radius: 5px; background: #0f1219; border: 1px solid var(--line); overflow: hidden; }
.bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #6b5216, var(--gold)); transition: width .3s; }
/* One play/pause toggle filling the 178px block above the four faders
   below Presence's strip (from 48px down, the finale row's top line), as
   wide as the four are (the edge's right half), so play/pause, the four and
   DUCK make one column. Green while playing with a pause glyph, red while
   paused with a play glyph. */
#pp { width: 50%; height: 178px; padding-top: 48px; margin-left: auto; display: grid; }
#playpause { height: 100%; color: #fff; display: grid; place-items: center;
  box-shadow: 0 0 22px rgba(255, 255, 255, .25), inset 0 0 0 2px #fff; transition: background .15s, border-color .15s; }
#playpause svg { width: 80px; height: 80px; }
#playpause.playing { background: #2f9a4a; border-color: #4fd06e; }
#playpause.paused { background: #c0393b; border-color: #ff6b6b; }
#playpause svg { display: none; }
#playpause.playing .ic-pause { display: block; }
#playpause.paused .ic-play { display: block; }
#faders { min-height: 160px; width: 50%; margin-left: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.fader { display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-height: 0; }
.fader .lab { text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
.fader .track { position: relative; flex: 1; min-height: 120px; border-radius: 12px; background: #0f1219;
  border: 2px solid var(--line); overflow: hidden; touch-action: none; }
.fader .fill { position: absolute; left: 0; right: 0; bottom: 0; opacity: .85; }
.fader .mid { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255,255,255,.3); }
/* one line, fixed height, never wrapping: a wide value ("100 Hz", "1.2 kHz")
   spills past the narrow column instead of growing it and squeezing the
   track up */
.fader .val { text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; height: 22px; line-height: 22px; white-space: nowrap; }
/* DUCK the four faders' width too, under them */
#bottom { display: flex; justify-content: flex-end; }
#duck { width: 50%; }
#duck { height: 110px; font-size: 28px; letter-spacing: .1em; background: #1f4a44; border-color: #3fa596; color: #bff3ea; touch-action: none; }
#duck.on { background: var(--bad); color: #000; border-color: #fff; box-shadow: 0 0 34px rgba(255, 122, 122, .7); }
.big:active, .cue:active { filter: brightness(1.35); }
#gear { width: 36px; height: 36px; padding: 0; font-size: 18px; border-radius: 50%; display: grid; place-items: center; }

/* settings */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; place-items: center; z-index: 5; padding: 16px; }
#modal.open { display: grid; }
#modal .card { width: min(460px, 100%); position: relative; }
#close { position: absolute; top: -56px; right: 0; width: 44px; height: 44px; padding: 0; font-size: 20px; }
.slider { position: relative; height: 36px; border-radius: 8px; background: #0f1219; border: 1px solid var(--line);
  margin-bottom: 6px; overflow: hidden; touch-action: none; }
.slider .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #6b5216, var(--gold)); }
.slider .lab { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-weight: 600; mix-blend-mode: difference; }
.slider .val { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-variant-numeric: tabular-nums; mix-blend-mode: difference; }

#lock { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 10; padding: 16px; }
#lock form { display: grid; gap: 12px; width: min(340px, 100%); text-align: center; }
#lock input { height: 54px; font-size: 20px; text-align: center; }
#lock .msg { min-height: 20px; color: var(--bad); font-size: 14px; }
input[type=password] { height: 40px; border-radius: 8px; border: 1px solid var(--line); background: #0f1219; color: var(--ink); padding: 0 10px; font: inherit; }

@media (max-width: 760px) {
  html, body { overflow: auto; height: auto; }
  main { grid-template-columns: 1fr; }
  #cues { max-height: 50vh; }
  #faders { min-height: 300px; }
  #stage { display: block; }
  #info { position: static; margin-bottom: 14px; }
  #middle { display: block; margin-bottom: 14px; }
  #midFaders { width: auto; left: 0; height: 300px; padding: 0; min-height: 0; }
  #leftFader { width: auto; height: 300px; margin-bottom: 14px; padding: 0; min-height: 0; }
  #topFaders { width: auto; margin-bottom: 14px; padding: 0; overflow-x: auto; }
  #edge { width: 100%; }
}
</style>
</head>
<body>
<div id="lock">
  <form id="lockForm" autocomplete="on">
    <h1>Show Remote</h1>
    <input type="password" id="pw" placeholder="password" autocomplete="current-password" autofocus>
    <button class="big" type="submit">Unlock</button>
    <div class="msg" id="lockMsg"></div>
  </form>
</div>
<header>
  <h1 id="title">Show Remote</h1>
  <span class="status" id="paths"></span>
  <span class="status">room <span class="dot" id="appHealth" role="img" aria-label="App status: waiting for laptop" title="App status: waiting for laptop"></span><b id="roomName"></b></span>
  <div class="header-actions spacer">
    <button class="big small" id="defaults">Defaults</button>
    <button class="big small" id="switch"></button>
    <button class="big" id="gear" aria-label="Settings">⚙︎</button>
  </div>
</header>

<main>
  <div class="card" id="cuesCard">
    <h2>Cues</h2>
    <div id="cues"></div>
  </div>
  <div id="stage">
    <div id="info">
      <div class="status" id="presence">Presence: <b>no word yet</b></div>
      <div class="bar"><div id="showBar"></div></div>
    </div>
    <div id="middle"><div id="midFaders"></div><div id="leftFader"></div><div id="topFaders"></div></div>
    <div id="edge">
      <div id="top">
        <div id="pp">
          <button class="big" id="playpause" aria-label="Play/pause">
            <svg class="ic-play" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="#fff"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="#fff"/></svg>
          </button>
        </div>
      </div>
      <div id="faders"></div>
      <div id="bottom">
        <div></div>
        <button class="big" id="duck">DUCK</button>
      </div>
    </div>
  </div>
</main>

<div id="modal">
  <div class="card">
    <button class="big" id="close" aria-label="Close">✕</button>
    <h2>Duck</h2>
    <div id="sAmt"></div>
    <div id="sDn"></div>
    <div id="sUp"></div>
    <h2 style="margin-top: 18px">Slides</h2>
    <div id="sXf"></div>
    <div id="sPreviewDelay" title="Advances the iPad preview to compensate for playback report delay. Saved on this device."></div>
    <h2 style="margin-top: 18px">Filters</h2>
    <div id="sLr"></div>
    <div id="sHr"></div>
    <div id="sFg"></div>
  </div>
</div>

<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.search);
  let room = (P.get('room') || 'show').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^mirror-/, '') || 'show';
  room = room.slice(0, 40);
  const ROOM = 'mirror-' + room, STATUS_ROOM = ROOM + '-status';
  const HOST = P.get('relay') || 'the-signal-broadcast.robertalexander-music.workers.dev';
  const MAC = P.get('mac') || 'Roberts-MacBook-Pro-2.local:8800';
  const CLOUD_PAGE = P.get('cloud') || 'https://sun-layer.presence-generator.pages.dev';
  const SERVED_LOCAL = location.protocol === 'http:';
  // Safari will not let a page from the secure site open a plain local
  // socket, so the laptop's relay is a path only when the laptop served us.
  const LOCAL_HOST = SERVED_LOCAL ? location.host : '';
  $('roomName').textContent = room;

  const CUES = ['Intro Slide', 'Harmonica', 'Heartbeat', 'Audification Explained', 'Nightingale', 'Shepard Tone',
    "Shepard's Rise", 'Earthquake', 'Rotating Sun', 'Spherical Harmonics — hum along!', 'HARP Trailer', 'WISPR CME',
    'Touching the Sun', 'Ed Mitchell VR', 'QR + Sun 🌞', 'Guided Meditation 🎵🌞🎵'];

  // ---------- the password (remote.html's, as is) ----------
  let KEY = '';
  try { KEY = localStorage.getItem('mirror.pw') || ''; } catch (e) {}
  {
    const hk = new URLSearchParams(location.hash.slice(1)).get('k');
    if (hk) {
      KEY = hk;
      try { localStorage.setItem('mirror.pw', hk); } catch (e) {}
      history.replaceState(null, '', location.pathname + location.search);
    }
  }
  async function check(pw) {
    try {
      const r = await fetch(SERVED_LOCAL ? '/auth' : 'https://' + HOST + '/auth', { method: 'POST', body: pw });
      return r.status === 200 ? 'ok' : r.status === 403 ? 'no' : 'down';
    } catch (e) { return 'down'; }
  }
  async function unlock() {
    const lockMsg = $('lockMsg');
    if (KEY) {
      const v = await check(KEY);
      if (v !== 'no') { $('lock').remove(); open(); startCuePreviews(); return; }
      try { localStorage.removeItem('mirror.pw'); } catch (e) {}
      KEY = ''; lockMsg.textContent = 'That password no longer works.';
    }
    $('lockForm').onsubmit = async e => {
      e.preventDefault();
      const pw = $('pw').value;
      if (!pw) return;
      lockMsg.style.color = 'var(--dim)'; lockMsg.textContent = 'checking…';
      const v = await check(pw);
      lockMsg.style.color = '';
      if (v === 'ok') {
        KEY = pw;
        try { localStorage.setItem('mirror.pw', pw); } catch (e) {}
        $('lock').remove(); open(); startCuePreviews();
      } else lockMsg.textContent = v === 'no' ? 'Wrong password.' : 'Can\'t reach the relay. Check the internet.';
    };
  }

  {
    const sw = $('switch');
    sw.textContent = SERVED_LOCAL ? 'Switch to Cloud' : 'Switch to Local';
    sw.onclick = () => {
      const q = new URLSearchParams(location.search);
      let to;
      if (SERVED_LOCAL) { q.delete('cloud'); to = CLOUD_PAGE + '/show?' + q.toString(); }
      else { q.set('cloud', location.origin); to = 'http://' + MAC + '/show.html?' + q.toString(); }
      location.href = to + '#k=' + encodeURIComponent(KEY);
    };
  }

  // ---------- the cues ----------
  // The step Presence reports glows gold, the ones before it dim; until a
  // report arrives the last one tapped stands in.
  let statusStep = null, tapped = -1;
  const cueEls = CUES.map((label, i) => {
    const b = document.createElement('button');
    b.className = 'cue';
    b.innerHTML = '<div class="prog"></div><span class="num">' + (i + 1) + '</span><span class="cue-label"></span>';
    b.querySelector('.cue-label').textContent = label;
    b.addEventListener('click', e => {
      // the cue already playing, with a video of known length: the tap
      // seeks it to that place across the button instead
      const now = statusStep !== null ? statusStep : tapped;
      if (i === now && vp) {
        const r = b.getBoundingClientRect();
        const f = Math.min(1, Math.max(0, (e.clientX - r.left) / (r.width || 1)));
        send({ k: 'seek', f: Math.round(f * 10000) / 10000 });
        vp.t = f * vp.d; vpAt = performance.now();
        if (!vpRaf) drawProg();
        return;
      }
      tapped = i;
      b.classList.remove('tap'); void b.offsetWidth; b.classList.add('tap');
      send({ k: 'jump', i });
      drawCues();
    });
    $('cues').appendChild(b);
    return b;
  });
  let shownNow = -2;
  function drawCues() {
    const now = statusStep !== null ? statusStep : tapped;
    cueEls.forEach((b, i) => { b.classList.toggle('now', i === now); b.classList.toggle('past', now >= 0 && i < now); });
    if (now !== shownNow) {
      shownNow = now;
      if (now >= 0 && cueEls[now]) cueEls[now].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
  drawCues();

  // The playing cue's video fill: Presence reports where the slide stands
  // (vp {t, d, r}, a few times a second) and the bar runs on between
  // reports at the rate it gave, so it moves smoothly; r 0 holds it still.
  let vp = null, vpAt = 0, vpRaf = 0;
  function drawProg() {
    vpRaf = 0;
    const now = statusStep !== null ? statusStep : tapped;
    cueEls.forEach((b, i) => {
      const bar = b.firstChild;
      const on = i === now && !!vp;
      bar.classList.toggle('on', on);
      if (on) bar.style.width = Math.min(100, Math.max(0, (vp.t + vp.r * (performance.now() - vpAt) / 1000) / vp.d * 100)) + '%';
    });
    if (vp && vp.r > 0) vpRaf = requestAnimationFrame(drawProg);
  }
  function setProg(m) {
    const v = m && typeof m.d === 'number' && m.d > 0 && isFinite(m.t) ? m : null;
    vp = v ? { t: +v.t, d: +v.d, r: Math.max(0, +v.r || 0),
      f: typeof v.f === 'string' ? v.f : null, l: v.l === true } : null;
    vpAt = performance.now();
    if (!vpRaf) drawProg();
    if (cuePreviews) cuePreviews.sync();
  }

  // Cue thumbnails use cached, silent 144p clips. The only moving thumbnail
  // follows the laptop's actual file, video time, speed and loop setting.
  const PREVIEW_DELAY_MAX = 500;
  let previewDelayMs = 50;
  try {
    const saved = localStorage.getItem('show.previewDelayMs');
    if (saved !== null && Number.isFinite(+saved)) previewDelayMs = Math.round(Math.max(0, Math.min(PREVIEW_DELAY_MAX, +saved)) / 5) * 5;
  } catch (e) {}
  let cuePreviews = null, cuePreviewsStarted = false;
  async function startCuePreviews() {
    if (cuePreviewsStarted) return;
    cuePreviewsStarted = true;
    try {
      const { createCuePreviews } = await import('./platform/cue-previews.js');
      cuePreviews = await createCuePreviews({
        cues: cueEls,
        prefixes: ['010', '020', '015', '030', '040', '031', '032', '050', '060', '070', '090', '180', '190', '220'],
        getPlayback: () => vp ? {
          index: statusStep !== null ? statusStep : tapped,
          file: vp.f, time: vp.t, duration: vp.d, rate: vp.r, loop: vp.l, reportedAt: vpAt,
          delayMs: previewDelayMs,
          live: document.visibilityState === 'visible' && paths.some(p => isOpen(p.cmd) && isOpen(p.st) &&
            p.peers > 0 && performance.now() - p.healthAt < HEALTH_TIMEOUT)
        } : null
      });
      // Temporary passive diagnostics stay on this Mac's local relay.
      // No show commands or changes to playback are sent on this room.
      if (SERVED_LOCAL) {
        const debug = new WebSocket('ws://' + LOCAL_HOST + '/room/' + ROOM + '-preview-debug?role=broadcast&key=' + encodeURIComponent(KEY));
        const timer = setInterval(() => {
          if (debug.readyState === 1 && !document.hidden) debug.send(JSON.stringify({
            t: 'state', k: 'preview-debug', src: SID, ua: navigator.userAgent,
            vp, reportAgeMs: Math.round(performance.now() - vpAt), ...cuePreviews.diagnostics()
          }));
        }, 1000);
        window.addEventListener('pagehide', () => { clearInterval(timer); debug.close(); }, { once: true });
      }
    } catch (error) { console.warn('Cue previews unavailable:', error); }
  }

  // ---------- the faders ----------
  // Each holds its control's own position (see the header) and shows it in
  // plain units through the same tapers core/schema-audio.js and schema-slides.js use. A drag
  // is relative (it moves the fader from where it is, wherever the finger
  // lands, so a touch never jumps the sound).
  // Sends go at most once per animation frame. Presence's reports move a
  // fader only when it has not been touched for a moment.
  const HZ_LN = Math.log(1000);
  const posToHz = p => Math.round(20 * Math.exp(HZ_LN * Math.min(1, Math.max(0, p / 1000))));
  // kHz always carries its decimal (5.0 kHz), so the centred value keeps
  // one width instead of jumping left and right as the fader moves
  const hzText = hz => hz >= 1000 ? (Math.round(hz / 100) / 10).toFixed(1) + ' kHz' : Math.round(hz) + ' Hz';
  const posToRate = p => {
    p = Math.max(0, Math.min(1000, p));
    let r = p <= 500 ? p / 500 : Math.pow(2, (p - 500) / 500);
    if (Math.abs(r - 1) <= 0.03) r = 1;
    return Math.round(r * 100) / 100;
  };
  // In the surface's order, left to right, each in its colour there.
  const FADERS = [
    { id: 'lpf', key: 'lp', label: 'LP', color: '#e45bf0', max: 1000, def: 1000, fmt: p => p >= 1000 ? 'open' : hzText(posToHz(p)) },
    { id: 'hpf', key: 'hp', label: 'HP', color: '#b6f03c', max: 1000, def: 0, fmt: p => p <= 0 ? 'open' : hzText(posToHz(p)) },
    // Speed tops out at 1x (the control's 500); the track is the slow half,
    // LINEAR all the way down to 0, where the movie freezes (the sound's
    // own floor is 6.25%, the slowest rate Chrome will play). The show
    // never runs faster than life.
    { id: 'slideRate', key: 'rate', label: 'SPEED', color: '#f5e23a', max: 500, def: 500,
      fmt: p => p <= 0 ? 'stop' : posToRate(p).toFixed(2) + '×' },
    // the app's Master volume (vol), the whole interface's level, 50% by
    // default; the laptop keeps the slides' own level (Master slide volume)
    // squared taper into the Master volume (platform/show-remote.js): 50% is -12 dB,
    // 25% is -24 dB. 71 is the app's own default (0.5, -6 dB) on this curve.
    { id: 'vol', key: 'vol', label: 'VOLUME', color: '#5ee8e0', max: 100, def: 71, fmt: p => Math.round(p) + '%' },
    // In the middle, first: the screen gate, the room's picture's master
    // brightness (S.screenGate, gpu/engine.js), linear 0..100%, 0 black.
    // Slide it down to end the show; the laptop's own drawer stays lit.
    { id: 'screenGate', key: 'gt', label: 'SCREEN', color: '#f4efe0', max: 100, def: 100, box: 'leftFader', fmt: p => p <= 0 ? 'black' : Math.round(p) + '%' },
    // SUN, beside it: the Sun video's baseline Speed 2x to 8x (4x halfway,
    // even in ratio as its own slider moves), its Speed variance 0 to 78%
    // and the Breath's Amount 0 to 67%, together (finaleSun); the readout
    // is the speed
    { id: 'finaleSun', key: 'su', label: 'SUN', color: '#ffb13b', max: 100, def: 0, box: 'leftFader',
      fmt: p => (2 * Math.pow(4, p / 100)).toFixed(1) + '×' },
    // WIND, beside SUN: the Sun's Feedback Amount 0 to 83% and Opacity 0 to
    // 36% over the whole fader, the rings' opacity 0 to 29% over its top
    // half and the flowers' 0 to 15% over its top quarter (finaleWind)
    { id: 'finaleWind', key: 'wi', label: 'WIND', color: '#a8f0d8', max: 100, def: 0, box: 'leftFader', fmt: p => Math.round(p) + '%' },
    // Then the Heartbeat's Master, the heard beat and its flash
    // riding together at the balance the laptop's Audio level and Visual
    // amount set (core/schema-heartbeat.js), linear 0..100%.
    { id: 'heartMaster', key: 'hm', label: 'HEART', color: '#ff5a7a', max: 100, def: 100, box: 'midFaders', fmt: p => Math.round(p) + '%' },
    // meditatewiththesun.com's Master volume: the phones in the room
    // following the broadcast fade their sound to it (core/schema-sun.js
    // mwtsVolume), linear 0..100%.
    { id: 'mwtsVolume', key: 'mw', label: 'MWTS', color: '#ff9f43', max: 100, def: 100, box: 'midFaders', fmt: p => Math.round(p) + '%' },
    // The finale row, above those three, left to right: DRONE, PIANO,
    // CHOIR, AMBIENCE, HUM. The four levels each their own 0..100%, which the laptop lays linearly
    // onto its levels, silent at 0 and the finale's own at 100%
    // (platform/show-remote.js FINALE); each level's variance keeps
    // breathing around wherever it sits.
    // DRONE: the Music drone file, the Audio tone and the Music clouds
    // together (Drone level 55%, the tone's Level -14.4 dB, Clouds level
    // 100% at the top)
    { id: 'finaleDrone', key: 'dr', label: 'DRONE', color: '#6fb8ff', max: 100, def: 100, box: 'topFaders', fmt: p => Math.round(p) + '%' },
    // PIANO: Piano level, 100% at the top
    { id: 'finalePiano', key: 'pn', label: 'PIANO', color: '#ffd479', max: 100, def: 100, box: 'topFaders', fmt: p => Math.round(p) + '%' },
    // CHOIR: Choir level, 138% at the top
    { id: 'finaleChoir', key: 'ch', label: 'CHOIR', color: '#b48cff', max: 100, def: 100, box: 'topFaders', fmt: p => Math.round(p) + '%' },
    // AMBIENCE: Ambience level, 18% at the top
    { id: 'finaleAmb', key: 'am', label: 'AMBIENCE', color: '#7ddc8a', max: 100, def: 100, box: 'topFaders', fmt: p => Math.round(p) + '%' },
    // HUM: the Sun hum's Speed, 1x at the bottom and 2x at the top, even
    // in pitch (1.41x halfway), as its own Speed slider moves
    { id: 'finaleHum', key: 'hu', label: 'HUM', color: '#ff7e47', max: 100, def: 0, box: 'topFaders',
      fmt: p => Math.pow(2, p / 100).toFixed(2) + '×' }
  ];
  const pending = new Map();
  let rafOn = false;
  function queueCtl(id, v) {
    pending.set(id, v);
    if (rafOn) return;
    rafOn = true;
    requestAnimationFrame(() => { rafOn = false; for (const [cid, cv] of pending) send({ k: 'ctl', id: cid, v: cv }); pending.clear(); });
  }
  for (const f of FADERS) {
    f.pos = f.def; f.touchedAt = 0;
    const el = document.createElement('div');
    el.className = 'fader';
    el.innerHTML = '<div class="lab"></div><div class="track"><div class="fill"></div>' + (f.mid ? '<div class="mid"></div>' : '') +
      '</div><div class="val"></div>';
    el.querySelector('.lab').textContent = f.label;
    el.querySelector('.lab').style.color = f.color;
    $(f.box || 'faders').appendChild(el);
    const track = el.querySelector('.track'), fill = el.querySelector('.fill'), val = el.querySelector('.val');
    track.style.borderColor = f.color + '88';
    fill.style.background = 'linear-gradient(0deg, ' + f.color + '55, ' + f.color + ')';
    f.draw = () => { fill.style.height = (f.pos / f.max * 100) + '%'; val.textContent = f.fmt(f.pos); };
    const setPos = p => {
      p = Math.round(Math.max(0, Math.min(f.max, p)));
      if (f.snap) p = f.snap(p);
      f.touchedAt = performance.now();
      if (p === f.pos) return;
      f.pos = p; f.draw(); if (f.id) queueCtl(f.id, p);
    };
    let y0 = 0, p0 = 0;
    track.addEventListener('pointerdown', e => {
      track.setPointerCapture(e.pointerId);
      el.classList.add('held'); f.held = true;
      y0 = e.clientY; p0 = f.pos; f.touchedAt = performance.now();
    });
    track.addEventListener('pointermove', e => {
      if (!track.hasPointerCapture(e.pointerId)) return;
      const h = track.getBoundingClientRect().height || 1;
      setPos(p0 + (y0 - e.clientY) / h * f.max);
    });
    const up = () => { el.classList.remove('held'); f.held = false; f.touchedAt = performance.now(); };
    track.addEventListener('pointerup', up);
    track.addEventListener('pointercancel', up);
    f.draw();
  }

  // Explicit performance reset; startup and authored cue values stay as
  // they are. Send every value even if its local readout already matches.
  const SHOW_DEFAULTS = {
    lpf: 1000, hpf: 0, slideRate: 500, vol: 100,
    finaleDrone: 0, finalePiano: 0, finaleChoir: 0, finaleAmb: 0,
    finaleHum: 0, finaleSun: 0, finaleWind: 0, heartMaster: 0,
    screenGate: 100, mwtsVolume: 100
  };
  $('defaults').onclick = () => {
    const now = performance.now();
    for (const f of FADERS) {
      f.pos = SHOW_DEFAULTS[f.id];
      f.touchedAt = now;
      f.draw();
      queueCtl(f.id, f.pos);
    }
  };

  // ---------- transport ----------
  // One play/pause toggle: it shows the state (green playing, red paused;
  // the glyph is the action a tap takes), flips on tap, and Presence's
  // status reports keep it honest if a word is lost.
  let slidePlay = true;
  const drawPlay = () => {
    const b = $('playpause');
    b.classList.toggle('playing', slidePlay);
    b.classList.toggle('paused', !slidePlay);
  };
  drawPlay();
  $('playpause').onclick = () => { slidePlay = !slidePlay; drawPlay(); send({ k: 'ctl', id: 'slidePlay', v: slidePlay }); };

  // ---------- the duck and its settings ----------
  // xf: the slides' Crossfade (slideXfade), seconds, kept here with the duck's
  const DUCK_DEF = { amt: 0.7, dn: 0.15, up: 0.8, xf: 0.5 };
  let duckSet = Object.assign({}, DUCK_DEF);
  try { Object.assign(duckSet, JSON.parse(localStorage.getItem('show.duck') || '{}')); } catch (e) {}
  const saveDuck = () => { try { localStorage.setItem('show.duck', JSON.stringify(duckSet)); } catch (e) {} };
  // DUCK is held, not latched: down at the touch, up again when the finger
  // lifts, is cancelled (the system took the touch) or slides off the
  // button. No pointer capture (the touch's implicit one is released), so
  // sliding off does fire pointerleave. Only
  // the finger that pressed it lets it go; the page going to the background
  // lets it go too, so the room is never left ducked.
  let duckPtr = null;
  const sendDuck = on => send({ k: 'duck', on, amt: duckSet.amt, dn: duckSet.dn, up: duckSet.up });
  const duckBtn = $('duck');
  function duckOff(e) {
    if (duckPtr === null || (e && e.pointerId !== undefined && e.pointerId !== duckPtr)) return;
    duckPtr = null;
    duckBtn.classList.remove('on');
    sendDuck(false);
  }
  duckBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    // a touch is captured to its button implicitly; let it go, so sliding
    // off the button reaches pointerleave
    try { if (duckBtn.hasPointerCapture(e.pointerId)) duckBtn.releasePointerCapture(e.pointerId); } catch (err) {}
    if (duckPtr !== null) return;
    duckPtr = e.pointerId;
    duckBtn.classList.add('on');
    sendDuck(true);
  });
  duckBtn.addEventListener('pointerup', duckOff);
  duckBtn.addEventListener('pointercancel', duckOff);
  duckBtn.addEventListener('pointerleave', duckOff);
  duckBtn.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') duckOff(); });

  // audition: a duck setting's slider ducks the room while a finger is on
  // it, so the setting is heard as it is set. The press ducks with the fade
  // down as it stands; a move that changes the setting sends the duck again
  // (the amount glides to the new depth); the lift lets go with the fade up
  // as it stands, unless the DUCK button itself is still held.
  function makeSlider(el, label, get, set, fmt, audition) {
    el.className = 'slider';
    el.innerHTML = '<div class="fill"></div><span class="lab"></span><span class="val"></span>';
    el.querySelector('.lab').textContent = label;
    const fill = el.querySelector('.fill'), val = el.querySelector('.val');
    const draw = () => { fill.style.width = (get() * 100) + '%'; val.textContent = fmt(); };
    // held and touchedAt let Presence's reports leave a slider alone while
    // a finger is on it, as the faders do
    const sl = { draw, held: false, touchedAt: 0 };
    const at = e => { const r = el.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
    const move = e => {
      const was = get();
      set(at(e)); draw();
      if (audition && get() !== was) sendDuck(true);
    };
    const lift = e => {
      if (!el.hasPointerCapture(e.pointerId)) return;
      el.releasePointerCapture(e.pointerId);
      sl.held = false; sl.touchedAt = performance.now();
      saveDuck();
      if (audition && duckPtr === null) sendDuck(false);
    };
    el.addEventListener('pointerdown', e => {
      el.setPointerCapture(e.pointerId);
      sl.held = true; sl.touchedAt = performance.now();
      set(at(e)); draw();
      if (audition) sendDuck(true);
    });
    el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) move(e); });
    el.addEventListener('pointerup', lift);
    el.addEventListener('pointercancel', lift);
    draw();
    return sl;
  }
  makeSlider($('sAmt'), 'Duck amount', () => duckSet.amt, u => { duckSet.amt = Math.round(u * 100) / 100; },
    () => Math.round(duckSet.amt * 100) + '%', true);
  makeSlider($('sDn'), 'Fade down', () => duckSet.dn / 1, u => { duckSet.dn = Math.round(u * 100) / 100; },
    () => duckSet.dn.toFixed(2) + ' s', true);
  makeSlider($('sUp'), 'Fade up', () => duckSet.up / 3, u => { duckSet.up = Math.round(u * 3 * 20) / 20; },
    () => duckSet.up.toFixed(2) + ' s', true);
  // Crossfade: 0 to 10 s in 0.05 s steps, sent as the control's position
  // (hundredths of a second) whenever it moves
  if (!(duckSet.xf >= 0 && duckSet.xf <= 10)) duckSet.xf = DUCK_DEF.xf;
  makeSlider($('sXf'), 'Crossfade', () => duckSet.xf / 10, u => {
    const xf = Math.round(u * 10 * 20) / 20;
    if (xf === duckSet.xf) return;
    duckSet.xf = xf;
    queueCtl('slideXfade', Math.round(xf * 100));
  }, () => duckSet.xf > 0 ? duckSet.xf.toFixed(2) + ' s' : 'cut');
  makeSlider($('sPreviewDelay'), 'Preview delay compensation', () => previewDelayMs / PREVIEW_DELAY_MAX, u => {
    previewDelayMs = Math.round(u * PREVIEW_DELAY_MAX / 5) * 5;
    try { localStorage.setItem('show.previewDelayMs', String(previewDelayMs)); } catch (e) {}
    if (cuePreviews) cuePreviews.sync();
  }, () => previewDelayMs + ' ms');
  // Filters: the global Lowpass's and Highpass's resonance (lpfRes, hpfRes),
  // the peak at each corner, 0 (flat) to 24 dB in 0.5 dB steps, sent in dB
  // whenever it moves. They live on the laptop, not here: Presence's reports
  // bring them back (key lr, hr) once no finger is on them.
  const RES_MAX = 24;
  const resText = db => db <= 0 ? 'flat' : db.toFixed(1) + ' dB';
  const RES = [
    { id: 'lpfRes', key: 'lr', el: 'sLr', label: 'LP resonance', db: 0 },
    { id: 'hpfRes', key: 'hr', el: 'sHr', label: 'HP resonance', db: 0 }
  ];
  for (const r of RES) {
    r.sl = makeSlider($(r.el), r.label, () => r.db / RES_MAX, u => {
      const db = Math.round(u * RES_MAX * 2) / 2;
      if (db === r.db) return;
      r.db = db;
      queueCtl(r.id, db);
    }, () => resText(r.db));
  }
  // and their interpolation: the time constant of the exponential smooth
  // every filter move glides with on the laptop, 0 (a jump) to 200 ms in
  // 1 ms steps, likewise living there and reported back (key fg)
  const GLIDE_MAX = 200;
  const glide = { id: 'filterGlide', key: 'fg', ms: 25 };
  glide.sl = makeSlider($('sFg'), 'Filter interpolation', () => glide.ms / GLIDE_MAX, u => {
    const ms = Math.round(u * GLIDE_MAX);
    if (ms === glide.ms) return;
    glide.ms = ms;
    queueCtl(glide.id, ms);
  }, () => glide.ms + ' ms');
  // the title clears the laptop's screen: its drawer and windows shut
  $('title').onclick = () => send({ k: 'clean' });
  $('gear').onclick = () => $('modal').classList.add('open');
  $('close').onclick = () => { saveDuck(); $('modal').classList.remove('open'); };
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) { saveDuck(); $('modal').classList.remove('open'); } });

  // ---------- the paths (remote.html's, two rooms each) ----------
  // Per path: the command socket (this page broadcasting on ROOM, which is
  // where the round trip and the count of Presence screens come from) and
  // the status socket (following STATUS_ROOM).
  const paths = [{ name: 'cloud', base: 'wss://' + HOST }];
  if (LOCAL_HOST) paths.push({ name: 'local', base: 'ws://' + LOCAL_HOST });
  const HEALTH_MS = 1000, HEALTH_TIMEOUT = 3000;
  for (const p of paths) Object.assign(p, { cmd: mkSock(), st: mkSock(), rtt: NaN, peers: 0,
    healthPending: new Map(), healthAt: -Infinity });
  function mkSock() { return { ws: null, retry: 2000, timer: 0 }; }
  const isOpen = s => s.ws && s.ws.readyState === 1;

  function render() {
    $('paths').innerHTML = paths.map(p => {
      const open = isOpen(p.cmd);
      return '<span class="path-status"><span class="dot' + (open ? ' on' : '') + '"></span><b>' + p.name + '</b>' +
        '<span class="path-latency">' + (open ? (isNaN(p.rtt) ? '…' : p.rtt + ' ms') : 'off') + '</span>' +
        '<span class="path-peers">' + (open ? '· ' + p.peers + ' screen' + (p.peers === 1 ? '' : 's') : '&nbsp;') + '</span></span>';
    }).join('');
    renderHealth();
  }
  function renderHealth() {
    const now = performance.now();
    const healthy = paths.some(p => isOpen(p.cmd) && isOpen(p.st) && p.peers > 0 && now - p.healthAt < HEALTH_TIMEOUT);
    const el = $('appHealth');
    el.classList.toggle('on', healthy);
    const label = healthy ? 'App status: laptop replied after completing a frame' : 'App status: no recent round-trip reply from laptop';
    el.setAttribute('aria-label', label); el.title = label;
  }
  function resetHealth(p) { p.healthPending.clear(); p.healthAt = -Infinity; }
  // A transient word traverses the command room and comes back through the
  // status room on the same route. Ordinary relay pongs never mark it healthy.
  function probeHealth(p) {
    const now = performance.now();
    for (const [token, sent] of p.healthPending) if (now - sent >= HEALTH_TIMEOUT) p.healthPending.delete(token);
    if (!isOpen(p.cmd) || !isOpen(p.st) || p.peers <= 0) return;
    const token = SID + ':' + (++healthSeq);
    p.healthPending.set(token, now);
    sendOn(p.cmd, { t: 'word', k: 'health', src: SID, probe: token });
  }
  setInterval(() => { for (const p of paths) probeHealth(p); renderHealth(); }, HEALTH_MS);
  setInterval(renderHealth, 250);
  function probe(p) { for (let i = 0; i < 3; i++) setTimeout(() => sendOn(p.cmd, { t: 'time', c: Date.now() }), i * 150); }
  setInterval(() => { for (const p of paths) if (isOpen(p.cmd)) probe(p); }, 10000);

  function open() {
    for (const p of paths) { openSock(p, p.cmd, ROOM, 'broadcast'); openSock(p, p.st, STATUS_ROOM, 'follow'); }
    render();
    wake();
  }
  function openSock(p, s, roomName, role) {
    clearTimeout(s.timer); s.timer = 0;
    try { s.ws = new WebSocket(p.base + '/room/' + roomName + '?role=' + role + '&key=' + encodeURIComponent(KEY)); }
    catch (e) { s.timer = setTimeout(() => openSock(p, s, roomName, role), s.retry); return; }
    const ws = s.ws;
    ws.onopen = () => { s.retry = 2000; if (role === 'broadcast') probe(p); probeHealth(p); render(); };
    ws.onclose = () => {
      if (s.ws !== ws) return;
      if (role === 'broadcast') p.rtt = NaN;
      resetHealth(p);
      render();
      s.timer = setTimeout(() => openSock(p, s, roomName, role), s.retry); s.retry = Math.min(s.retry * 2, 15000);
    };
    ws.onmessage = e => { if (typeof e.data === 'string' && e.data !== 'pong') { try { take(JSON.parse(e.data), p, role); } catch (err) {} } };
    s.reopen = () => openSock(p, s, roomName, role);
  }
  // Back from sleep (the iPad's screen off, the page in the background):
  // any path that dropped is tried again now rather than after its backoff.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    for (const p of paths) {
      resetHealth(p);
      for (const s of [p.cmd, p.st]) if (s.reopen && !isOpen(s) && !(s.ws && s.ws.readyState === 0)) { s.retry = 2000; s.reopen(); }
      probeHealth(p);
    }
    renderHealth();
    wake();
  });
  setInterval(() => { for (const p of paths) for (const s of [p.cmd, p.st]) if (isOpen(s)) s.ws.send('ping'); }, 20000);
  function sendOn(s, m) { if (isOpen(s)) s.ws.send(JSON.stringify(m)); }

  const SID = Math.random().toString(36).slice(2, 10);
  let seq = 0, healthSeq = 0;
  // The sender rides as src: a ctl's own 'id' is the control's id, and
  // must never be overwritten (it once was, and every fader was dropped).
  function send(m) {
    m.t = 'word'; m.n = ++seq; m.src = SID;
    for (const p of paths) sendOn(p.cmd, m);
  }

  // Presence's reports: the newest from each sender wins.
  const lastQ = new Map();
  function take(m, p, role) {
    if (m.t === 'time') { p.rtt = Date.now() - m.c; render(); return; }
    if (m.t === 'count') {
      if (role === 'broadcast') {
        const before = p.peers;
        p.peers = m.n;
        if (p.peers <= 0) resetHealth(p);
        else if (before <= 0) probeHealth(p);
        render();
      }
      return;
    }
    if (role === 'follow' && m.t === 'word' && m.k === 'health' && m.to === SID) {
      const sent = p.healthPending.get(m.probe), now = performance.now();
      if (sent !== undefined && now - sent < HEALTH_TIMEOUT && isOpen(p.cmd) && isOpen(p.st) && p.peers > 0) {
        p.healthPending.delete(m.probe); p.healthAt = now; renderHealth();
      }
      return;
    }
    if (role !== 'follow' || m.t !== 'state' || m.k !== 'step') return;
    const id = String(m.src || ''), q = +m.q || 0;
    if (q <= (lastQ.get(id) || 0)) return;
    lastQ.set(id, q);
    const previousStep = statusStep;
    statusStep = typeof m.i === 'number' ? m.i : -1;
    const cueChanged = statusStep !== previousStep;
    $('presence').innerHTML = 'Presence: <b>' + (statusStep >= 0 ? 'cue ' + (statusStep + 1) : 'no cue') + ' of ' + (m.n | 0) +
      (statusStep >= 0 && !m.p ? ' · paused' : '') + '</b>';
    $('showBar').style.width = (m.n > 0 && statusStep >= 0 ? (statusStep + 1) / m.n * 100 : 0) + '%';
    drawCues();
    setProg(m.vp);
    const sl = m.sl || {};
    const now = performance.now();
    for (const f of FADERS) {
      const v = sl[f.key];
      // A new cue restores its authored faders even just after a gesture.
      // Same-cue reports keep the grace period so a delayed echo cannot
      // fight the operator's finger.
      if (typeof v === 'number' && isFinite(v) && !f.held && (cueChanged || now - f.touchedAt > 800) && !pending.has(f.id)) { f.pos = Math.min(f.max, v); f.draw(); }
    }
    for (const r of RES) {
      const v = sl[r.key];
      if (typeof v === 'number' && isFinite(v) && !r.sl.held && now - r.sl.touchedAt > 800 && !pending.has(r.id)) {
        r.db = Math.max(0, Math.min(RES_MAX, v)); r.sl.draw();
      }
    }
    {
      const v = sl[glide.key];
      if (typeof v === 'number' && isFinite(v) && !glide.sl.held && now - glide.sl.touchedAt > 800 && !pending.has(glide.id)) {
        glide.ms = Math.max(0, Math.min(GLIDE_MAX, Math.round(v))); glide.sl.draw();
      }
    }
    if (typeof sl.play === 'boolean') { slidePlay = sl.play; drawPlay(); }
  }

  // ---------- keep the screen on ----------
  let lock = null;
  async function wake() {
    if (lock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
    try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch (e) {}
  }
  document.addEventListener('click', wake);

  unlock();
})();
</script>
</body>
