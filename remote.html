<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mirror Test</title>
<!--
  A first test of the browser as the whole show: the iPad (?controller) and
  the laptop (?presentation) meet in a broadcast relay room, and every move
  on the one lands on the other. Sliders mirror, buttons flash, and a local
  video plays, pauses and changes speed (varispeed: the pitch goes with it).

  The tunnel is the existing relay (broadcast-worker/): the controller joins
  a mirror- room as its broadcaster, the presentation as a follower, both
  with the password the relay checks (see its Mirror rooms note). Live moves ride 'word' messages, which the
  relay passes on and never stores; a 'state' snapshot follows each burst of
  moves, which the relay keeps, so a presentation that joins late lands on
  where things are.

  Latency: both pages set their clocks by the relay's (the {t:'time'} probe,
  NTP's trick: the best of a burst, by round trip), every message carries
  the moment it left on that shared clock, and the presentation shows how
  long each took to arrive.
-->
<style>
:root {
  --bg: #0b0d12; --panel: #151922; --line: #262c3a; --ink: #e8ecf4; --dim: #8a93a6;
  --gold: #f2c14e; --flash: #ffe28a; --ok: #6fd08c; --bad: #ff7a7a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { padding: 16px; max-width: 1100px; margin: 0 auto; user-select: none; -webkit-user-select: none; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 14px; }
h1 { font-size: 20px; margin: 0; }
.role { color: var(--gold); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; font-weight: 600; }
.status { color: var(--dim); font-size: 13px; }
.status b { color: var(--ink); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
.dot.on { background: var(--ok); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card h2 { font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }
.slider { position: relative; height: 54px; border-radius: 10px; background: #0f1219; border: 1px solid var(--line);
  margin-bottom: 10px; overflow: hidden; touch-action: none; }
.slider .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #6b5216, var(--gold)); }
.slider .lab { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-weight: 600; mix-blend-mode: difference; }
.slider .val { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-variant-numeric: tabular-nums; mix-blend-mode: difference; }
.buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.btn { height: 74px; border-radius: 12px; border: 1px solid var(--line); background: #1d2230; color: var(--ink);
  font-family: inherit; font-weight: 600; font-size: 18px; display: grid; place-items: center; touch-action: manipulation; }
.btn.flash { animation: flash .45s ease-out; }
@keyframes flash { 0% { background: var(--flash); color: #000; box-shadow: 0 0 28px var(--flash); } 100% { background: #1d2230; } }
.row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.big { height: 54px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: #1d2230; color: var(--ink);
  font-family: inherit; font-weight: 600; font-size: 16px; touch-action: manipulation; }
video { width: 100%; border-radius: 10px; background: #000; display: block; margin-bottom: 10px; aspect-ratio: 16/9; }
.lat { font-variant-numeric: tabular-nums; }
.lat .now { font-size: 40px; font-weight: 700; color: var(--gold); }
.lat .stats { color: var(--dim); font-size: 13px; }
.log { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--dim); height: 180px; overflow: hidden; margin-top: 8px; white-space: pre; }
.hint { color: var(--dim); font-size: 13px; }
.drop { border: 1px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; color: var(--dim); margin-bottom: 10px; }
#mute.on { background: var(--bad); color: #000; border-color: var(--bad); }
#lock { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 10; padding: 16px; }
#lock form { display: grid; gap: 12px; width: min(340px, 100%); text-align: center; }
#lock input { height: 54px; font-size: 20px; text-align: center; }
#lock .msg { min-height: 20px; color: var(--bad); font-size: 14px; }
input[type=text], input[type=password] { height: 40px; border-radius: 8px; border: 1px solid var(--line); background: #0f1219; color: var(--ink); padding: 0 10px; font: inherit; }
</style>
</head>
<body>
<div id="lock">
  <form id="lockForm" autocomplete="on">
    <h1>Mirror Test</h1>
    <input type="password" id="pw" placeholder="password" autocomplete="current-password" autofocus>
    <button class="big" type="submit">Unlock</button>
    <div class="msg" id="lockMsg"></div>
  </form>
</div>
<header>
  <h1>Mirror Test</h1>
  <span class="role" id="role"></span>
  <span class="status" id="paths"></span>
  <span class="status">room <b id="roomName"></b></span>
  <button class="big" id="switch" style="height:36px;font-size:14px;margin-left:auto"></button>
  <button class="big" id="mute" style="height:36px;font-size:14px" hidden></button>
</header>

<div class="grid">
  <div class="card">
    <h2>Sliders</h2>
    <div id="sliders"></div>
    <h2 style="margin-top:14px">Buttons</h2>
    <div class="buttons" id="buttons"></div>
  </div>

  <div class="card">
    <h2>Video</h2>
    <div id="videoBox"></div>
    <div class="row">
      <button class="big" id="play">Play</button>
      <button class="big" id="rate1">1×</button>
      <button class="big" id="restart">⟲ Start</button>
    </div>
    <div class="slider" id="rateSlider"><div class="fill"></div><span class="lab">Speed</span><span class="val"></span></div>
    <div id="volSlider"></div>
    <div id="lpSlider"></div>
    <div id="hpSlider"></div>
  </div>

  <div class="card" style="grid-column: 1 / -1">
    <h2 id="latTitle">Latency</h2>
    <div class="lat"><span class="now" id="latNow">–</span> <span class="stats" id="latStats"></span></div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
'use strict';
(() => {
  // ---------- who we are ----------
  const QS = location.search;
  const P = new URLSearchParams(QS);
  const ROLE = /presentation/.test(QS) ? 'presentation' : 'controller';
  const CTRL = ROLE === 'controller';
  // always a mirror- room, the ones the relay locks with the password
  let ROOM = (P.get('room') || 'test').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^mirror-/, '');
  ROOM = ('mirror-' + ROOM).slice(0, 64);
  // Two paths, used at once: the Cloudflare relay (needs internet), and the
  // local relay on the laptop (tools/mirror-local.mjs; needs only a shared
  // Wi-Fi, like OSC). A page the laptop served (http) has both; on the
  // secure site the presentation still reaches the laptop's own relay at
  // localhost, and the controller (an iPad, where Safari forbids it) has the
  // cloud alone until it switches to the laptop's page.
  const HOST = P.get('relay') || 'the-signal-broadcast.robertalexander-music.workers.dev';
  const MAC = P.get('mac') || 'Roberts-MacBook-Pro-2.local:8800';
  // where Switch to Cloud goes when the page did not come from there
  const CLOUD_PAGE = P.get('cloud') || 'https://sun-layer.presence-generator.pages.dev';
  const SERVED_LOCAL = location.protocol === 'http:';
  const LOCAL_HOST = SERVED_LOCAL ? location.host : CTRL ? '' : 'localhost:8800';
  const $ = id => document.getElementById(id);
  $('role').textContent = ROLE;
  $('roomName').textContent = ROOM;
  $('latTitle').textContent = CTRL ? 'Sent (and each path\'s round trip)' : 'Arrival latency (one way, controller → here, first copy wins)';

  // The password. The relay checks it (POST /auth, and again on every
  // connection to a mirror room), never this page; one that works is
  // remembered on this device, and asked again only if it stops working.
  let KEY = '';
  try { KEY = localStorage.getItem('mirror.pw') || ''; } catch (e) {}
  // Switching between Cloud and Local hands the password over in the
  // address's #fragment, which never reaches any server, and is wiped from
  // the address bar at once.
  {
    const hk = new URLSearchParams(location.hash.slice(1)).get('k');
    if (hk) {
      KEY = hk;
      try { localStorage.setItem('mirror.pw', hk); } catch (e) {}
      history.replaceState(null, '', location.pathname + location.search);
    }
  }
  async function check(pw) {
    try {
      // the laptop's relay checks for a page it served; the cloud otherwise
      const r = await fetch(SERVED_LOCAL ? '/auth' : 'https://' + HOST + '/auth', { method: 'POST', body: pw });
      return r.status === 200 ? 'ok' : r.status === 403 ? 'no' : 'down';
    } catch (e) { return 'down'; }
  }
  async function unlock() {
    const lockMsg = $('lockMsg');
    if (KEY) {
      const v = await check(KEY);
      // a remembered password stands even if the relay can't be reached
      // right now; the connection retries until it can
      if (v !== 'no') { $('lock').remove(); open(); return; }
      try { localStorage.removeItem('mirror.pw'); } catch (e) {}
      KEY = ''; lockMsg.textContent = 'That password no longer works.';
    }
    $('lockForm').onsubmit = async e => {
      e.preventDefault();
      const pw = $('pw').value;
      if (!pw) return;
      lockMsg.style.color = 'var(--dim)'; lockMsg.textContent = 'checking…';
      const v = await check(pw);
      lockMsg.style.color = '';
      if (v === 'ok') {
        KEY = pw;
        try { localStorage.setItem('mirror.pw', pw); } catch (e) {}
        $('lock').remove(); open();
      } else lockMsg.textContent = v === 'no' ? 'Wrong password.' : 'Can\'t reach the relay. Check the internet.';
    };
  }

  // Switch: Local opens this page from the laptop (the iPad by the Mac's
  // name), Cloud from the site; the password rides along (see above).
  {
    const sw = $('switch');
    sw.textContent = SERVED_LOCAL ? 'Switch to Cloud' : 'Switch to Local';
    sw.onclick = () => {
      const q = new URLSearchParams(location.search);
      let to;
      if (SERVED_LOCAL) {
        q.delete('cloud');
        to = CLOUD_PAGE + '/remote?' + q.toString();
      } else {
        q.set('cloud', location.origin);
        to = 'http://' + (CTRL ? MAC : 'localhost:8800') + '/remote.html?' + q.toString();
      }
      location.href = to + '#k=' + encodeURIComponent(KEY);
    };
  }

  // ---------- the control surface, the same on both sides ----------
  const N_SLIDERS = 3, N_BUTTONS = 4;
  // vol, lp and hp are slider positions, 0..1: volume, and the lowpass and
  // highpass corners on a log scale, 20 Hz to 20 kHz (both open by default)
  const S = { s: [0.5, 0.25, 0.75], rate: 1, playing: false, vol: 1, lp: 1, hp: 0 };

  function makeSlider(el, label, get, set, fmt) {
    if (!el.classList.contains('slider')) {
      el.className = 'slider';
      el.innerHTML = '<div class="fill"></div><span class="lab"></span><span class="val"></span>';
    }
    el.querySelector('.lab').textContent = label;
    const fill = el.querySelector('.fill'), val = el.querySelector('.val');
    const draw = () => { fill.style.width = (get() * 100) + '%'; val.textContent = fmt(); };
    if (CTRL) {
      const at = e => { const r = el.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
      el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); set(at(e)); draw(); });
      el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) { set(at(e)); draw(); } });
    }
    draw();
    return draw;
  }

  const drawS = [];
  for (let i = 0; i < N_SLIDERS; i++) {
    const el = document.createElement('div');
    $('sliders').appendChild(el);
    drawS[i] = makeSlider(el, 'Slider ' + (i + 1), () => S.s[i],
      v => { S.s[i] = v; send({ k: 's', i, v }); }, () => Math.round(S.s[i] * 100) + '%');
  }

  const btns = [];
  for (let i = 0; i < N_BUTTONS; i++) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = String.fromCharCode(65 + i);
    $('buttons').appendChild(b);
    btns[i] = b;
    if (CTRL) b.addEventListener('pointerdown', () => { flash(i); send({ k: 'b', i }); });
  }
  function flash(i) { const b = btns[i]; b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }

  // Speed 0.25x to 2x, the slider's middle is 1x: each half a log scale.
  const RMIN = 0.25, RMAX = 2;
  const rateToU = r => r <= 1 ? 0.5 * Math.log(r / RMIN) / Math.log(1 / RMIN) : 0.5 + 0.5 * Math.log(r) / Math.log(RMAX);
  const uToRate = u => u <= 0.5 ? RMIN * Math.pow(1 / RMIN, u / 0.5) : Math.pow(RMAX, (u - 0.5) / 0.5);
  const drawRate = makeSlider($('rateSlider'), 'Speed', () => rateToU(S.rate),
    u => { let r = uToRate(u); if (Math.abs(r - 1) < 0.04) r = 1; S.rate = Math.round(r * 100) / 100; applyVideo(); send({ k: 'r', v: S.rate }); },
    () => S.rate.toFixed(2) + '×');

  // Volume and the two filters, under Speed. Each move goes as {k, v} with
  // k the field's own name (vol, lp, hp).
  const hz = u => 20 * Math.pow(1000, u);
  const hzText = u => { const f = hz(u); return f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 1 : 2) + ' kHz' : Math.round(f) + ' Hz'; };
  const drawAudio = {};
  for (const [id, key, label, fmt] of [
    ['volSlider', 'vol', 'Volume', () => Math.round(S.vol * 100) + '%'],
    ['lpSlider', 'lp', 'Lowpass', () => S.lp >= 1 ? 'open' : hzText(S.lp)],
    ['hpSlider', 'hp', 'Highpass', () => S.hp <= 0 ? 'open' : hzText(S.hp)]
  ]) {
    drawAudio[key] = makeSlider($(id), label, () => S[key],
      u => { S[key] = Math.round(u * 1000) / 1000; applyAudio(); send({ k: key, v: S[key] }); }, fmt);
  }

  // ---------- the video ----------
  let video = null;
  if (!CTRL) {
    $('videoBox').innerHTML =
      '<div class="drop" id="drop">Drop a video here, or <button class="big" id="pick" style="height:40px">Choose a video…</button>' +
      '<div class="hint" style="margin-top:6px">It plays from this machine (e.g. 030_Audification_Explained.mp4). Nothing uploads.</div>' +
      '<input type="file" id="file" accept="video/*" hidden></div><video id="vid" playsinline></video>';
    video = $('vid');
    video.preservesPitch = false; video.mozPreservesPitch = false; video.webkitPreservesPitch = false;
    const load = f => { if (!f) return; video.src = URL.createObjectURL(f); $('drop').firstChild.textContent = f.name + ' — '; ensureAudio(); applyVideo(); };
    $('pick').onclick = () => $('file').click();
    $('file').onchange = e => load(e.target.files[0]);
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => { e.preventDefault(); load(e.dataTransfer.files[0]); });
  } else {
    $('videoBox').innerHTML = '<div class="hint" style="margin-bottom:10px">The video plays on the presentation. These drive it.</div>';
  }
  // The video's sound through Web Audio: highpass, lowpass, then volume.
  // Made on the first video chosen (a click, which lets audio start); a
  // setting that arrived before then is applied as it is made.
  let actx = null, hpf = null, lpf = null, gain = null;
  function ensureAudio() {
    if (actx || !video) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const src = actx.createMediaElementSource(video);
      hpf = actx.createBiquadFilter(); hpf.type = 'highpass'; hpf.Q.value = 0.707;
      lpf = actx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.Q.value = 0.707;
      gain = actx.createGain();
      src.connect(hpf).connect(lpf).connect(gain).connect(actx.destination);
      applyAudio(true);
    } catch (e) { log('audio graph failed: ' + e.message); }
  }
  function applyAudio(jump) {
    for (const k in drawAudio) drawAudio[k]();
    if (!actx) return;
    const t = actx.currentTime;
    // open filters sit at the ends of the range, so they pass everything
    const to = [[gain.gain, S.vol * S.vol], [lpf.frequency, S.lp >= 1 ? 20000 : hz(S.lp)], [hpf.frequency, S.hp <= 0 ? 10 : hz(S.hp)]];
    for (const [param, v] of to) { if (jump) param.value = v; else param.setTargetAtTime(v, t, 0.015); }
  }

  function applyVideo() {
    $('play').textContent = S.playing ? 'Pause' : 'Play';
    drawRate();
    if (!video || !video.src) return;
    video.playbackRate = S.rate;
    if (actx && actx.state === 'suspended') actx.resume();
    if (S.playing && video.paused) video.play().catch(err => log('play blocked: ' + err.message + ' (click the page once)'));
    if (!S.playing && !video.paused) video.pause();
  }
  if (CTRL) {
    $('play').onclick = () => { S.playing = !S.playing; applyVideo(); send({ k: 'p', v: S.playing }); };
    $('rate1').onclick = () => { S.rate = 1; applyVideo(); send({ k: 'r', v: 1 }); };
    $('restart').onclick = () => send({ k: 'z' });
  } else {
    for (const id of ['play', 'rate1', 'restart']) $(id).disabled = true;
  }

  // ---------- mute: the presentation stays open but takes no moves ----------
  // Connected and clocked as ever; every move and state that arrives is
  // dropped until it is unmuted. Remembered on this machine across reloads.
  let muted = false;
  if (!CTRL) {
    try { muted = localStorage.getItem('mirror.muted') === '1'; } catch (e) {}
    const mb = $('mute');
    const show = () => { mb.textContent = muted ? 'Incoming muted · unmute' : 'Mute incoming connections'; mb.classList.toggle('on', muted); };
    mb.hidden = false; show();
    mb.onclick = () => {
      muted = !muted; show();
      try { localStorage.setItem('mirror.muted', muted ? '1' : '0'); } catch (e) {}
      log(muted ? 'incoming muted' : 'incoming unmuted');
    };
  }

  // ---------- the paths: one socket, one clock each ----------
  // Each relay answers {t:'time'} with its own clock (NTP's trick: the best
  // of a burst, by round trip), and every message leaves stamped on the
  // clock of the path it travels, so each arrival is timed on that path.
  const paths = [{ name: 'cloud', base: 'wss://' + HOST }];
  if (LOCAL_HOST) paths.push({ name: 'local', base: 'ws://' + LOCAL_HOST });
  for (const p of paths) Object.assign(p, { ws: null, retry: 2000, offset: NaN, best: Infinity, rtt: NaN, peers: 0, lats: [] });
  const isOpen = p => p.ws && p.ws.readyState === 1;
  const pathNow = p => Date.now() + p.offset;

  function render() {
    $('paths').innerHTML = paths.map(p =>
      '<span class="dot' + (isOpen(p) ? ' on' : '') + '"></span><b>' + p.name + '</b> ' +
      (isOpen(p) ? (isNaN(p.rtt) ? '…' : p.rtt + ' ms') + (CTRL ? ' · ' + p.peers + ' screen' + (p.peers === 1 ? '' : 's') : '') : 'off')
    ).join(' &nbsp; ');
  }

  function probe(p) { for (let i = 0; i < 6; i++) setTimeout(() => sendOn(p, { t: 'time', c: Date.now() }), i * 120); }
  function takeTime(m, p) {
    const t1 = Date.now(), rtt = t1 - m.c;
    p.rtt = rtt;
    // the best round trip so far sets the clock; the bar is let down as it
    // ages, so a drifting clock is still followed
    if (rtt <= p.best * 1.2 || isNaN(p.offset)) { p.best = Math.min(p.best, rtt); p.offset = m.s - (m.c + t1) / 2; }
    render();
  }
  setInterval(() => { for (const p of paths) { p.best *= 1.5; if (isOpen(p)) probe(p); } }, 10000);

  function open() { for (const p of paths) openPath(p); render(); }
  function openPath(p) {
    const role = CTRL ? 'broadcast' : 'follow';
    try { p.ws = new WebSocket(p.base + '/room/' + ROOM + '?role=' + role + '&key=' + encodeURIComponent(KEY)); }
    catch (e) { setTimeout(() => openPath(p), p.retry); return; }
    p.ws.onopen = () => { p.retry = 2000; render(); probe(p); if (CTRL) sendState(); };
    p.ws.onclose = () => {
      p.rtt = NaN; render();
      setTimeout(() => openPath(p), p.retry); p.retry = Math.min(p.retry * 2, 15000);
    };
    p.ws.onmessage = e => { if (typeof e.data === 'string' && e.data !== 'pong') { try { take(JSON.parse(e.data), p); } catch (err) {} } };
  }
  setInterval(() => { for (const p of paths) if (isOpen(p)) p.ws.send('ping'); }, 20000);
  function sendOn(p, m) { if (isOpen(p)) p.ws.send(JSON.stringify(m)); }

  // A move goes at once, down every open path, as a 'word' (relayed, not
  // stored), numbered so the far side acts on whichever copy lands first;
  // 300 ms after the last move the whole state goes as a 'state' each relay
  // keeps for joiners.
  const SID = Math.random().toString(36).slice(2, 10);
  let seq = 0, stateTimer = null;
  function send(m) {
    m.t = 'word'; m.n = ++seq; m.id = SID;
    const via = [];
    for (const p of paths) if (isOpen(p)) { m.at = isNaN(p.offset) ? 0 : pathNow(p); sendOn(p, m); via.push(p.name); }
    log('sent #' + m.n + ' ' + describe(m) + '  via ' + (via.join(' + ') || 'NOTHING (no path open)'));
    $('latNow').textContent = '#' + m.n;
    clearTimeout(stateTimer); stateTimer = setTimeout(sendState, 300);
  }
  function sendState() { for (const p of paths) sendOn(p, { t: 'state', snap: { mirror: S }, at: isNaN(p.offset) ? 0 : pathNow(p) }); }

  let lastId = '', lastN = 0;
  function stats(p) {
    const l = p.lats;
    if (!l.length) return p.name + ': –';
    const sorted = l.slice().sort((a, b) => a - b);
    return p.name + ': median ' + sorted[sorted.length >> 1] + ' · min ' + sorted[0] + ' · max ' + sorted[sorted.length - 1] + ' ms';
  }
  function take(m, p) {
    if (m.t === 'time') return takeTime(m, p);
    if (m.t === 'count') { p.peers = m.n; render(); return; }
    if (CTRL || muted) return;
    if (m.t === 'state' && m.snap && m.snap.mirror) {
      Object.assign(S, m.snap.mirror); S.s = m.snap.mirror.s.slice();
      drawS.forEach(d => d()); applyVideo(); applyAudio(); return;
    }
    if (m.t !== 'word' || !m.k) return;
    const ms = m.at && !isNaN(p.offset) ? Math.round(pathNow(p) - m.at) : NaN;
    if (!isNaN(ms)) { p.lats.push(ms); if (p.lats.length > 100) p.lats.shift(); }
    // a fresh controller (a reload, a switch) starts its count again
    if (m.id !== lastId) { lastId = m.id; lastN = 0; }
    if (m.n <= lastN) {
      log('     #' + m.n + ' also via ' + p.name + (isNaN(ms) ? '' : '  +' + ms + ' ms'));
    } else {
      lastN = m.n;
      if (m.k === 's') { S.s[m.i] = m.v; drawS[m.i](); }
      else if (m.k === 'b') flash(m.i);
      else if (m.k === 'p') { S.playing = m.v; applyVideo(); }
      else if (m.k === 'r') { S.rate = m.v; applyVideo(); }
      else if (m.k === 'z') { if (video) video.currentTime = 0; }
      else if (m.k === 'vol' || m.k === 'lp' || m.k === 'hp') { S[m.k] = m.v; applyAudio(); }
      $('latNow').textContent = isNaN(ms) ? p.name : ms + ' ms · ' + p.name;
      log('recv #' + m.n + ' ' + describe(m) + '  first via ' + p.name + (isNaN(ms) ? '  (clock not set yet)' : '  +' + ms + ' ms'));
    }
    $('latStats').textContent = paths.map(stats).join('   ');
  }
  if (CTRL) setInterval(() => { $('latStats').textContent = paths.map(p => p.name + ' round trip ' + (isNaN(p.rtt) ? '–' : p.rtt + ' ms')).join('   '); }, 1000);

  function describe(m) {
    return m.k === 's' ? 'slider ' + (m.i + 1) + ' → ' + Math.round(m.v * 100) + '%'
      : m.k === 'b' ? 'button ' + String.fromCharCode(65 + m.i)
      : m.k === 'p' ? (m.v ? 'play' : 'pause')
      : m.k === 'r' ? 'speed ' + m.v + '×'
      : m.k === 'z' ? 'to start'
      : m.k === 'vol' ? 'volume ' + Math.round(m.v * 100) + '%'
      : m.k === 'lp' ? 'lowpass ' + (m.v >= 1 ? 'open' : hzText(m.v))
      : m.k === 'hp' ? 'highpass ' + (m.v <= 0 ? 'open' : hzText(m.v)) : m.k;
  }
  const lines = [];
  function log(s) {
    const d = new Date(), p = (n, w) => String(n).padStart(w, '0');
    lines.unshift(p(d.getHours(), 2) + ':' + p(d.getMinutes(), 2) + ':' + p(d.getSeconds(), 2) + '.' + p(d.getMilliseconds(), 3) + '  ' + s);
    if (lines.length > 12) lines.length = 12;
    $('log').textContent = lines.join('\n');
  }

  unlock();
})();
</script>
</body>
</html>
