<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun Quality</title>
<!--
  The Sun's quality ladder side by side with this machine's screen: the
  composite exactly as Presence draws it (gpu/sun.wgsl.js: the five channel
  tiles of the 3 x 2 mosaic, tinted and summed as light, the Atmosphere
  blend, the circular feather), from any tier's file, on the Computer (the
  page's own screen, at its own pixels) or a simulated Phone (drawn at the
  phone's own device pixels).

  The number that matters is the upscale: the Sun's square on screen in
  device pixels over one tile of the video (a third of its width). Above 1x
  the screen has more pixels than the video gives it, and it softens.

  Served by tools/serve.mjs: http://localhost:8000/tools/sun-quality.html
  Plays this Mac's copies in sun-video/ first, the cloud's if one is missing.
-->
<style>
:root { --bg: #07080c; --panel: #12151d; --line: #262c3a; --ink: #e8ecf4; --dim: #8a93a6; --gold: #f2c14e; --warn: #ff9f6b; --ok: #6fd08c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { display: grid; grid-template-columns: 300px 1fr 280px; height: 100vh; }
#layers { background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; }
#layers .layer { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
#layers .layer.lit h2 { color: var(--gold); }
#layers label.row { grid-template-columns: 74px 1fr 40px; }
#layers { display: flex; flex-direction: column; }
#layerRows { flex: 1; }
#layers .lh { display: flex; align-items: center; justify-content: space-between; margin: 0 0 4px; }
#layers .lh h2 { margin: 0; cursor: pointer; }
#layers .lh h2:hover { color: var(--ink); }
#layers .pre { display: flex; gap: 3px; }
#side h1, #layers h1 { cursor: pointer; }
.keys { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 5px; }
#layers .bub { min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; border: 1px solid var(--line); background: #1b2030; color: var(--dim); font: inherit; font-size: 11px; cursor: pointer; }
#layers .bub.on { background: var(--gold); border-color: var(--gold); color: #000; }
#layers .bub.offb.on { background: var(--warn); border-color: var(--warn); }
#layers .heart { min-width: 22px; height: 22px; padding: 0; border: 0; background: none; color: #474d5c; font-size: 15px; line-height: 22px; cursor: pointer; }
#layers .heart.on { color: #ff5a7a; }
#layers .heart:disabled { opacity: .3; cursor: default; }
#layers .layer.bypassed label.row { opacity: .4; }
#layers .ctl { cursor: pointer; color: var(--ink); user-select: none; }
#layers .ctl.off { color: #474d5c; }
#layers label.row.off input, #layers label.row.off output { opacity: .35; }
#download { position: sticky; bottom: 0; align-self: flex-end; margin-top: 12px; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: #1b2030; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; }
#download:hover { color: var(--ink); }
#side { background: var(--panel); border-right: 1px solid var(--line); padding: 14px; overflow-y: auto; }
h1 { font-size: 17px; margin: 0 0 12px; }
h2 { font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 6px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.seg button { height: 34px; border-radius: 8px; border: 1px solid var(--line); background: #1b2030; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--gold); color: #000; border-color: var(--gold); }
#fit button, #tiers button { font-size: 12px; padding: 0 2px; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
td { padding: 3px 0; border-bottom: 1px solid #1c2130; vertical-align: top; }
td:last-child { text-align: right; }
tr.on td { color: var(--gold); }
.up-ok { color: var(--ok); } .up-soft { color: var(--warn); }
label.row { display: grid; grid-template-columns: 90px 1fr 46px; align-items: center; gap: 8px; margin: 6px 0; color: var(--dim); }
label.row output { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
select { width: 100%; height: 32px; background: #1b2030; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: inherit; }
.hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
#stage { position: relative; overflow: auto; display: grid; place-items: center; }
#stage.on-computer canvas { width: 100%; height: 100%; display: block; }
#stage.on-computer { overflow: hidden; }
.phone { position: relative; border: 10px solid #1d1f26; border-radius: 46px; background: #000; box-shadow: 0 0 0 2px #2e323d, 0 30px 80px rgba(0,0,0,.6); overflow: hidden; margin: 24px; }
.phone::before { content: ""; position: absolute; top: 10px; left: 50%; width: 30%; height: 26px; transform: translateX(-50%); background: #000; border-radius: 16px; z-index: 2; }
.phone canvas { display: block; }
#status { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="side">
  <h1>Sun Quality</h1>

  <h2>Source</h2>
  <div class="seg" id="sets">
    <button data-s="delivery">Delivery files</button>
    <button data-s="master">Master test</button>
  </div>
  <h2>Quality</h2>
  <div class="seg" id="tiers"></div>

  <h2>Device</h2>
  <div class="seg" id="devices">
    <button data-d="computer">Computer</button>
    <button data-d="phone">Phone</button>
  </div>
  <div id="phoneOpts" hidden>
    <h2>Phone model</h2>
    <select id="model"></select>
    <h2>Phone view</h2>
    <div class="seg" id="fit">
      <button data-f="real">Real size</button>
      <button data-f="actual">Actual pixels</button>
      <button data-f="fit">Fit window</button>
    </div>
    <label class="row">Screen ppi <input type="number" id="ppi" min="80" max="600" step="1" style="height:28px;background:#1b2030;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;padding:0 6px"><output></output></label>
  </div>

  <h2>Picture</h2>
  <label class="row">Sun size <input type="range" id="size" min="20" max="100" value="80"><output id="sizeOut"></output></label>
  <label class="row">Atmosphere <input type="range" id="atmo" min="0" max="100" value="25"><output id="atmoOut"></output></label>
  <div class="hint" id="atmoLayer"></div>
  <h2>Speed</h2>
  <div class="seg" id="speeds"></div>

  <h2>Upscale per tier, this view</h2>
  <table id="ups"></table>
  <div class="hint">The Sun's square on screen ÷ one tile of the video. Up to about 1.0× is crisp; above that the screen stretches the video.</div>

  <h2>This computer</h2>
  <table id="screen"></table>
</div>
<div id="stage"><canvas id="c"></canvas><div id="status"></div></div>
<div id="layers">
  <h1>Layers</h1>
  <label class="row">Crossfade <input type="range" id="xfade" min="0" max="100" value="20"><output id="xfadeOut"></output></label>
  <div class="seg"><button id="resetLayers">Reset all</button></div>
  <div id="layerRows"></div>
  <button id="download">Download settings</button>
</div>

<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const CLOUD = 'https://pub-716b01aa42b4455891728323b3586b99.r2.dev/';
  const LOCAL = '/sun-video/';
  // Two sets: the delivery files (gpu/sun.js TIERS, with trials) and the
  // master test, 10 s of the 2026-03-18 master day at every tier's size,
  // plain and sharpened (sun-video/test/, tools: scratchpad mastertest.sh).
  // ?set=master picks the second. Each file's size for the readout.
  const SET = new URLSearchParams(location.search).get('set') === 'master' ? 'master' : 'delivery';
  const DELIVERY = [
    { name: 'Min', stem: 'sun_mosaic_20260915_23289r_480', w: 720, mb: 46, mbps: 0.48 },
    // trials: Min with unsharp=5:5:0.5 in the downscale, its peaks back near
    // Low's; and that 10% brighter (luma x1.1)
    { name: 'Min+', stem: 'sun_mosaic_20260915_23289r_480s', w: 720, mb: 62, mbps: 0.64 },
    { name: 'Min+ ☀', stem: 'sun_mosaic_20260915_23289r_480b', w: 720, mb: 67, mbps: 0.69 },
    { name: 'Low', stem: 'sun_mosaic_20260915_23289r_720', w: 1080, mb: 91, mbps: 0.94 },
    { name: 'Standard', stem: 'sun_mosaic_20260915_23289r_1080', w: 1620, mb: 170, mbps: 1.75 },
    { name: 'High', stem: 'sun_mosaic_20260915_23289r', w: 2764, mb: 399, mbps: 4.1 },
    { name: 'Max', stem: 'sun_mosaic_20260904_23284', w: 3072, mb: 777, mbps: 8.0 }
  ];
  const MASTER = [];
  // [name, width, Mbps plain, Mbps sharpened] (HEVC CRF 26, this 10 s)
  for (const [n, w, a, b] of [['Min', 720, 0.56, 0.77], ['Low', 1080, 1.18, 1.67], ['Standard', 1620, 2.45, 3.45], ['High', 2764, 6.7, 9.8], ['Max', 3072, 9.0, 13.4]]) {
    const k = n.toLowerCase();
    MASTER.push({ name: n, file: 'test/master_' + k + '.mp4', w, mbps: a }, { name: n + '+', file: 'test/master_' + k + '_s.mp4', w, mbps: b });
  }
  // and after them: High+ at CRF 28 and 30 (its cost down)
  // Tiny (360p) heads the list
  MASTER.unshift({ name: 'Tiny', file: 'test/master_tiny.mp4', w: 540, mbps: 0.32 }, { name: 'Tiny+', file: 'test/master_tiny_s.mp4', w: 540, mbps: 0.43 });
  MASTER.push({ name: 'High+ c28', file: 'test/master_high_s_c28.mp4', w: 2764, mbps: 6.3 }, { name: 'High+ c30', file: 'test/master_high_s_c30.mp4', w: 2764, mbps: 4.0 });
  const TIERS = SET === 'master' ? MASTER : DELIVERY;
  const fileOf = t => t.file || t.stem + '_hevc.mp4';
  // CSS size, device pixel ratio and pixels per inch of each phone
  const PHONES = [
    { name: 'iPhone 16 Pro', w: 402, h: 874, dpr: 3, ppi: 460 },
    { name: 'iPhone 16 / 15', w: 393, h: 852, dpr: 3, ppi: 460 },
    { name: 'iPhone SE', w: 375, h: 667, dpr: 2, ppi: 326 },
    { name: 'Pixel 8', w: 412, h: 915, dpr: 2.625, ppi: 428 },
    { name: 'Galaxy S24', w: 360, h: 780, dpr: 3, ppi: 416 }
  ];
  const SPEEDS = [1, 2, 4, 8];
  const st = { tier: 3, device: 'computer', phone: 0, fit: 'real', speed: 1, ppi: 254 };
  try { Object.assign(st, JSON.parse(localStorage.getItem('sunQuality') || '{}')); } catch (e) {}
  // each set remembers its own tier
  st.tier = st['tier_' + SET] ?? st.tier;
  if (!(st.tier >= 0 && st.tier < TIERS.length)) st.tier = 0;
  const save = () => { st['tier_' + SET] = st.tier; try { localStorage.setItem('sunQuality', JSON.stringify(st)); } catch (e) {} };

  // ---------- the video ----------
  const video = document.createElement('video');
  video.crossOrigin = 'anonymous'; video.muted = true; video.loop = true; video.playsInline = true;
  let triedCloud = false;
  function load(keepTime) {
    const t = keepTime ? video.currentTime : 0;
    triedCloud = false;
    video.src = LOCAL + fileOf(TIERS[st.tier]);
    video.addEventListener('loadedmetadata', () => { try { video.currentTime = t; } catch (e) {} video.playbackRate = st.speed; video.play().catch(() => {}); }, { once: true });
  }
  video.addEventListener('error', () => {
    if (triedCloud || !TIERS[st.tier].stem) { $('status').textContent = 'Could not load ' + TIERS[st.tier].name + ' locally or from the cloud.'; return; }
    triedCloud = true;
    video.src = CLOUD + TIERS[st.tier].stem + '_hevc.mp4';
    video.play().catch(() => {});
  });

  // ---------- the composite, as gpu/sun.wgsl.js ----------
  const canvas = $('c');
  const gl = canvas.getContext('webgl2', { premultipliedAlpha: false });
  const VS = `#version 300 es
  in vec2 p; out vec2 uv;
  uniform vec2 extent; // the square's half size in clip space ('half' is reserved in GLSL)
  void main() { uv = p * 0.5 + 0.5; uv.y = 1.0 - uv.y; gl_Position = vec4(p * extent, 0.0, 1.0); }`;
  const FS = `#version 300 es
  precision highp float;
  in vec2 uv; out vec4 o;
  uniform sampler2D tex; uniform float g[5];
  // per layer: brightness, contrast, saturation (1 untouched) and elevate (0)
  uniform vec4 adj[5];
  vec3 tileAt(float col, float row) { return texture(tex, (uv + vec2(col, row)) / vec2(3.0, 2.0)).rgb; }
  // one layer: brightness and contrast on its tile, then its tint, then
  // its saturation about the Rec. 709 luma, then its Atmosphere gain
  vec3 layer(float col, float row, vec3 tint, int i) {
    if (g[i] <= 0.0) return vec3(0.0);
    vec3 c = tileAt(col, row) * adj[i].x;
    c = max((c - vec3(0.5)) * adj[i].y + vec3(0.5), vec3(0.0));
    // Elevate: a hump of lift, sin^2(pi x), 0 at black and full white (flat
    // there too), all of it at mid grey, a tenth at 10% and 90%; at 1 mid
    // grey rises to 0.75, and it never folds over
    vec3 x = min(c, vec3(1.0)), sn = sin(3.14159265 * x);
    c = x + 0.25 * adj[i].w * sn * sn;
    c *= tint / 255.0;
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    c = max(mix(vec3(l), c, adj[i].z), vec3(0.0));
    return c * g[i];
  }
  void main() {
    vec3 c = vec3(0.0);
    c += layer(0.0, 0.0, vec3(255.0, 154.0, 138.0), 0);
    c += layer(1.0, 0.0, vec3(255.0, 77.0, 46.0), 1);
    c += layer(2.0, 0.0, vec3(255.0, 194.0, 51.0), 2);
    c += layer(0.0, 1.0, vec3(201.0, 138.0, 75.0), 3);
    c += layer(1.0, 1.0, vec3(180.0, 140.0, 255.0), 4);
    c = min(c, vec3(1.0));
    float r = length(uv - vec2(0.5)) * 2.0;
    float w = max(mix(0.6, 0.0, 0.40), 0.003);
    c *= 1.0 - smoothstep(0.90 - w * 0.5, 0.90 + w * 0.5, r);
    o = vec4(c, 1.0);
  }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(s)); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aP = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  const uHalf = gl.getUniformLocation(prog, 'extent'), uG = gl.getUniformLocation(prog, 'g'), uAdj = gl.getUniformLocation(prog, 'adj');

  // the five layers, in the shader's order. Each has five presets of its
  // brightness, contrast, saturation and elevate, and which of those controls
  // are on; its bubbles pick Off (drawn untouched) or a preset, and a change
  // saves into the preset picked (Off edits the one it left). adj and ctlOff
  // hold the picked preset of every layer, four per layer; adjOut is what
  // the shader gets. All remembered on this machine.
  const LAYERS = [{ name: '1700 Å' }, { name: '304 Å' }, { name: '171 Å' }, { name: '193 Å' }, { name: '211 Å' }];
  // [label, min, max, untouched]
  const ADJ = [['Brightness', 0, 2, 1], ['Contrast', 0, 2, 1], ['Saturation', 0, 2, 1], ['Elevate', 0, 1, 0]];
  const NA = ADJ.length, NP = 5;
  const DEF = new Float32Array(LAYERS.length * NA).map((_, j) => ADJ[j % NA][3]);
  const adj = Float32Array.from(DEF);
  const ctlOff = new Uint8Array(LAYERS.length * NA);
  const adjOut = Float32Array.from(DEF);
  // heart: a preset Robert likes
  const blank = () => ({ adj: ADJ.map(a => a[3]), off: ADJ.map(() => 0), heart: false });
  const presets = LAYERS.map(() => Array.from({ length: NP }, blank));
  // the preset picked per layer (-1 Off), and the last one picked
  const sel = LAYERS.map(() => 0), last = LAYERS.map(() => 0);
  const bypass = i => sel[i] < 0;
  const editOf = i => sel[i] >= 0 ? sel[i] : last[i];
  try {
    const P = JSON.parse(localStorage.getItem('sunQualityPresets') || 'null');
    if (P && Array.isArray(P.presets) && P.presets.length === LAYERS.length) {
      P.presets.forEach((ps, i) => ps.forEach((p, n) => { if (n < NP && p && p.adj && p.adj.length === NA) presets[i][n] = { adj: p.adj.slice(), off: (p.off || []).slice(0, NA), heart: !!p.heart }; }));
      P.sel.forEach((v, i) => { sel[i] = v; }); P.last.forEach((v, i) => { last[i] = v; });
    } else {
      // the settings from before presets become preset 1 of each layer
      const a = JSON.parse(localStorage.getItem('sunQualityLayers') || 'null');
      const c = JSON.parse(localStorage.getItem('sunQualityCtlOff') || 'null');
      const b = JSON.parse(localStorage.getItem('sunQualityBypass') || 'null');
      LAYERS.forEach((_, i) => {
        const p = presets[i][0];
        for (let k = 0; k < NA; k++) {
          if (a && a.length === LAYERS.length * NA) p.adj[k] = a[i * NA + k];
          else if (a && a.length === LAYERS.length * 3 && k < 3) p.adj[k] = a[i * 3 + k];
          if (c && c.length === LAYERS.length * NA) p.off[k] = c[i * NA + k];
        }
        if (b && b[i]) sel[i] = -1;
      });
    }
  } catch (e) {}
  // the picked preset into adj and ctlOff, and back
  function loadLayer(i) { const p = presets[i][editOf(i)]; for (let k = 0; k < NA; k++) { adj[i * NA + k] = p.adj[k]; ctlOff[i * NA + k] = p.off[k] ? 1 : 0; } }
  function storeLayer(i) { const p = presets[i][editOf(i)]; for (let k = 0; k < NA; k++) { p.adj[k] = adj[i * NA + k]; p.off[k] = ctlOff[i * NA + k]; } }
  LAYERS.forEach((_, i) => loadLayer(i));
  function syncAdj() { for (let j = 0; j < adj.length; j++) adjOut[j] = bypass((j / NA) | 0) || ctlOff[j] ? DEF[j] : adj[j]; }
  const saveAdj = () => {
    LAYERS.forEach((_, i) => storeLayer(i));
    syncAdj();
    try { localStorage.setItem('sunQualityPresets', JSON.stringify({ presets, sel, last })); } catch (e) {}
  };
  syncAdj();
  function buildLayers() {
    $('layerRows').innerHTML = '';
    LAYERS.forEach((L, i) => {
      const box = document.createElement('div');
      box.className = 'layer' + (bypass(i) ? ' bypassed' : '');
      box.innerHTML = '<div class="lh"><h2>' + L.name + '</h2><div class="pre">' +
        ['Off', 1, 2, 3, 4, 5].map((b, n) => '<button class="bub' + (n === 0 ? ' offb' : '') + (sel[i] === n - 1 ? ' on' : '') + '">' + b + '</button>').join('') +
        // the heart: the picked preset, liked or not (nothing to like on Off)
        '<button class="heart' + (sel[i] >= 0 && presets[i][sel[i]].heart ? ' on' : '') + '"' + (sel[i] < 0 ? ' disabled' : '') + ' title="Heart this preset">♥</button></div></div>';
      // the name puts the Atmosphere on this layer alone (i/4 along it)
      box.querySelector('h2').onclick = () => fadeTo(i);
      [...box.querySelectorAll('.bub')].forEach((b, n) => { b.onclick = () => pick(i, n - 1); });
      const heart = box.querySelector('.heart');
      heart.onclick = () => {
        if (sel[i] < 0) return;
        const p = presets[i][sel[i]];
        p.heart = !p.heart;
        heart.classList.toggle('on', p.heart);
        saveAdj();
      };
      ADJ.forEach(([label, lo, hi, def], k) => {
        const row = document.createElement('label');
        row.className = 'row';
        row.innerHTML = '<span class="ctl">' + label + '</span> <input type="range" min="' + lo * 100 + '" max="' + hi * 100 + '"><output></output>';
        const inp = row.querySelector('input'), out = row.querySelector('output'), ctl = row.querySelector('.ctl');
        const j = i * NA + k;
        const mark = () => { ctl.classList.toggle('off', !!ctlOff[j]); row.classList.toggle('off', !!ctlOff[j]); };
        mark();
        ctl.onclick = e => { e.preventDefault(); ctlOff[j] = ctlOff[j] ? 0 : 1; mark(); saveAdj(); };
        const show = () => { out.textContent = adj[j].toFixed(2); };
        inp.value = Math.round(adj[j] * 100); show();
        inp.oninput = () => { adj[j] = +inp.value / 100; show(); saveAdj(); };
        // a double click puts it back to untouched
        inp.ondblclick = () => { adj[j] = def; inp.value = def * 100; show(); saveAdj(); };
        box.appendChild(row);
      });
      $('layerRows').appendChild(box);
    });
    showLit();
    markKeys();
  }
  // Where the number keys go (its title underlined): the tiers (Sun Quality,
  // left) or the presets of the layer showing (Layers, right: ` Off, 1-5)
  // (remembered on this machine)
  let keyPresets = false;
  try { keyPresets = localStorage.getItem('sunQualityKeys') === 'presets'; } catch (e) {}
  function markKeys() {
    try { localStorage.setItem('sunQualityKeys', keyPresets ? 'presets' : 'tiers'); } catch (e) {}
    document.querySelector('#side h1').classList.toggle('keys', !keyPresets);
    document.querySelector('#layers h1').classList.toggle('keys', keyPresets);
  }
  document.querySelector('#side h1').onclick = () => { keyPresets = false; markKeys(); };
  document.querySelector('#layers h1').onclick = () => { keyPresets = true; markKeys(); };
  // a bubble: Off (-1) or a preset (0-4), its values onto the sliders
  function pick(i, n) {
    storeLayer(i);
    if (n < 0) { if (sel[i] >= 0) last[i] = sel[i]; sel[i] = -1; }
    else { sel[i] = n; last[i] = n; }
    loadLayer(i);
    saveAdj();
    buildLayers();
  }
  // the arrows' bypass: Off, or back to the preset it left
  function setBypass(i, on) { if (on !== bypass(i)) pick(i, on ? -1 : last[i]); }
  // Reset all: the picked preset of every layer back to untouched
  $('resetLayers').onclick = () => { adj.set(DEF); ctlOff.fill(0); saveAdj(); buildLayers(); $('atmo').oninput(); };
  // every layer's presets, which is picked, and the view they were set in, as a JSON file
  $('download').onclick = () => {
    const out = { savedAt: new Date().toISOString(), set: SET, tier: TIERS[st.tier].name, atmosphere: +$('atmo').value / 100, layers: {} };
    LAYERS.forEach((L, i) => {
      const ps = {};
      presets[i].forEach((p, n) => { ps[n + 1] = { brightness: p.adj[0], contrast: p.adj[1], saturation: p.adj[2], elevate: p.adj[3], off: ADJ.filter((_, k) => p.off[k]).map(a => a[0].toLowerCase()), hearted: !!p.heart }; });
      out.layers[L.name] = { picked: sel[i] < 0 ? 'off' : sel[i] + 1, hearted: presets[i].map((p, n) => p.heart ? n + 1 : 0).filter(Boolean), presets: ps };
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
    a.download = 'sun-layer-settings.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // the Atmosphere sweep, gpu/sun.js: the five channels at i/4 along it
  const gains = new Float32Array(5);
  function setGains(a) {
    gains.fill(0);
    const x = a * 4, i = Math.floor(x);
    if (i >= 4) { gains[4] = 1; return; }
    const f = x - i, s = f * f * (3 - 2 * f);
    gains[i] = 1 - s; gains[i + 1] = s;
  }

  // ---------- layout: the canvas at the target's own device pixels ----------
  let sidePx = 0;   // the Sun's square, device pixels of the target screen
  function layout() {
    const stage = $('stage');
    stage.className = 'on-' + st.device;
    const old = stage.querySelector('.phone');
    if (st.device === 'computer') {
      if (old) { stage.prepend(canvas); old.remove(); }
      const dpr = window.devicePixelRatio || 1;
      const r = stage.getBoundingClientRect();
      canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
      canvas.style.width = canvas.style.height = '';
    } else {
      const ph = PHONES[st.phone];
      let frame = old;
      if (!frame) { frame = document.createElement('div'); frame.className = 'phone'; stage.prepend(frame); frame.appendChild(canvas); }
      canvas.width = Math.round(ph.w * ph.dpr); canvas.height = Math.round(ph.h * ph.dpr);
      // actual: one phone pixel per device pixel of this screen
      const dpr = window.devicePixelRatio || 1;
      let cssW = canvas.width / dpr, cssH = canvas.height / dpr;
      if (st.fit === 'real') {
        // the phone's inches at this screen's density: its device pixels
        // over its ppi, times this screen's ppi over its pixel ratio
        const k = (st.ppi / dpr) / ph.ppi * ph.dpr;
        cssW = ph.w * k; cssH = ph.h * k;
      } else if (st.fit === 'fit') {
        const r = stage.getBoundingClientRect();
        const k = Math.min(1, (r.height - 80) / cssH, (r.width - 80) / cssW);
        cssW *= k; cssH *= k;
      }
      canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    }
    sidePx = +$('size').value / 100 * Math.min(canvas.width, canvas.height);
    gl.viewport(0, 0, canvas.width, canvas.height);
    drawTables();
  }

  // ---------- the side panel ----------
  function seg(el, items, key, label) {
    el.innerHTML = '';
    items.forEach((it, i) => {
      const b = document.createElement('button');
      b.textContent = label(it, i);
      b.onclick = () => { st[key] = typeof it === 'object' ? i : it; save(); render(key); };
      el.appendChild(b);
    });
  }
  function mark() {
    [...$('tiers').children].forEach((b, i) => b.classList.toggle('on', i === st.tier));
    [...$('devices').children].forEach(b => b.classList.toggle('on', b.dataset.d === st.device));
    [...$('fit').children].forEach(b => b.classList.toggle('on', b.dataset.f === st.fit));
    [...$('speeds').children].forEach((b, i) => b.classList.toggle('on', SPEEDS[i] === st.speed));
    $('phoneOpts').hidden = st.device !== 'phone';
  }
  function render(key) {
    if (key === 'tier') load(true);
    if (key === 'speed') video.playbackRate = st.speed;
    mark(); layout();
  }
  seg($('tiers'), TIERS, 'tier', t => t.name);
  seg($('speeds'), SPEEDS, 'speed', s => s + '×');
  [...$('sets').children].forEach(b => {
    b.classList.toggle('on', b.dataset.s === SET);
    b.onclick = () => { if (b.dataset.s !== SET) location.search = b.dataset.s === 'master' ? '?set=master' : ''; };
  });
  // the master set in pairs, plain beside sharpened; the delivery set four across
  $('tiers').style.cssText = 'grid-auto-flow: row; grid-template-columns: repeat(' + (SET === 'master' ? 2 : 4) + ', 1fr)';
  [...$('devices').children].forEach(b => b.onclick = () => { st.device = b.dataset.d; save(); render(); });
  [...$('fit').children].forEach(b => b.onclick = () => { st.fit = b.dataset.f; save(); render(); });
  PHONES.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.name + ' (' + Math.round(p.w * p.dpr) + '×' + Math.round(p.h * p.dpr) + ')'; $('model').appendChild(o); });
  $('model').value = st.phone;
  $('ppi').value = st.ppi;
  $('ppi').oninput = () => { const v = +$('ppi').value; if (v >= 80 && v <= 600) { st.ppi = v; save(); layout(); } };
  $('model').onchange = () => { st.phone = +$('model').value; save(); layout(); };
  $('size').oninput = () => { $('sizeOut').textContent = $('size').value + '%'; layout(); };
  // which layers are showing, the predominant first
  function showLit() {
    const lit = [...gains].map((v, i) => [v, i]).filter(x => x[0] > 0.005).sort((a, b) => b[0] - a[0]);
    if (!lit.length) return;
    $('atmoLayer').innerHTML = 'Mostly <b style="color:var(--gold)">' + LAYERS[lit[0][1]].name + '</b>' +
      lit.map(x => ' · ' + LAYERS[x[1]].name + ' ' + Math.round(x[0] * 100) + '%').join('');
    [...$('layerRows').children].forEach((el, i) => el.classList.toggle('lit', i === lit[0][1]));
  }
  $('atmo').oninput = () => {
    fade = null;   // a hand on the slider ends any crossfade
    $('atmoOut').textContent = (+$('atmo').value / 100).toFixed(2);
    setGains(+$('atmo').value / 100);
    showLit();
  };
  // Crossfade (top right), seconds, remembered: a layer's name fades the
  // gains straight from what shows to that layer alone, smoothstep in time,
  // then the Atmosphere slider lands on it
  let fade = null;
  try { const x = +localStorage.getItem('sunQualityXfade'); if (localStorage.getItem('sunQualityXfade') !== null && x >= 0 && x <= 100) $('xfade').value = x; } catch (e) {}
  $('xfade').oninput = () => {
    $('xfadeOut').textContent = (+$('xfade').value / 10).toFixed(1) + ' s';
    try { localStorage.setItem('sunQualityXfade', $('xfade').value); } catch (e) {}
  };
  $('xfade').oninput();
  function fadeTo(i) {
    const dur = +$('xfade').value / 10 * 1000;
    if (dur <= 0) { $('atmo').value = i * 25; $('atmo').oninput(); return; }
    const to = new Float32Array(5); to[i] = 1;
    fade = { from: Float32Array.from(gains), to, at: performance.now(), dur, layer: i };
  }
  function stepFade(now) {
    if (!fade) return;
    const u = Math.min(1, (now - fade.at) / fade.dur), k = u * u * (3 - 2 * u);
    for (let j = 0; j < 5; j++) gains[j] = fade.from[j] + (fade.to[j] - fade.from[j]) * k;
    showLit();
    if (u >= 1) { const i = fade.layer; fade = null; $('atmo').value = i * 25; $('atmo').oninput(); }
  }
  buildLayers();
  $('size').oninput(); $('atmo').oninput();

  function drawTables() {
    $('ups').innerHTML = TIERS.map((t, i) => {
      const tile = t.w / 3, up = sidePx / tile;
      return '<tr class="' + (i === st.tier ? 'on' : '') + '"><td>' + t.name + ' <span style="color:var(--dim)">' + Math.round(tile) + ' px' + (t.mbps ? ' · ' + t.mbps + ' Mbps' : '') + (t.mb ? ' · ' + t.mb + ' MB' : '') + '</span></td>' +
        '<td class="' + (up <= 1.05 ? 'up-ok' : 'up-soft') + '">' + up.toFixed(2) + '×</td></tr>';
    }).join('') + '<tr><td>Sun on screen</td><td>' + Math.round(sidePx) + ' px</td></tr>';
    const dpr = window.devicePixelRatio || 1;
    const rows = [
      ['Screen', screen.width + ' × ' + screen.height + ' pt'],
      ['Pixel ratio', dpr + '×'],
      ['Native pixels', Math.round(screen.width * dpr) + ' × ' + Math.round(screen.height * dpr)],
      ['Window', innerWidth + ' × ' + innerHeight + ' pt'],
      ['Color depth', screen.colorDepth + ' bit']
    ];
    $('screen').innerHTML = rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('');
  }

  // ---------- draw ----------
  function frame(now) {
    stepFade(now);
    if (video.readyState >= 2) {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
      gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(uHalf, sidePx / canvas.width, sidePx / canvas.height);
      gl.uniform1fv(uG, gains);
      gl.uniform4fv(uAdj, adjOut);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      $('status').textContent = TIERS[st.tier].name + ' · ' + video.videoWidth + '×' + video.videoHeight + ' · ' + video.currentTime.toFixed(1) + ' s' + (triedCloud ? ' · from the cloud' : ' · local copy');
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', layout);
  // The arrows work the layers on the right (taken from any focused
  // slider): Up and Down step through them, crossfading; Right shows the
  // current one's color treatment, Left bypasses it
  addEventListener('keydown', e => {
    if (!/^Arrow(Up|Down|Left|Right)$/.test(e.key)) return;
    e.preventDefault();
    const at = fade ? fade.layer : gains.indexOf(Math.max(...gains));
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { setBypass(at, e.key === 'ArrowLeft'); return; }
    const to = Math.max(0, Math.min(LAYERS.length - 1, at + (e.key === 'ArrowDown' ? 1 : -1)));
    if (to !== at || fade) fadeTo(to);
  });
  // n m , . / jump to the five layers in order, crossfading
  addEventListener('keydown', e => {
    const i = 'nm,./'.indexOf(e.key);
    if (i >= 0 && !e.metaKey && !e.ctrlKey) { e.preventDefault(); fadeTo(i); }
  });
  // the number keys pick a tier, for quick A/B (0 the tenth, Max+ in the
  // master set), or with Layers clicked, the showing layer's preset (` Off, 1-5)
  addEventListener('keydown', e => {
    if (keyPresets) {
      const at = fade ? fade.layer : gains.indexOf(Math.max(...gains));
      if (e.key === '`') pick(at, -1);
      else if (/^[1-5]$/.test(e.key)) pick(at, +e.key - 1);
      return;
    }
    if (!/^[0-9]$/.test(e.key)) return;
    const n = e.key === '0' ? 10 : +e.key;
    if (n <= TIERS.length) { st.tier = n - 1; save(); render('tier'); }
  });
  mark(); load(false); layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
