<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blooming lotus · 32-frame animation</title>
<style>
  :root{color-scheme:dark;--preview-bg:#111}body{margin:0;background:#101417;color:#e8ece8;font:16px system-ui}
  main{max-width:1200px;margin:auto;padding:32px}h1{font-size:28px;margin:0 0 12px}p{color:#b8c3ba;line-height:1.5;max-width:920px}
  .toolbar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:24px 0}select,button{font:inherit;padding:8px 12px;background:#25312b;color:inherit;border:1px solid #587361;border-radius:8px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;background:#1c2420;border:1px solid #35463a;border-radius:12px;padding:20px;min-width:0}
  figcaption{margin-bottom:16px}canvas{display:block;margin:auto;width:384px;height:384px;max-width:100%;background:var(--preview-bg)}small{color:#a3b6a8;display:block;margin-top:12px}
  a{color:#a8e6bc}#status{font-size:14px}.sheet{display:block;width:100%;height:auto;background:var(--preview-bg)}
  @media(max-width:900px){.pair{grid-template-columns:1fr}main{padding:16px}}
</style>
<main>
  <h1>Blooming lotus · 32-frame animation</h1>
  <p>The stabilized flower with new opening poses between its original frames. Both versions take four seconds to open and close.</p>
  <div class="toolbar">
    <button id="play" disabled>Pause</button>
    <label>Loop step <input id="frame" type="range" min="0" max="63" value="0"> <output id="step">1 / 64</output></label>
    <label>Size <select id="size"><option value="384">384 pixels</option><option value="640">640 pixels</option></select></label>
    <label>Background <select id="background"><option value="#111">Dark</option><option value="#fff">White</option><option value="#408746">Green</option></select></label>
    <label><input id="blend" type="checkbox"> Blend between frames</label>
    <label><input id="anchor" type="checkbox" checked> Show fixed anchor</label>
  </div>
  <div class="pair">
    <figure><figcaption>16 opening frames · 8 fps</figcaption><canvas id="original"></canvas><small>Stabilized original poses</small></figure>
    <figure><figcaption>32 opening frames · 16 fps</figcaption><canvas id="enhanced"></canvas><small>15 new halfway poses · same fixed bottom centre</small></figure>
  </div>
  <p id="status" role="status">Loading the animation…</p>
  <p><a href="../assets/sprites/lotus-bloom-upscaled-3x/lotus-bloom-960-stable-32.png" download>Download 960-pixel master</a> · <a href="../assets/sprites/lotus-bloom-upscaled-3x/lotus-bloom-384-stable-32.png" download>Download 384-pixel opening sheet</a> · <a href="../assets/sprites/lotus-bloom-upscaled-3x/lotus-bloom-384-stable-64-loop.png" download>Download complete opening/closing loop</a></p>
  <figure><figcaption>32 opening frames · read left to right, then down</figcaption><img id="sheet" class="sheet" alt="Thirty-two opal lotus opening frames"></figure>
</main>
<script type="module">
const base='../assets/sprites/lotus-bloom-upscaled-3x/';
const status=document.getElementById('status');
try{
  const images=await Promise.all(['lotus-bloom-960-stable.png','lotus-bloom-960-stable-32.png'].map(file=>new Promise((resolve,reject)=>{
    const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Could not load '+file));img.src=base+file;
  })));
  if(images[0].width!==3840||images[1].width!==7680||images.some(img=>img.height!==3840))throw new Error('Unexpected atlas dimensions');
  const canvases=['original','enhanced'].map(id=>document.getElementById(id));
  const frame=document.getElementById('frame'),play=document.getElementById('play'),blend=document.getElementById('blend'),anchor=document.getElementById('anchor');
  const old=[...Array(16).keys(),...Array.from({length:16},(_,i)=>15-i)];
  const added=[...Array(32).keys(),...Array.from({length:31},(_,i)=>30-i),0];
  let playing=true,position=0,previous=performance.now();
  function resize(){const side=+document.getElementById('size').value;for(const c of canvases){c.width=c.height=Math.round(side*(devicePixelRatio||1));c.style.width=c.style.height=side+'px';}}
  function draw(){
    const step=Math.floor(position)%64;
    for(let n=0;n<2;n++){
      const c=canvases[n],ctx=c.getContext('2d'),img=images[n],cols=n===0?4:8,sequence=n===0?old:added;
      const pos=n===0?position/2:position,at=Math.floor(pos)%sequence.length,mix=blend.checked?pos-Math.floor(pos):0;
      ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      for(const [index,weight] of [[sequence[at],1-mix],[sequence[(at+1)%sequence.length],mix]]){
        if(!weight)continue;ctx.globalAlpha=weight;ctx.globalCompositeOperation='lighter';
        ctx.drawImage(img,index%cols*960,Math.floor(index/cols)*960,960,960,0,0,c.width,c.height);
      }
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      if(anchor.checked){const x=c.width*.5,y=c.height*801/960,dpr=devicePixelRatio||1;ctx.strokeStyle='#2aa67a';ctx.lineWidth=dpr;ctx.beginPath();ctx.moveTo(x-9*dpr,y);ctx.lineTo(x+9*dpr,y);ctx.moveTo(x,y-9*dpr);ctx.lineTo(x,y+9*dpr);ctx.stroke();}
    }
    frame.value=step;const pose=added[step];
    document.getElementById('step').textContent=`${step+1} / 64 · pose ${pose+1}${pose<31&&pose%2?' (new)':''}`;
  }
  function tick(now){if(playing)position=(position+Math.min((now-previous)/1000,.1)*16)%64;previous=now;draw();requestAnimationFrame(tick);}
  function setPlaying(value){playing=value;play.textContent=value?'Pause':'Play';}
  play.disabled=false;play.onclick=()=>setPlaying(!playing);frame.oninput=()=>{setPlaying(false);position=+frame.value;draw();};
  document.getElementById('size').onchange=()=>{resize();draw();};anchor.onchange=blend.onchange=draw;
  document.getElementById('background').onchange=e=>document.documentElement.style.setProperty('--preview-bg',e.target.value);
  document.getElementById('sheet').src=images[1].src;
  resize();draw();requestAnimationFrame(tick);status.textContent='Loaded. Original keyframes at every second step; 15 motion-interpolated poses plus a full-bloom hold. Frame blending is off so you can inspect the actual artwork.';
}catch(error){status.textContent=error.message;}
</script>
</html>
