<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDO Resolution</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<!--
  One SDO frame at NASA's browse sizes, 1024, 2048 and 4096, drawn at the
  same size in the same place, so flipping between them shows only the
  detail. Zoom and pan hold across the flip. sun-video/stills/ holds the
  frames (git-ignored; 1024 from our archive, the others fetched from
  sdo.gsfc.nasa.gov/assets/img/browse/<y>/<m>/<d>/<stamp>_<size>_<channel>.jpg).
    http://localhost:8000/tools/sdo-still-compare.html?f=20250317_140634&ch=0171
  Keys: 1 2 3 the size (4 also 4096), wheel zoom at the cursor, drag to pan, double-click
  to fit, L the loupe (a circle up and left of the cursor, magnifying what
  lies under its own centre at 5x). Everything is remembered.
-->
<style>
:root { --bg: #07080c; --panel: #12151d; --line: #262c3a; --ink: #e8ecf4; --dim: #8a93a6; --gold: #f2c14e; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
#bar { position: fixed; top: 10px; left: 10px; z-index: 2; display: flex; gap: 6px; align-items: center; background: rgba(18,21,29,.85); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; }
#bar button { height: 28px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line); background: #1b2030; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
#bar button.on { background: var(--gold); color: #000; border-color: var(--gold); }
#info { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 6px; white-space: nowrap; }
canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
#lens { position: fixed; inset: 0; pointer-events: none; }
.sep { color: var(--dim); font-size: 12px; margin: 0 2px 0 8px; }
canvas.drag { cursor: grabbing; }
</style>
</head>
<body>
<div id="bar"><span id="sizes"></span><span class="sep">Loupe</span><span id="loupes"></span><span id="info"></span></div>
<canvas id="c"></canvas><canvas id="lens"></canvas>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const F = q.get('f') || '20250317_140634', CH = q.get('ch') || '0171';
  const SIZES = [1024, 2048, 4096];
  const KEY = 'sdoStill:' + F + ':' + CH;
  // the view: which size, the zoom (screen px per image unit, the image
  // being 1 x 1) and the image point at the screen's centre
  const st = { size: 2048, zoom: 0, cx: 0.5, cy: 0.5, loupe: 'flat' };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  // the loupe: 'off', 'flat' (5x throughout) or 'bubble' (5x at the centre,
  // easing to 1x at the rim, so its edge meets the picture seamlessly)
  if (st.loupe === true) st.loupe = 'flat'; else if (st.loupe === false) st.loupe = 'off';
  if (!['off', 'flat', 'bubble'].includes(st.loupe)) st.loupe = 'flat';
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const imgs = {};
  for (const s of SIZES) {
    const im = new Image();
    im.src = '/sun-video/stills/' + F + '_' + s + '_' + CH + '.jpg';
    im.onload = draw;
    imgs[s] = im;
  }
  const c = $('c'), g = c.getContext('2d');
  const LOUPE = 5;
  // ---- the bubble loupe: a WebGL2 layer over the picture. A point at r of
  // the lens's radius (0 centre, 1 rim) shows the image point under the
  // lens centre plus its offset over m(r) = 1 + (LOUPE - 1)(1 - r^2)^2 times
  // the picture's zoom: 5x at the centre, 1x at the rim, smooth between.
  // Each size is a mipmapped texture, sampled trilinear on the GPU.
  const lens = $('lens'), gl = lens.getContext('webgl2', { premultipliedAlpha: false });
  const prog = (() => {
    const vs = `#version 300 es
    in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
    const fs = `#version 300 es
    precision highp float;
    uniform sampler2D tex; uniform vec2 center; uniform float radius, zoom, mag; uniform vec2 ipoint, canvasSize;
    out vec4 o;
    void main() {
      vec2 px = vec2(gl_FragCoord.x, canvasSize.y - gl_FragCoord.y);
      vec2 d = px - center;
      float r = length(d) / radius;
      if (r > 1.0) discard;
      float k = 1.0 - r * r;
      float m = 1.0 + (mag - 1.0) * k * k;
      vec2 uv = ipoint + d / (zoom * m);
      vec3 c = (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) ? vec3(0.0) : texture(tex, uv).rgb;
      // a soft gold rim
      float rim = smoothstep(0.985, 1.0, r);
      o = vec4(mix(c, vec3(0.95, 0.76, 0.31), rim * 0.7), 1.0);
    }`;
    const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(x)); return x; };
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const a = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    return pr;
  })();
  const U = n => gl.getUniformLocation(prog, n);
  const texOf = {};
  function texture(im) {
    if (texOf[im.src]) return texOf[im.src];
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return (texOf[im.src] = t);
  }
  function drawBubble(im) {
    if (lens.width !== c.width || lens.height !== c.height) { lens.width = c.width; lens.height = c.height; }   // resized only when the window is
    gl.viewport(0, 0, lens.width, lens.height);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (st.loupe !== 'bubble' || !mouse || drag || !(im.complete && im.naturalWidth)) return;
    const dpr = devicePixelRatio, R = 150 * dpr, off = R * 0.85;
    const lx = mouse.x - off, ly = mouse.y - off;
    gl.bindTexture(gl.TEXTURE_2D, texture(im));
    gl.uniform2f(U('center'), lx, ly);
    gl.uniform1f(U('radius'), R);
    gl.uniform1f(U('zoom'), st.zoom);
    gl.uniform1f(U('mag'), LOUPE);
    gl.uniform2f(U('ipoint'), st.cx + (lx - c.width / 2) / st.zoom, st.cy + (ly - c.height / 2) / st.zoom);
    gl.uniform2f(U('canvasSize'), lens.width, lens.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  let mouse = null, drag = null;   // the cursor in canvas px; a pan in progress
  const fit = () => Math.min(innerWidth, innerHeight) * 0.96 * devicePixelRatio;
  function draw() {
    const dpr = devicePixelRatio;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    if (!st.zoom) st.zoom = fit();
    const im = imgs[st.size];
    g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
    if (im.complete && im.naturalWidth) {
      // every size drawn over the same square, so only the detail changes.
      // Shrinking smooths at high quality (the GPU's mipmaps, cheap);
      // enlarging is bilinear, as a video player does: Chrome's high-quality
      // enlarging runs a costly filter on the CPU every frame, which made the
      // 1024 (the most enlarged) the laggiest
      g.imageSmoothingEnabled = true; g.imageSmoothingQuality = st.zoom > st.size ? 'low' : 'high';
      const x = c.width / 2 - st.cx * st.zoom, y = c.height / 2 - st.cy * st.zoom;
      g.drawImage(im, x, y, st.zoom, st.zoom);
    }
    // the loupe: a circle up and to the left of the cursor, showing what is
    // under its own centre at LOUPE x (never while dragging)
    drawBubble(im);
    if (st.loupe === 'flat' && mouse && !drag && im.complete && im.naturalWidth) {
      const R = 130 * dpr, off = R * 0.85;
      const lx = mouse.x - off, ly = mouse.y - off;
      const ix = st.cx + (lx - c.width / 2) / st.zoom, iy = st.cy + (ly - c.height / 2) / st.zoom;
      const z = st.zoom * LOUPE;
      g.save();
      g.beginPath(); g.arc(lx, ly, R, 0, Math.PI * 2); g.clip();
      g.imageSmoothingQuality = z > st.size ? 'low' : 'high';
      g.fillStyle = '#000'; g.fillRect(lx - R, ly - R, 2 * R, 2 * R);
      g.drawImage(im, lx - ix * z, ly - iy * z, z, z);
      g.restore();
      g.beginPath(); g.arc(lx, ly, R, 0, Math.PI * 2);
      g.lineWidth = 1.5 * dpr; g.strokeStyle = 'rgba(242,193,78,.7)'; g.stroke();
    }
    // how many screen pixels each image pixel covers at this zoom
    const per = st.zoom / st.size;
    $('info').textContent = 'AIA ' + CH.replace(/^0/, '') + ' · ' + F.slice(0, 4) + '-' + F.slice(4, 6) + '-' + F.slice(6, 8) + ' ' + F.slice(9, 11) + ':' + F.slice(11, 13) + ':' + F.slice(13, 15) + ' UTC · ' +
      st.size + ' px · ' + (per >= 1 ? 'each image pixel ' + per.toFixed(1) + ' screen px' : per.toFixed(2) + ' image px per screen px') + (im.complete && im.naturalWidth ? '' : ' · loading…');
    [...$('sizes').children].forEach(b => b.classList.toggle('on', +b.dataset.s === st.size));
    [...$('loupes').children].forEach(b => b.classList.toggle('on', b.dataset.l === st.loupe));
  }
  for (const [l, t] of [['off', 'Off'], ['flat', '5×'], ['bubble', 'Bubble']]) {
    const b = document.createElement('button');
    b.textContent = t; b.dataset.l = l;
    b.onclick = () => { st.loupe = l; save(); draw(); };
    $('loupes').appendChild(b);
  }
  for (const s of SIZES) {
    const b = document.createElement('button');
    b.textContent = s; b.dataset.s = s;
    b.onclick = () => { st.size = s; save(); draw(); };
    $('sizes').appendChild(b);
  }
  addEventListener('keydown', e => {
    // 1 2 3 in order (4 too, for 4096)
    const s = { 1: 1024, 2: 2048, 3: 4096, 4: 4096 }[e.key];
    if (s) { st.size = s; save(); draw(); }
    // L steps the loupe: off, 5x, bubble
    if (e.key === 'l' || e.key === 'L') { st.loupe = { off: 'flat', flat: 'bubble', bubble: 'off' }[st.loupe]; save(); draw(); }
  });
  // wheel zoom about the cursor
  c.addEventListener('wheel', e => {
    e.preventDefault();
    const dpr = devicePixelRatio, mx = e.clientX * dpr, my = e.clientY * dpr;
    const ix = st.cx + (mx - c.width / 2) / st.zoom, iy = st.cy + (my - c.height / 2) / st.zoom;
    st.zoom = Math.max(fit() * 0.5, Math.min(fit() * 64, st.zoom * Math.exp(-e.deltaY * 0.0015)));
    st.cx = ix - (mx - c.width / 2) / st.zoom; st.cy = iy - (my - c.height / 2) / st.zoom;
    save(); draw();
  }, { passive: false });
  // the loupe follows the cursor
  // redrawn at most once a frame, however fast the mouse reports
  let queued = false;
  const redraw = () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; draw(); }); };
  c.addEventListener('mousemove', e => { mouse = { x: e.clientX * devicePixelRatio, y: e.clientY * devicePixelRatio }; if (!drag) redraw(); });
  c.addEventListener('mouseleave', () => { mouse = null; draw(); });
  // drag to pan
  c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, cx: st.cx, cy: st.cy }; c.classList.add('drag'); });
  c.addEventListener('pointermove', e => {
    if (!drag) return;
    const dpr = devicePixelRatio;
    st.cx = drag.cx - (e.clientX - drag.x) * dpr / st.zoom; st.cy = drag.cy - (e.clientY - drag.y) * dpr / st.zoom;
    draw();
  });
  const end = () => { if (drag) { drag = null; c.classList.remove('drag'); save(); } };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  c.addEventListener('dblclick', () => { st.zoom = fit(); st.cx = st.cy = 0.5; save(); draw(); });
  addEventListener('resize', draw);
  draw();
})();
</script>
</body>
</html>
