<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blooming lotus · 3× comparison</title>
<style>
  :root{color-scheme:dark}body{margin:0;background:#101417;color:#e8ece8;font:16px system-ui}
  main{max-width:1200px;margin:auto;padding:32px}h1{font-size:28px;margin:0 0 12px}p{color:#b8c3ba;line-height:1.5;max-width:900px}
  .toolbar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:24px 0}select,button{font:inherit;padding:8px 12px;background:#25312b;color:inherit;border:1px solid #587361;border-radius:8px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;background:#1c2420;border:1px solid #35463a;border-radius:12px;padding:20px;min-width:0}
  figcaption{margin-bottom:16px}canvas{display:block;margin:auto;width:384px;height:384px;max-width:100%;background:var(--preview-bg,#111)}small{color:#a3b6a8;display:block;margin-top:12px}
  a{color:#a8e6bc}#status{font-size:14px}.sheet{display:block;width:100%;height:auto;background:var(--preview-bg,#111)}
  @media(max-width:900px){.pair{grid-template-columns:1fr}main{padding:16px}}
</style>
<main>
  <h1>Blooming lotus · 3× comparison</h1>
  <p>The same opening and closing sequence at the same displayed size. Compare opal texture, gold rims, petal tips, and consistency as the flower opens.</p>
  <div class="toolbar">
    <button id="play" disabled>Pause</button>
    <label>Loop step <input id="frame" type="range" min="0" max="31" value="0"> <output id="step">1 / 32</output></label>
    <label>Size <select id="size"><option value="384">384 pixels</option><option value="640">640 pixels</option></select></label>
    <label>Background <select id="background"><option value="#111">Dark</option><option value="#fff">White</option><option value="#408746">Green</option></select></label>
    <label><input id="blend" type="checkbox" checked> Blend between frames</label>
  </div>
  <div class="pair">
    <figure><figcaption>Original</figcaption><canvas id="original"></canvas><small>Original source frames, cleaned for display</small></figure>
    <figure><figcaption>3× reconstruction</figcaption><canvas id="enhanced"></canvas><small>960 × 960 pixels per frame · rebuilt edges</small></figure>
  </div>
  <p id="status" role="status">Loading the animation…</p>
  <p><a href="../assets/sprites/lotus-bloom-upscaled-3x/lotus-bloom-960.png" download>Download the 960-pixel master</a> · <a href="../assets/sprites/lotus-bloom-upscaled-3x/lotus-bloom-384.png" download>Download the 384-pixel animation sheet</a></p>
  <figure><figcaption>All 16 opening frames · read left to right, then down</figcaption><img id="sheet" class="sheet" alt="Sixteen enhanced opal lotus opening frames"></figure>
</main>
<script type="module">
const paths = ['../assets/sprites/celestial-v1/source/lotus-bloom.png','../assets/sprites/lotus-bloom-upscaled-3x/lotus-bloom-960.png'];
const status = document.querySelector('#status');
try {
  const images = await Promise.all(paths.map(path => new Promise((resolve,reject) => {
    const img = new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('Could not load '+path)); img.src=path;
  })));
  const source = document.createElement('canvas');source.width=images[0].width;source.height=images[0].height;
  const sourceCtx=source.getContext('2d');sourceCtx.drawImage(images[0],0,0);
  const pixels=sourceCtx.getImageData(0,0,source.width,source.height);
  for(let i=0;i<pixels.data.length;i+=4) if(pixels.data[i+3]<48) pixels.data.fill(0,i,i+4);
  sourceCtx.putImageData(pixels,0,0);
  const sheets=[source,images[1]], canvases=['original','enhanced'].map(id=>document.getElementById(id));
  const frame=document.getElementById('frame'), play=document.getElementById('play'), blend=document.getElementById('blend');
  const sequence=[...Array(16).keys(),...Array.from({length:16},(_,i)=>15-i)];
  let playing=true, position=0, previous=performance.now();
  function resize(){
    const side=+document.getElementById('size').value;
    for(const canvas of canvases){canvas.width=canvas.height=Math.round(side*(devicePixelRatio||1));canvas.style.width=canvas.style.height=side+'px';}
  }
  function draw(){
    const step=Math.floor(position)%32, mix=blend.checked?position-Math.floor(position):0;
    for(let n=0;n<2;n++){
      const canvas=canvases[n], ctx=canvas.getContext('2d'), sheet=sheets[n], tile=sheet.width/4;
      ctx.clearRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      for(const [index,weight] of [[sequence[step],1-mix],[sequence[(step+1)%32],mix]]){
        if(weight===0) continue;
        ctx.globalAlpha=weight;ctx.globalCompositeOperation='lighter';
        ctx.drawImage(sheet,(index%4)*tile,Math.floor(index/4)*tile,tile,tile,0,0,canvas.width,canvas.height);
      }
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    }
    frame.value=step;document.getElementById('step').textContent=`${step+1} / 32 · source frame ${sequence[step]+1}`;
  }
  function tick(now){if(playing)position=(position+Math.min((now-previous)/1000,.1)*8)%32;previous=now;draw();requestAnimationFrame(tick);}
  function setPlaying(value){playing=value;play.textContent=value?'Pause':'Play';}
  play.disabled=false;play.onclick=()=>setPlaying(!playing);
  frame.oninput=()=>{setPlaying(false);position=+frame.value;draw();};
  document.getElementById('size').onchange=()=>{resize();draw();};
  document.getElementById('background').onchange=e=>document.documentElement.style.setProperty('--preview-bg',e.target.value);
  document.getElementById('sheet').src=images[1].src;
  resize();requestAnimationFrame(tick);status.textContent='Loaded. 16 opening frames, then the same frames in reverse; 8 fps, four-second loop. This comparison uses the source artwork directly.';
}catch(error){status.textContent=error.message;}
</script>
</html>
