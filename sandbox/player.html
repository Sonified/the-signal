<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Player</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#127929;</text></svg>">
<style>
  :root { --bg:#0b0f14; --ink:#e6edf5; --dim:#7c8796; --line:#212932; --hit:#d400ff; --vol:#4a9eff; --pit:#b455ff; --env:#4ad9a0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
         font:14px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px 18px 40px; }
  h1 { margin:0; font-size:14px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
  #status { color:var(--dim); font-size:12px; min-height:18px; font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:20px; align-items:center; flex-wrap:wrap; justify-content:center; }
  label { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:8px; }
  input[type=range] { width:120px; accent-color:var(--hit); }
  b { color:var(--ink); font-variant-numeric:tabular-nums; font-weight:500; min-width:30px; }
  button { background:#151b23; color:var(--ink); border:1px solid var(--line); border-radius:7px;
           padding:7px 12px; font:inherit; font-size:12.5px; cursor:pointer; }
  button:hover { border-color:#3a4551; }
  button:disabled { opacity:.35; cursor:default; }
  button:disabled:hover { border-color:var(--line); }
  button.on { background:var(--hit); border-color:var(--hit); color:#0b0f14; font-weight:600; }

  #kb { position:relative; display:flex; height:170px; user-select:none; margin-top:4px;
        filter:drop-shadow(0 10px 26px rgba(0,0,0,.55)); }
  .w { position:relative; width:32px; height:100%; background:#eef1f5; border:1px solid #c8d0d9;
       border-radius:0 0 5px 5px; margin-right:-1px; cursor:pointer;
       display:flex; align-items:flex-end; justify-content:center; padding-bottom:7px; }
  .b { position:absolute; top:0; width:20px; height:62%; background:#161b22; border:1px solid #000;
       border-radius:0 0 4px 4px; z-index:2; cursor:pointer;
       display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; }
  .w span, .b span { font-size:8px; letter-spacing:.02em; pointer-events:none; }
  .w span { color:#9aa5b3; } .b span { color:#5c6875; }
  .w.real span { color:#39434f; font-weight:700; } .b.real span { color:#aeb8c6; font-weight:700; }
  /* Every C is the root, every G the fifth. Tinting them means you can find your
     place on a four octave keyboard without counting up from the left. */
  .w.root  { background:#e2d7f0; border-color:#bfb0d4; }
  .w.fifth { background:#d6e2f2; border-color:#aebfd6; }
  .w.root span  { color:#5b4a75; }
  .w.fifth span { color:#3f5674; }
  .w.off, .b.off { opacity:.26; cursor:default; }
  .w.down { background:var(--hit); } .b.down { background:var(--hit); border-color:var(--hit); }
  .w.down span, .b.down span { color:#0b0f14; }

  /* Each sample's pair of sliders sits directly under the key it belongs to,
     positioned from that key's own offsetLeft rather than laid out evenly, so a
     column is always under its note whether that note is a white key or a black
     one. Stacked vertically: level on top, cents beneath. */
  /* The strip must be the same width as the keyboard AND centred the same way,
     or the two have different left edges and every column is offset by half the
     difference. So the buttons are taken out of the flow entirely and hung off
     the right edge, where they cannot influence the centring. */
  #trimWrap { position:relative; }
  #trims { position:relative; width:100%; height:232px; }
  #trimSide { position:absolute; left:100%; top:2px; margin-left:20px;
              display:flex; flex-direction:column; gap:6px; }
  #trimSide button { font-size:11px; padding:6px 10px; }
  .tc { position:absolute; top:0; display:flex; flex-direction:column; align-items:center;
        gap:1px; padding:4px 0 3px; border-radius:5px;
        background:#11161d; border:1px solid var(--line);
        transition:background .08s, border-color .08s, box-shadow .12s; }
  .tc.edited { border-color:#3a4551; background:#151a22; }
  /* lit while a voice is sounding from this sample, so a resampled key shows
     you which file it is actually reaching for */
  .tc.lit { border-color:#8ab4ff; background:#141c28; box-shadow:0 0 12px rgba(120,170,255,.28); }
  .tc .nm { font-size:8px; color:var(--dim); letter-spacing:.01em; }
  .tc.lit .nm { color:#cfe0ff; }
  /* a real sample among a strip of resampled neighbours, bolded the same way
     the keyboard already marks it */
  .tc.real .nm { color:#aeb8c6; font-weight:700; }
  .tc.lit.real .nm { color:#cfe0ff; }
  /* the manifest value, so the repo number and the live slider sit together */
  .tc .mf { font-size:7.5px; line-height:1.1; min-height:9px; color:#6d5a8a;
            font-variant-numeric:tabular-nums; }
  .tc.matches .mf { color:#4ad9a0; }
  .tc .rd { font-size:7.5px; color:#5f6a78; font-variant-numeric:tabular-nums; line-height:1.1; }
  .tc input[type=range] {
    writing-mode:vertical-lr; direction:rtl;
    width:14px; height:88px; margin:0; cursor:pointer;
  }
  .tc input.tv { accent-color:var(--vol); }
  .tc input.tt { accent-color:var(--pit); }
  .tc .rv { color:#6e8fb8; }
  .tc .rt { color:#8a6eb8; }

  #takeWrap { width:min(980px, 100%); display:flex; flex-direction:column; gap:8px; }
  #recInfo { color:var(--dim); font-size:11.5px; font-variant-numeric:tabular-nums; }
  #rec.armed { background:#c0392b; border-color:#c0392b; color:#fff; font-weight:600; }
  #takes { display:flex; flex-direction:column; gap:5px; }
  .take { display:flex; align-items:center; gap:10px; padding:7px 10px;
          background:#11161d; border:1px solid var(--line); border-radius:7px; font-size:12px; }
  .take.playing { border-color:var(--vol); background:#131c27; }
  .take input.nm {
    color:var(--ink); background:#0d1218; border:1px solid var(--line);
    border-radius:5px; padding:4px 8px; width:190px; font:inherit; font-size:12px;
  }
  .take input.nm:focus { outline:none; border-color:var(--vol); background:#111922; }
  .take .meta { color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; flex:1; }
  .take button { padding:4px 9px; font-size:11px; }
  .takeRow { display:flex; flex-direction:column; gap:0; }

  /* The envelopes. Two columns because they are two independent shapes that you
     read against each other: a filter that opens after the volume has already
     arrived sounds like a different instrument than one that opens with it. The
     curve above each column draws what the numbers add up to, so the shape is
     something you see rather than something you infer from four sliders. */
  /* A floating plugin window. It is fixed rather than in the flow because the
     whole point is being able to keep it open over the keyboard while playing,
     put it where it does not cover the keys, and close it when it is in the way. */
  #envWrap { position:fixed; z-index:40; display:none; flex-direction:column;
             width:min(560px, calc(100vw - 28px)); min-width:300px; min-height:240px;
             max-height:calc(100vh - 28px);
             background:#0f141b; border:1px solid #2c3742; border-radius:10px;
             box-shadow:0 22px 60px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.04);
             overflow:hidden; resize:both; }
  #envWrap.show { display:flex; }
  .winbar { display:flex; align-items:center; gap:9px; flex:none;
            padding:7px 7px 7px 12px; background:linear-gradient(#1b222b, #141a22);
            border-bottom:1px solid #212932; cursor:grab; user-select:none;
            touch-action:none; }
  .winbar.drag { cursor:grabbing; }
  .wintitle { font-size:10.5px; letter-spacing:.15em; text-transform:uppercase;
              color:#8d99a8; font-weight:600; }
  .windot { width:7px; height:7px; border-radius:50%; background:var(--env);
            box-shadow:0 0 7px var(--env); flex:none; }
  .winbar button { padding:3px 9px; font-size:10.5px; }
  .winbar .winx { margin-left:2px; padding:3px 8px; font-size:13px; line-height:1;
                  color:var(--dim); }
  .winbar .winx:hover { color:#ff8a8a; border-color:#5a3a3a; }
  .winbody { padding:11px 12px 14px; overflow:auto; display:flex;
             flex-direction:column; gap:9px; }
  /* the grip the browser draws for resize:both needs somewhere to sit */
  #envWrap::after { content:''; position:absolute; right:2px; bottom:2px;
                    width:11px; height:11px; pointer-events:none;
                    background:linear-gradient(135deg, transparent 50%, #3a4551 50%,
                               #3a4551 62%, transparent 62%, transparent 74%,
                               #3a4551 74%, #3a4551 86%, transparent 86%); }
  /* One column. Always one column, at any window width -- a vertical stack
     rather than a wrapping row, so narrowing the window never rearranges it. */
  #envCols { display:flex; flex-direction:column; gap:14px; align-items:stretch; }
  /* Volume, note length and ADSR share the amplitude column. */
  .ecol { min-width:0; display:flex; flex-direction:column; gap:14px; }
  .ecol > .eg { flex:0 0 auto; }
  .eg { background:#11161d; border:1px solid var(--line);
        border-radius:8px; padding:10px 12px 12px; display:flex; flex-direction:column; gap:7px; }
  .eg > h2 { margin:0; font-size:11px; font-weight:600; letter-spacing:.12em;
             text-transform:uppercase; color:var(--dim); display:flex; align-items:center; gap:9px; }
  .eg > h2 button { padding:2px 8px; font-size:10px; margin-left:auto; }
  /* The curve is now the control, so it needs room for the dots to move in and
     it has to keep the browser's own touch gestures off it while they do. */
  .ev { width:100%; height:78px; display:block; border-radius:5px;
        background:#0d1218; border:1px solid var(--line);
        touch-action:none; cursor:default; }
  .ev.over { cursor:grab; }
  .ev.grabbing { cursor:grabbing; }
  .es { display:flex; align-items:center; gap:9px; font-size:11px; color:var(--dim); }
  .es .lb { width:66px; flex:none; }
  .es input[type=range] { flex:1; width:auto; accent-color:var(--env); }
  .es .vl { width:50px; flex:none; text-align:right; color:#9fb0c2;
            font-variant-numeric:tabular-nums; font-size:10.5px; }
  .eg.off .es input, .eg.off .ev { opacity:.32; }
  /* A strip of the actual notes, time across and pitch up, so a gesture you
     liked is something you can see and point at rather than hunt for. */
  .tl { position:relative; height:52px; margin:5px 0 2px; border-radius:6px;
        background:#0d1218; border:1px solid var(--line); cursor:pointer; overflow:hidden; }
  .tl canvas { display:block; width:100%; height:100%; }
  .tl .ph { position:absolute; top:0; bottom:0; width:1px; background:#fff;
            box-shadow:0 0 6px rgba(255,255,255,.7); left:0; display:none; pointer-events:none; }
  .tl.live .ph { display:block; }
  .tl .tm { position:absolute; right:6px; top:4px; font-size:9.5px; color:var(--dim);
            font-variant-numeric:tabular-nums; pointer-events:none; }
  #hint { color:var(--dim); font-size:11.5px; text-align:center; max-width:640px; line-height:1.8; }
  kbd { background:#151b23; border:1px solid var(--line); border-radius:4px; padding:1px 5px;
        font:inherit; font-size:10.5px; color:var(--ink); }
</style>
</head>
<body>

<h1>The Signal &nbsp;&middot;&nbsp; <span id="title">Lekko</span></h1>
<div id="status">loading&hellip;</div>

<div class="row" id="instRow"></div>

<div class="row">
  <label>volume <input id="vol" type="range" min="0" max="100" value="70"><b id="volV">70</b></label>
  <label>reverb <input id="rev" type="range" min="0" max="100" value="26"><b id="revV">26</b></label>
  <label>octave <button id="oDn">&minus;</button><b id="octV">3</b><button id="oUp">+</button></label>
  <button id="sus" class="on">sustain</button>
  <button id="scale" class="on">scale: 1 2 3 5 7 8</button>
  <button id="lift" class="on">key lift</button>
  <button id="envBtn">envelopes</button>
  <button id="fmt">format: &mdash;</button>
</div>

<div id="kb"></div>

<div id="trimWrap">
  <div id="trims"></div>
  <div id="trimSide">
    <button id="trimLoad">default</button>
    <button id="copyTrim">copy</button>
    <button id="trimReset">reset</button>
  </div>
</div>

<div id="envWrap">
  <div class="winbar" id="envBar">
    <span class="windot"></span>
        <span class="wintitle">Clouds</span>
    <span style="flex:1"></span>
    <button id="envCopy">copy</button>
    <button id="envReset">reset</button>
    <button class="winx" id="envClose" title="close">&times;</button>
  </div>
  <div class="winbody">
    <div id="envCols"></div>
  </div>
</div>

<div id="takeWrap">
  <div class="row" style="justify-content:flex-start">
    <button id="rec">&#9679; record</button>
    <span id="recInfo"></span>
    <span style="flex:1"></span>
    <button id="copyAll">copy all takes</button>
  </div>
  <div id="takes"></div>
</div>

<div id="hint">
  <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd><kbd>;</kbd><kbd>'</kbd>
  walk the scale &nbsp;&middot;&nbsp; <kbd>Z</kbd><kbd>X</kbd> octave &nbsp;&middot;&nbsp; <kbd>space</kbd> kills every sounding note &nbsp;&middot;&nbsp; in chromatic mode the
  <kbd>W</kbd><kbd>E</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd> row gives the black keys<br>
  bold labels are real samples &nbsp;&middot;&nbsp; everything else is resampled from its nearest neighbour
  &nbsp;&middot;&nbsp; written C sounds the root
</div>

<script type="module">
// ---- the instruments -------------------------------------------------------
// Both sample sets are the ones the site itself ships, one directory up, and
// both are indexed the same way: by distance in semitones from the root. That
// is the whole mapping. The root is written as C3 and sounds at about 79.5 Hz,
// two octaves under the 40 Hz carrier the rest of The Signal runs on, so the
// two instruments are in tune with each other and with the tone by construction.
//
// Where they differ is what a key means. A piano note is struck and decays, so
// its samples are chromatic-ish and dense and a lifted finger is a damper. A
// cloud is a sustained pad held at a scale degree, so there are only eight of
// them, they are spread much further apart, and letting go has to be a long
// fade or the pad ends with a click instead of a breath.
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ROOT_WRITTEN = 48;                 // the root is written as C3
const nameOf = m => NAMES[((m%12)+12)%12] + (Math.floor(m/12)-1);
const BLACK = new Set([1,3,6,8,10]);
const isWhite = m => !BLACK.has(((m % 12) + 12) % 12);
const DEGREES = [0,2,4,7,11];            // 1 2 3 5 7, the 8 is the next octave's 1
const inScale = m => DEGREES.includes((((m - ROOT_WRITTEN) % 12) + 12) % 12);

// The clouds are named by scale degree rather than by semitone, so this is the
// one place the two naming schemes have to meet.
const CLOUD = { '-12':'octbelow', '-5':'5below', '0':'1', '2':'2',
                '4':'3', '7':'5', '11':'7', '12':'8' };

const INSTRUMENTS = {
  piano: {
    label: 'piano',
    dir: '../audio/piano',
    semis: [0,2,4,5,7,9,11,12,14,16,17,19,21,23,24,26,28,29,31,33,35,36,38,40],
    note: sm => `lekko-${String(sm).padStart(2,'0')}`,
    // 18 recorded finger lifts, laid over any note
    lifts: 18,
    lift: i => `releases/release-${String(i).padStart(2,'0')}`,
    // keyboard span, in semitones either side of the root
    lo: 0, hi: 40,
    fade: 0.4,                           // a damper
    // Trim is per sample: 24 real recordings are dense enough that every key
    // is at most a couple of semitones from one, so correcting the sample
    // corrects every key that reaches for it.
    perKey: false,
    // only the Opus encodes of the piano were ever committed
    formats: ['opus'],
    // The levels Robert dialled in live in the repo, not in a browser.
    manifest: 'manifest.json',
    levels: m => m.levelTrimsBaked
      || Object.fromEntries((m.notes||[]).filter(n => n.levelTrim !== 100)
                                        .map(n => [n.semitones, n.levelTrim]))
  },
  clouds: {
    label: 'clouds',
    dir: '../audio/music/clouds',
    semis: [-12,-5,0,2,4,7,11,12],
    note: sm => `clouds-${CLOUD[sm]}`,
    lifts: 0,
    lift: null,
    // An octave below the lowest pad up to two above the highest. Past that a
    // 15 second pad is resampled down too far and stops sounding like weather.
    lo: -12, hi: 24,
    fade: 2.4,                           // a breath
    // Trim is per KEY, not per sample: eight pads stretched across 37
    // playable keys means most keys are resampled, and a resampled neighbour
    // has no reason to share a level with the pad it borrowed from. Every
    // playable key gets its own slider.
    perKey: true,
    formats: ['opus','mp3'],
    manifest: 'manifest.json',
    levels: () => ({})          // the pads came out even; nothing was ever trimmed
  }
};

// ---- format: Opus where the browser will take it, mp3 where it will not ----
const probe = new Audio();
const canOpus = probe.canPlayType('audio/ogg; codecs=opus') !== ''
             || probe.canPlayType('audio/webm; codecs=opus') !== '';
const preload = (() => { try { return JSON.parse(localStorage.getItem('lekko.player.v1')) || {}; }
                         catch (e) { return {}; } })();
let INST = INSTRUMENTS[preload.inst] ? preload.inst : 'piano';
let FMT = (preload.fmt === 'mp3' || (preload.fmt === 'opus' && canOpus)) ? preload.fmt
        : (canOpus ? 'opus' : 'mp3');

// The live instrument, unpacked into the names the rest of the file already
// uses. Everything here is rebuilt by setInstrument rather than being constant,
// because the keyboard's range and its real keys both change with the samples.
let I, SEMIS, RELEASES, LO, HI, REAL, TRIM_RANGE;
function unpack() {
  I = INSTRUMENTS[INST];
  SEMIS = I.semis;
  RELEASES = I.lifts;
  LO = ROOT_WRITTEN + I.lo;
  HI = ROOT_WRITTEN + I.hi;
  REAL = new Set(SEMIS.map(s => ROOT_WRITTEN + s));
  // What the trim strip is a strip OF. White keys, and only white keys.
  //
  // The piano gets this right for free: its 24 samples ARE the white keys
  // (0 2 4 5 7 9 11 is C D E F G A B), so one column per sample lands one wide
  // column under each white key. Giving the clouds a column per SEMITONE put
  // narrow columns at the black keys' positions, wedged between and overlapping
  // the white ones — that is the pile-up, not the number of sliders in a column.
  TRIM_RANGE = I.perKey
    ? Array.from({ length: I.hi - I.lo + 1 }, (_, i) => I.lo + i)
        .filter(sm => isWhite(ROOT_WRITTEN + sm))
    : SEMIS;
  // an instrument that was never encoded as mp3 cannot be played as one
  if (!I.formats.includes(FMT)) FMT = I.formats[0];
}
unpack();

// What the manifest says was done to these samples, read fresh on every load.
// localStorage is per origin, so the moment this page moved into the repo every
// slider it had ever been given went out of reach. The repo is the record.
let manifestLevels = {};

const url = (kind, n) => `${I.dir}/${kind === 'note' ? I.note(n) : I.lift(n)}.${FMT}`;

// ---- envelopes -------------------------------------------------------------
// Two envelopes per voice, plus a static high-pass filter.
// They are worth having separately because on a pad the interesting movement is
// the filter arriving after the volume has, which is the difference between a
// chord appearing and a chord opening.
//
// A sampled pad already has an envelope baked into it: the recording fades in
// and out on its own. These shape what is left, they do not replace it, so a
// zero attack means "as the sample was recorded", not "instant".
const ENV_SPEC = {
  amp: { title: 'volume envelope', rows: [
    ['vol', 'volume', 0, 100, 1, '%'],
    // Zero holds the note until key-up; otherwise it ends after this duration.
    ['len', 'length', 0, 20, 0.1, 's'],
    ['aA', 'attack',   0, 8,   0.01, 's'],
    ['aD', 'decay',    0, 8,   0.01, 's'],
    ['aS', 'sustain',  0, 100, 1,    '%'],
    ['aR', 'release',  0, 14,  0.01, 's'],
  ]},
  filt: { title: 'filter envelope', toggle: 'fOn', rows: [
    // Cutoff is logarithmic because pitch is: a hundred Hz is most of the
    // bottom of the instrument and nothing at all at the top.
    ['cut',  'cutoff',    40, 18000, 0, 'Hz', true],
    ['q',    'resonance', 0.1, 14,   0.1, ''],
    ['fAmt', 'env amount', -5, 5,    0.1, 'oct'],
    ['fA',   'attack',    0, 8,      0.01, 's'],
    ['fD',   'decay',     0, 8,      0.01, 's'],
    ['fS',   'sustain',   0, 100,    1,    '%'],
    ['fR',   'release',   0, 14,     0.01, 's'],
  ]},
  filters: { title: 'filters', toggle: 'hpOn', rows: [
    ['hp', 'high pass', 20, 16000, 0, 'Hz', true],
  ]}
};

const ENV_DEFAULTS = {
  // The piano is left alone: struck strings already have the envelope that
  // matters, and the filter is off, so this is the sound it always had.
  piano: { on: false, aA: 0.002, aD: 0, aS: 100, aR: 0.4,
           fOn: false, cut: 18000, q: 0.7, fAmt: 0, fA: 0.01, fD: 0.5, fS: 50, fR: 0.5,
           hpOn: false, hp: 20,
           len: 0 },
  // The clouds open slowly and let go slowly, and the filter trails the volume
  // by about a second, which is what makes a held key sound like it is arriving
  // rather than being switched on.
  clouds: { on: true, aA: 1.8, aD: 2.5, aS: 82, aR: 4.0,
            fOn: true, cut: 420, q: 0.8, fAmt: 3.2, fA: 3.0, fD: 4.0, fS: 55, fR: 3.5,
            hpOn: false, hp: 20,
            len: 0 }
};

const allEnv = (() => {
  const src = preload.env || {};
  const out = {};
  for (const k of Object.keys(ENV_DEFAULTS)) out[k] = { ...ENV_DEFAULTS[k], ...(src[k] || {}) };
  return out;
})();
let env = allEnv[INST];

// A slider is always an integer 0..1000; the parameter it drives may be linear
// or logarithmic. Keeping that conversion in one pair of functions is what lets
// the cutoff share a row builder with the sustain percentage.
const TICKS = 1000;
function toSlider(r, v) {
  const [, , min, max, , , log] = r;
  const f = log ? Math.log(v / min) / Math.log(max / min) : (v - min) / (max - min);
  return Math.round(Math.max(0, Math.min(1, f)) * TICKS);
}
function fromSlider(r, t) {
  const [, , min, max, step, , log] = r;
  const f = t / TICKS;
  const v = log ? min * Math.pow(max / min, f) : min + f * (max - min);
  if (log) return v < 1000 ? Math.round(v) : Math.round(v / 10) * 10;
  return step ? Math.round(v / step) * step : v;
}
const envFmt = (r, v) => {
  const unit = r[5];
  if (unit === 'Hz') return v >= 1000 ? (v / 1000).toFixed(1) + 'k' : Math.round(v) + '';
  if (unit === '%')  return Math.round(v) + '%';
  if (unit === 'oct') return (v > 0 ? '+' : '') + v.toFixed(1);
  // zero length is the only zero that means something other than "none"
  if (unit === 's')  return (r[0] === 'len' && v === 0) ? 'held' : v.toFixed(2) + 's';
  return v.toFixed(1);
};

// Every parameter reachable by its id, so the curve handles can write to the
// same numbers the sliders do without either one owning the value.
const ENV_ROW = {};
for (const g of Object.values(ENV_SPEC)) for (const r of g.rows) ENV_ROW[r[0]] = r;
// Which four numbers each curve is drawing. The dots are named by what they do,
// not by which envelope they belong to, so one set of drag maths serves both.
const ENV_HANDLES = { amp:  { A:'aA', D:'aD', S:'aS', R:'aR' },
                      filt: { A:'fA', D:'fD', S:'fS', R:'fR' } };
const FILTER_KEYS = ['fOn', 'cut', 'q', 'fAmt', 'fA', 'fD', 'fS', 'fR', 'hpOn', 'hp'];

// Clamped to the parameter's own range and quantised to its own step, so a dot
// cannot reach anywhere its slider could not, and the two always agree.
function envSet(id, v) {
  const r = ENV_ROW[id];
  if (!r) return;
  const [, , min, max, step] = r;
  v = Math.max(min, Math.min(max, v));
  if (step) v = Math.round(v / step) * step;
  env[id] = v;
  if (FILTER_KEYS.includes(id)) updateLiveFilters(id);
  const row = document.querySelector(`#envCols .es[data-id="${id}"]`);
  if (row) {
    row.querySelector('input').value = toSlider(r, v);
    row.querySelector('.vl').textContent = envFmt(r, v);
  }
}

// ---- audio graph -----------------------------------------------------------
let ctx, master, verb, wet;
const notes = new Map();                 // semitone offset -> AudioBuffer
const lifts = [];
const held  = new Map();

function impulse(sec, decay) {
  const n = Math.floor(ctx.sampleRate * sec);
  const b = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, decay);
  }
  return b;
}

// Fetching and decoding whatever the current instrument and format point at.
// Shared by the first load, the format toggle and the instrument switch, so
// there is one loader and it cannot drift between them.
async function loadSamples() {
  const st = document.getElementById('status');
  notes.clear(); lifts.length = 0;
  let done = 0, total = SEMIS.length + RELEASES;
  const get = async u => ctx.decodeAudioData(await (await fetch(u)).arrayBuffer());
  await Promise.all([
    ...SEMIS.map(async s => {
      notes.set(s, await get(url('note', s)));
      st.textContent = `loading ${I.label} ${++done}/${total}`;
    }),
    ...Array.from({length: RELEASES}, async (_, i) => {
      lifts[i] = await get(url('lift', i));
      st.textContent = `loading ${I.label} ${++done}/${total}`;
    })
  ]);
  // The manifest is read alongside the audio it describes, so the numbers and
  // the files can never be out of step with each other.
  manifestLevels = {};
  try {
    const m = await (await fetch(`${I.dir}/${I.manifest}`)).json();
    manifestLevels = I.levels(m) || {};
  } catch (err) { /* a set without a manifest simply has nothing to say */ }
  buildTrims();

  const n = Object.keys(manifestLevels).length;
  st.textContent = `${I.label} · ${SEMIS.length} samples`
                 + (RELEASES ? ` · ${RELEASES} key lifts` : '')
                 + (n ? ` · ${n} default levels` : '')
                 + ` · ${FMT} · press a key`;
  document.getElementById('fmt').textContent = 'format: ' + FMT;
}

async function load() {
  ctx = new AudioContext();
  master = ctx.createGain();
  master.gain.value = Math.pow((+document.getElementById('vol').value)/100, 2);
  master.connect(ctx.destination);
  verb = ctx.createConvolver(); verb.buffer = impulse(3.6, 2.2);
  wet = ctx.createGain(); wet.gain.value = (+document.getElementById('rev').value)/100;
  verb.connect(wet).connect(ctx.destination);
  await loadSamples();
}

// nearest sampled note, then resample the remaining semitones
function nearest(semi) {
  let best = SEMIS[0], d = 1e9;
  for (const s of SEMIS) { const v = Math.abs(s - semi); if (v < d) { d = v; best = s; } }
  return best;
}

// Sustained piano notes ring for ten seconds or more, so with the pedal down a
// long passage can pile up a hundred voices. The cap fades the oldest out over
// 300 ms rather than cutting it, which is inaudible against everything else
// still sounding.
const MAX_VOICES = 32;
const ringing = [];

function trimVoices() {
  while (ringing.length > MAX_VOICES) {
    const v = ringing.shift();
    // stopVoice rather than an inline fade, so a stolen voice also cancels the
    // note-length timer that would otherwise fire on a voice already gone
    if (v && !v.stopped) stopVoice(v, 0.3);
  }
}

const clampFilterHz = value => Math.max(20, Math.min(20000, value));
const liveLowpassHz = settings => clampFilterHz(
  settings.cut * Math.pow(2, settings.fAmt * settings.fS / 100));

// Filter nodes stay in every voice for their entire lifetime. Rewiring a graph
// only when a control changes would strand notes that are already sounding;
// moving their AudioParams keeps the chain continuous and click-free instead.
function smoothAudioParam(param, value, exponential = false) {
  const now = ctx.currentTime;
  const current = param.value;
  param.cancelScheduledValues(now);
  param.setValueAtTime(exponential ? Math.max(0.0001, current) : current, now);
  if (exponential) param.exponentialRampToValueAtTime(Math.max(0.0001, value), now + 0.025);
  else param.linearRampToValueAtTime(value, now + 0.025);
}

function setFilterBypass(dry, wet, on, smooth = true) {
  if (smooth) {
    smoothAudioParam(dry.gain, on ? 0 : 1);
    smoothAudioParam(wet.gain, on ? 1 : 0);
  } else {
    dry.gain.value = on ? 0 : 1;
    wet.gain.value = on ? 1 : 0;
  }
}

function updateLiveFilters(changed) {
  if (!ctx || !FILTER_KEYS.includes(changed)) return;
  for (const v of ringing) {
    if (!v || v.ended || !v.filt || !v.hp) continue;
    for (const key of FILTER_KEYS) v.env[key] = env[key];

    if (changed === 'hp' || changed === 'hpOn') {
      smoothAudioParam(v.hp.frequency, clampFilterHz(env.hp), true);
      if (changed === 'hpOn') setFilterBypass(v.hpDry, v.hpWet, env.hpOn);
    }
    if (changed === 'q') {
      smoothAudioParam(v.filt.Q, env.q);
    } else if (changed !== 'hp' && changed !== 'hpOn') {
      smoothAudioParam(v.filt.Q, env.q);
      smoothAudioParam(v.filt.frequency, liveLowpassHz(env), true);
      if (changed === 'fOn') setFilterBypass(v.lpDry, v.lpWet, env.on && env.fOn);
    }
  }
}

function play(written, vel = 0.85, capture = true) {
  if (capture) recNoteOn(written, vel);
  if (!ctx) return;
  // Retrigger rather than refuse. A key that is somehow still marked held must
  // never be able to lock itself out, which is exactly what returning early did.
  if (held.has(written)) {
    const prev = held.get(written);
    stopVoice(prev, 0.06);
    litSample(prev.trimKey, false);
    held.delete(written);
  }
  const semi = written - ROOT_WRITTEN;
  const src = nearest(semi);
  const buf = notes.get(src);
  if (!buf) return;
  const s = ctx.createBufferSource();
  s.buffer = buf;
  // Piano is trimmed per SAMPLE (several keys share one recording and its
  // correction); clouds is trimmed per KEY (every key is its own slider, since
  // most of them are resampled neighbours with no reason to match). Same
  // lookup either way, just a different key into it.
  // A key with its own column uses it. A black key has no column of its own —
  // on either instrument — so it falls back to the sample it is resampled from,
  // and lights that sample's column while it sounds.
  const trimKey = (I.perKey && trim[semi]) ? semi : src;
  const tr = trim[trimKey] || { vol: 100, cents: 0 };
  // the transposition and the per sample tuning are one multiply, so a trimmed
  // sample is not resampled twice
  s.playbackRate.value = Math.pow(2, (semi - src) / 12 + tr.cents / 1200);

  const t0 = ctx.currentTime;
  const e = { ...env };
  const peak = vel * vel * (tr.vol / 100);     // velocity squared reads as linear loudness
  const g = ctx.createGain();

  // ---- the filter, and its envelope in octaves above the cutoff -------------
  // The amount is in octaves rather than Hz so that one setting sounds the same
  // wherever the cutoff is put, which is not true of a fixed number of Hz.
  // A fixed note length is the whole note, release included. Starting the
  // release AT the length and letting it run on past it is what turns a 0.8
  // second note into a five second one. When the attack and release together do
  // not fit inside the length they are scaled down until they do, so a short
  // note is a small version of the same shape rather than a truncated one.
  const LEN = e.on && e.len > 0 ? e.len : 0;
  const squeeze = (a, r) => (LEN && a + r > LEN) ? LEN / (a + r) : 1;
  const kA = squeeze(Math.max(0.002, e.aA), Math.max(0.005, e.aR));

  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  if (e.on && e.fOn) {
    filt.Q.value = e.q;
    const base = clampFilterHz(e.cut);
    const top  = clampFilterHz(e.cut * Math.pow(2, e.fAmt));
    const sus  = liveLowpassHz(e);
    const kF = squeeze(Math.max(0.002, e.fA), Math.max(0.005, e.fR));
    // The decay floor is 20 ms and it is applied after the squeeze, not before.
    // A cutoff that falls two octaves in two milliseconds is a step, and a
    // resonant filter rings on a step: that is the tick at the top of a sweep.
    const fA = Math.max(0.002, e.fA) * kF, fD = Math.max(0.02, e.fD * kF);
    filt.frequency.setValueAtTime(base, t0);
    filt.frequency.exponentialRampToValueAtTime(top, t0 + fA);
    filt.frequency.exponentialRampToValueAtTime(sus, t0 + Math.min(LEN || Infinity, fA + fD));
    // inside a fixed length the filter closes on its own, with no key-up to wait for
    if (LEN) filt.frequency.exponentialRampToValueAtTime(base, t0 + LEN);
  } else {
    filt.Q.value = e.q;
    filt.frequency.value = liveLowpassHz(e);
  }
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.Q.value = 0.707;
  hp.frequency.value = clampFilterHz(e.hp);

  // Each filter has a real bypass lane. "Off" means the dry lane is the only
  // audible one; the filter remains warm on its wet lane so it can crossfade in
  // while a note is held without rebuilding or interrupting the voice graph.
  const lpDry = ctx.createGain(), lpWet = ctx.createGain(), lpOut = ctx.createGain();
  const hpDry = ctx.createGain(), hpWet = ctx.createGain();
  setFilterBypass(lpDry, lpWet, e.on && e.fOn, false);
  setFilterBypass(hpDry, hpWet, e.hpOn, false);
  s.connect(lpDry); lpDry.connect(lpOut);
  s.connect(filt); filt.connect(lpWet); lpWet.connect(lpOut);
  lpOut.connect(hpDry); hpDry.connect(g);
  lpOut.connect(hp); hp.connect(hpWet); hpWet.connect(g);

  // ---- the amplitude envelope ----------------------------------------------
  if (e.on) {
    // Attack can be as good as instant because the sample starts from silence,
    // but decay cannot: it is a step down from full level in the middle of a
    // sounding note, and a step is a click. 20 ms is the shortest fall that is
    // still a fall rather than an edge. Floored after the squeeze so a short
    // note cannot scale it back under audibility.
    const A = Math.max(0.002, e.aA) * kA, D = Math.max(0.02, e.aD * kA);
    const S = peak * (e.aS / 100);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + A);
    if (LEN) {
      const R = Math.max(0.005, e.aR) * kA;
      const tR = Math.max(A, LEN - R);          // the release never precedes the peak
      if (tR > A) {
        const dEnd = Math.min(tR, A + D);
        g.gain.linearRampToValueAtTime(S, t0 + dEnd);
        if (tR > dEnd) g.gain.setValueAtTime(S, t0 + tR);
      }
      g.gain.linearRampToValueAtTime(0, t0 + LEN);
    } else {
      g.gain.linearRampToValueAtTime(S, t0 + A + D);
    }
  } else {
    g.gain.value = peak;
  }

  g.connect(master); g.connect(verb);
  const v = { s, g, filt, hp, lpDry, lpWet, hpDry, hpWet,
              env: e, stopped: false, ended: false, src, trimKey, timer: null, t0, len: LEN };
  s.onended = () => {
    v.ended = true;
    cursors.delete(v);
    const i = ringing.indexOf(v);
    if (i >= 0) ringing.splice(i, 1);
  };
  s.start();
  // The whole envelope is on the audio clock, so the length is exact rather than
  // however close a setTimeout happened to land.
  if (LEN) { try { s.stop(t0 + LEN + 0.02); } catch (err) {} }
  held.set(written, v);
  litSample(trimKey, true);
  ringing.push(v);
  trimVoices();
  paint(written, true);
  // The audio clock already ends the note; this only retires the bookkeeping, so
  // a finished voice stops counting against the polyphony cap.
  if (LEN) v.timer = setTimeout(() => { v.stopped = true; v.timer = null; }, (LEN + 0.03) * 1000);
  // Each voice keeps its own playhead, including overlapping release tails.
  if (e.on) {
    cursors.set(v, { t0, len: LEN, relAt: null, relDur: 0 });
    startCursor();
  }
}

// `dur` overrides the envelope, for the cases that are not a musical release:
// stealing a voice, retriggering a key, switching instrument.
function stopVoice(v, dur) {
  if (!v || v.stopped) return;
  v.stopped = true;
  if (v.timer) { clearTimeout(v.timer); v.timer = null; }
  const t = ctx.currentTime;
  const e = v.env;
  const aR = dur != null ? dur : (e && e.on ? Math.max(0.005, e.aR) : I.fade);
  // Only this voice's playhead enters release; the others keep moving.
  const cursor = cursors.get(v);
  if (cursor && cursor.relAt == null) {
    cursor.relAt = t;
    cursor.relDur = aR;
    startCursor();
  }
  // Read the level BEFORE cancelling. cancelScheduledValues wipes the ramp that
  // is currently running, and the parameter then reads back as whatever the last
  // surviving event set it to, which here is the 0.0001 the attack started from.
  // Reading after the cancel therefore ramps down from silence, which sounds
  // like the note being cut rather than released.
  const cur = Math.max(0.0001, v.g.gain.value);
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setValueAtTime(cur, t);
  v.g.gain.linearRampToValueAtTime(0, t + aR);
  // The filter closes back to its cutoff on its own clock. A filter release
  // longer than the amplitude one is inaudible, so it never extends the voice.
  if (dur == null && v.filt && e && e.on && e.fOn) {
    const fR = Math.max(0.005, e.fR);
    const base = Math.max(20, Math.min(20000, e.cut));
    const fCur = Math.max(20, v.filt.frequency.value);
    v.filt.frequency.cancelScheduledValues(t);
    v.filt.frequency.setValueAtTime(fCur, t);
    v.filt.frequency.exponentialRampToValueAtTime(base, t + fR);
  }
  try { v.s.stop(t + aR + 0.05); } catch (err) {}
}

function release(written) {
  recNoteOff(written);
  const v = held.get(written);
  if (!v) return;
  held.delete(written);
  paint(written, false);
  litSample(v.trimKey, false);
  if (liftOn && lifts.length) {
    // a real finger lift from the recording, picked at random. The action noise
    // is essentially pitch free, so any lift sits over any note, and eighteen of
    // them means the same one never lands on the same note twice.
    const s = ctx.createBufferSource();
    s.buffer = lifts[(Math.random()*lifts.length)|0];
    const g = ctx.createGain(); g.gain.value = 0.5;
    s.connect(g); g.connect(master); g.connect(verb);
    s.start();
  }
  // The envelope's own release when there is one, otherwise a damper on the
  // piano and a long breath on the clouds.
  if (!sustain) stopVoice(v);
}

// A window onto the live state. This is a sandbox instrument, and being able to
// ask it from the console what it thinks its envelope is, or how many voices
// are actually still running, is the difference between hearing that something
// is wrong and knowing what.
window.sig = {
  get env()   { return env; },
  get inst()  { return INST; },
  get ctx()   { return ctx; },
  get master(){ return master; },
  get held()  { return held; },
  get live()  { return ringing.filter(v => !v.stopped).length; },
};

// ---- keyboard --------------------------------------------------------------
const kb = document.getElementById('kb'), keyEls = new Map();

function build() {
  kb.textContent = ''; keyEls.clear();
  const whites = [];
  for (let m = LO; m <= HI; m++) if (!BLACK.has(((m%12)+12)%12)) whites.push(m);
  for (const m of whites) {
    const el = document.createElement('div');
    const pc = ((m % 12) + 12) % 12;
    el.className = 'w' + (REAL.has(m) ? ' real' : '') + (scaleOn && !inScale(m) ? ' off' : '')
                 + (pc === 0 ? ' root' : pc === 7 ? ' fifth' : '');
    el.innerHTML = `<span>${nameOf(m)}</span>`;
    bind(el, m); kb.appendChild(el); keyEls.set(m, el);
  }
  requestAnimationFrame(() => {
    for (let m = LO; m <= HI; m++) {
      if (!BLACK.has(((m%12)+12)%12)) continue;
      const prev = keyEls.get(m - 1); if (!prev) continue;
      const el = document.createElement('div');
      el.className = 'b' + (REAL.has(m) ? ' real' : '') + (scaleOn && !inScale(m) ? ' off' : '');
      el.innerHTML = `<span>${nameOf(m)}</span>`;
      el.style.left = (prev.offsetLeft + prev.offsetWidth - 10) + 'px';
      bind(el, m); kb.appendChild(el); keyEls.set(m, el);
    }
  });
}
function bind(el, m) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (scaleOn && !inScale(m)) return;
    resume(); play(m);
  });
  el.addEventListener('pointerup',    () => release(m));
  el.addEventListener('pointerleave', () => { if (held.has(m)) release(m); });
}
const paint = (m, on) => { const el = keyEls.get(m); if (el) el.classList.toggle('down', on); };

// Which sample each sounding note draws from, counted rather than flagged:
// several keys can resample the same file, so the column stays lit until the
// last of them lets go.
const litCount = new Map();
function litSample(sm, on) {
  litCount.set(sm, Math.max(0, (litCount.get(sm) || 0) + (on ? 1 : -1)));
  const c = document.querySelector(`.tc[data-semi="${sm}"]`);
  if (c) c.classList.toggle('lit', litCount.get(sm) > 0);
}

// ---- controls --------------------------------------------------------------
// ---- saved settings --------------------------------------------------------
const STORE = 'lekko.player.v1';
const saved = (() => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; }
                       catch (e) { return {}; } })();
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      octave, sustain, scaleOn, liftOn, fmt: FMT, inst: INST,
      trims: allTrim, trimGen: TRIM_GEN, env: allEnv, envWin,
      vol: +document.getElementById('vol').value,
      rev: +document.getElementById('rev').value,
    }));
  } catch (e) {}
}

// Per sample level and tuning. Keyed by semitone offset so the numbers survive
// any renaming, and applied at voice creation rather than baked into the files,
// so dialling it in costs nothing and is reversible.
// Bumped whenever a round of trims is baked into the audio files. Saved trims
// from an earlier round would otherwise apply a second time on top of files that
// already contain them, which is silent and doubles everything you dialled.
const TRIM_GEN = 2;
// One set per instrument. A cents offset that lines up a piano sample means
// nothing on a cloud pad, so keying them together would quietly carry one
// instrument's tuning onto the other's files.
const allTrim = (() => {
  if (saved.trimGen !== TRIM_GEN) return {};
  if (saved.trims) return saved.trims;
  return saved.trim ? { piano: saved.trim } : {};   // from before there were two
})();
let trim = {};
function loadTrims() {
  const from = allTrim[INST] || {};
  trim = {};
  for (const sm of TRIM_RANGE) {
    const t = from[sm] || {};
    trim[sm] = { vol: typeof t.vol === 'number' ? t.vol : 100,
                 cents: typeof t.cents === 'number' ? t.cents : 0 };
  }
  allTrim[INST] = trim;
}
loadTrims();

let octave  = typeof saved.octave  === 'number'  ? saved.octave  : 4;
let sustain = typeof saved.sustain === 'boolean' ? saved.sustain : true;
let scaleOn = typeof saved.scaleOn === 'boolean' ? saved.scaleOn : true;
let liftOn  = typeof saved.liftOn  === 'boolean' ? saved.liftOn  : true;
const CHROM = { a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12, o:13, l:14, p:15,
                ';':16, "'":17 };
// eleven scale steps, which is two full octaves of the mode plus the root on top
const ROW = ['a','s','d','f','g','h','j','k','l',';',"'"];

function keyToNote(k) {
  const base = (octave + 1) * 12;
  if (scaleOn) {
    const i = ROW.indexOf(k);
    if (i < 0) return null;
    const oct = Math.floor(i / DEGREES.length), deg = DEGREES[i % DEGREES.length];
    return base + oct * 12 + deg + (ROOT_WRITTEN % 12);
  }
  return k in CHROM ? base + CHROM[k] : null;
}
const resume = () => { if (ctx && ctx.state === 'suspended') ctx.resume(); };

// What a physical key triggered, remembered by the key itself. Resolving the
// note again on key-up was a bug: shift the octave or flip the scale while a key
// is down and key-up computes a DIFFERENT note, so the real one is never
// released. It stays in `held` forever and can never sound again, which feels
// exactly like running out of polyphony.
const downKeys = new Map();

// A range slider is not "typing" into anything, and there is no reason for
// dragging the volume to leave the keyboard deaf until something is clicked
// to steal focus back. Only an actual text field — a take's rename box — is
// worth protecting from the performance keys landing in it.
const typing = e => e.target && (e.target.tagName === 'TEXTAREA'
  || (e.target.tagName === 'INPUT' && e.target.type !== 'range'));

addEventListener('keydown', e => {
  if (typing(e)) return;
  // Space is the panic key. preventDefault first and unconditionally, including
  // on the auto-repeat that holding it down produces: the browser's default is
  // to scroll the page, and on a page this tall that is the whole layout
  // jumping out from under you mid-performance. It also stops space activating
  // whichever button happens to have focus.
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) allNotesOff();
    return;
  }
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'z') return setOct(octave - 1);
  if (k === 'x') return setOct(octave + 1);
  const m = keyToNote(k); if (m === null) return;
  e.preventDefault(); resume();
  if (downKeys.has(k)) release(downKeys.get(k));
  downKeys.set(k, m);
  play(m);
});
addEventListener('keyup', e => {
  if (typing(e)) return;
  const k = e.key.toLowerCase();
  if (!downKeys.has(k)) return;
  release(downKeys.get(k));
  downKeys.delete(k);
});
// Losing focus loses the key-up events with it, so let go of everything.
addEventListener('blur', () => {
  for (const m of downKeys.values()) release(m);
  downKeys.clear();
});

function setOct(v) { octave = Math.max(1, Math.min(5, v)); document.getElementById('octV').textContent = octave; save(); }
document.getElementById('oDn').onclick = () => setOct(octave - 1);
document.getElementById('oUp').onclick = () => setOct(octave + 1);
document.getElementById('sus').onclick = e => { sustain = !sustain; e.target.classList.toggle('on', sustain); e.target.blur(); save(); };
document.getElementById('lift').onclick = e => { liftOn = !liftOn; e.target.classList.toggle('on', liftOn); e.target.blur(); save(); };
document.getElementById('scale').onclick = e => {
  scaleOn = !scaleOn;
  e.target.textContent = 'scale: ' + (scaleOn ? '1 2 3 5 7 8' : 'chromatic');
  e.target.classList.toggle('on', scaleOn); e.target.blur(); build(); save();
  requestAnimationFrame(() => requestAnimationFrame(placeTrims));
};
document.getElementById('fmt').onclick = async e => {
  // Only offer what this instrument was actually encoded as. The piano is Opus
  // only, so the button says so instead of loading a wall of 404s.
  if (I.formats.length < 2) return flash(e.target, `${I.label} is ${FMT} only`);
  FMT = FMT === 'opus' ? 'mp3' : 'opus';
  e.target.textContent = 'format: loading…'; e.target.blur();
  allNotesOff();
  await loadSamples();
  save();
};

// ---- instruments -----------------------------------------------------------
// Switching is a reload, not a crossfade: the two sample sets do not share a
// range, a sample count or a release, so everything sounding has to be let go
// of first or a piano voice outlives the piano.
// Everything off, including what is no longer held. With the pedal down a
// released key is already out of `held` but still sounding, and on the clouds
// that is most of the wash — sweeping `held` alone left the whole thing ringing.
// `ringing` is copied first because stopping a voice splices it out of that
// array from its own onended.
function allNotesOff(fade = 0.12) {
  for (const m of held.keys()) paint(m, false);
  for (const v of ringing.slice()) stopVoice(v, fade);
  for (const v of held.values()) stopVoice(v, fade);
  held.clear(); downKeys.clear(); litCount.clear();
  for (const c of document.querySelectorAll('.tc.lit')) c.classList.remove('lit');
  cursors.clear();
}

let switching = false;
async function setInstrument(name) {
  if (switching || name === INST || !INSTRUMENTS[name]) return;
  switching = true;
  allNotesOff();
  INST = name;
  unpack();
  loadTrims();
  env = allEnv[INST];
  showEnv();
  document.getElementById('title').textContent = I.label === 'piano' ? 'Lekko' : 'Clouds';
  // key lifts are a piano's action noise; the clouds have none to offer
  document.getElementById('lift').style.display = RELEASES ? '' : 'none';
  paintInstRow();
  build();
  buildTrims();
  requestAnimationFrame(() => requestAnimationFrame(placeTrims));
  try { if (ctx) await loadSamples(); }
  catch (err) { document.getElementById('status').textContent = 'could not load ' + I.label + ': ' + err.message; }
  switching = false;
  save();
}

function paintInstRow() {
  const row = document.getElementById('instRow');
  row.textContent = '';
  for (const [key, inst] of Object.entries(INSTRUMENTS)) {
    const b = document.createElement('button');
    b.textContent = inst.label;
    b.className = key === INST ? 'on' : '';
    b.onclick = () => { b.blur(); setInstrument(key); };
    row.appendChild(b);
  }
}

// ---- envelope panel --------------------------------------------------------
// Built from ENV_SPEC rather than written out, so a parameter is added in one
// place and the slider, the readout, the persistence and the reset all follow.
const envCanvas = {};

function buildEnv() {
  const cols = document.getElementById('envCols');
  cols.textContent = '';
  const stacks = new Map();
  for (const keys of [['amp'], ['filt', 'filters']]) {
    const stack = document.createElement('div');
    stack.className = 'ecol';
    cols.appendChild(stack);
    keys.forEach(key => stacks.set(key, stack));
  }
  for (const [key, grp] of Object.entries(ENV_SPEC)) {
    const box = document.createElement('div');
    box.className = 'eg';
    const h = document.createElement('h2');
    h.textContent = grp.title;
    box.appendChild(h);

    if (grp.toggle) {
      const toggleKey = grp.toggle;
      const t = document.createElement('button');
      const paintT = () => {
        t.textContent = env[toggleKey] ? 'on' : 'off';
        t.classList.toggle('on', env[toggleKey]);
        box.classList.toggle('off', !env[toggleKey]);
      };
      t.onclick = () => {
        env[toggleKey] = !env[toggleKey];
        updateLiveFilters(toggleKey);
        paintT(); drawEnv(); saveEnv(); t.blur();
      };
      paintT();
      h.appendChild(t);
    }

    if (ENV_HANDLES[key]) {
      const cv = document.createElement('canvas');
      cv.className = 'ev';
      box.appendChild(cv);
      envCanvas[key] = cv;
      wireEnvCanvas(key, cv);
    }

    for (const r of grp.rows) {
      const [id, name] = r;
      const row = document.createElement('div');
      row.className = 'es';
      row.innerHTML = `<span class="lb">${name}</span>`;
      const sl = document.createElement('input');
      sl.type = 'range'; sl.min = 0; sl.max = TICKS; sl.step = id === 'vol' ? TICKS / 100 : 1;
      sl.setAttribute('aria-label', id === 'vol' ? name : `${grp.title} ${name}`);
      sl.addEventListener('pointerup', () => sl.blur());
      sl.addEventListener('pointercancel', () => sl.blur());
      const value = id === 'vol' ? +document.getElementById('vol').value : env[id];
      sl.value = toSlider(r, value);
      const out = document.createElement('span');
      out.className = 'vl';
      out.textContent = envFmt(r, value);
      sl.addEventListener('input', () => {
        if (id === 'vol') {
          const volume = document.getElementById('vol');
          volume.value = fromSlider(r, +sl.value);
          volume.dispatchEvent(new Event('input'));
          return;
        }
        env[id] = fromSlider(r, +sl.value);
        if (FILTER_KEYS.includes(id)) updateLiveFilters(id);
        out.textContent = envFmt(r, env[id]);
        drawEnv(); saveEnv();
      });
      row.append(sl, out);
      box.appendChild(row);
      row.dataset.id = id;
    }
    (stacks.get(key) || cols).appendChild(box);
  }
  drawEnv();
}

// The curve is drawn on the same time axis for both envelopes, scaled to
// whichever of them is longer, because the whole point is reading one against
// the other. Two separately scaled curves would be a lie about the timing.
// One playhead per voice, all following the audio clock independently.
const cursors = new Map();
let cursorRAF = 0;
// Where each curve's dots ended up on screen, written by the drawing and read
// by the pointer. Measuring rather than recomputing means the hit test can
// never disagree with the picture, however the shape got squeezed to fit.
const envGeom = {};
let envDrag = null, envHover = null;

function startCursor() {
  if (cursorRAF || INST !== 'clouds') return;
  const step = () => { drawEnv(); cursorRAF = cursors.size ? requestAnimationFrame(step) : 0; };
  cursorRAF = requestAnimationFrame(step);
}

function drawEnv() {
  // The curve has to draw what play() will actually schedule, squeeze and all,
  // or a length setting quietly makes the picture a lie.
  const LEN = env.len > 0 ? env.len : 0;
  // One key-up time and one axis for both curves. Reading the filter against the
  // volume is the point, and two separately placed key-ups would break that.
  const maxR  = Math.max(env.aR, env.fOn ? env.fR : 0);
  const maxAD = Math.max(env.aA + env.aD, env.fOn ? env.fA + env.fD : 0);
  const hold  = Math.max(0.6, (maxAD + maxR) * 0.18);
  let tOff = LEN || (maxAD + hold);               // where the note lets go
  let span = LEN ? LEN * 1.12 : Math.max(1, tOff + maxR) * 1.06;
  // Both of those are computed FROM the numbers a dot is dragging, so while one
  // is held the axis is frozen at what it was when the drag began. Letting it
  // float would rescale the picture under the pointer and the dot would crawl
  // away from the finger holding it.
  if (envDrag) { tOff = envDrag.tOff; span = envDrag.span; }

  // ---- how far into the note we are ----------------------------------------
  // Held notes park on the sustain plateau however long the key is down, then
  // pick up again at the release, which is the shape the drawing already shows.
  const positions = [];
  if (ctx) {
    const now = ctx.currentTime;
    for (const [voice, cursor] of cursors) {
      const age = now - cursor.t0;
      const released = cursor.relAt !== null;
      const releaseAge = released ? now - cursor.relAt : 0;
      if ((released && releaseAge > cursor.relDur)
          || (!released && cursor.len && age > cursor.len)) {
        cursors.delete(voice);
        continue;
      }
      positions.push(cursor.len ? Math.min(age, cursor.len)
        : released ? tOff + releaseAge : Math.min(age, tOff));
    }
  }

  const shape = (key, canvas, A, D, S, R, colour, live) => {
    if (!canvas) return;
    const dpr = devicePixelRatio || 1;
    const w = canvas.clientWidth || 300, h = canvas.clientHeight || 62;
    // resized only when it actually changed: this runs every frame while a note
    // is sounding, and assigning width reallocates the backing store
    const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
    const c = canvas.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    // The padding is what stops a dot sitting at zero, at full scale, or at the
    // far right of the axis from being sliced in half by the edge of the box.
    const pad = 9, x = t => pad + (Math.min(t, span) / span) * (w - pad * 2);
    const y = u => h - pad - u * (h - pad * 2);
    // Everything from here is clipped to the box. A release dragged long enough
    // to run past the axis stops at the edge instead of drawing over the column
    // beside it.
    c.save();
    c.beginPath(); c.rect(0, 0, w, h); c.clip();

    // The same arithmetic play() does: scale attack and release to fit inside a
    // fixed length, then place the release so the note ends exactly on it.
    let a = A, d = D, r = R, pts;
    if (LEN) {
      const k = (a + r > LEN) ? LEN / (a + r) : 1;
      a *= k; d *= k; r *= k;
      const tR = Math.max(a, LEN - r), dEnd = Math.min(tR, a + d);
      pts = [[0, 0], [a, 1]];
      if (tR > a) { pts.push([dEnd, S]); if (tR > dEnd) pts.push([tR, S]); }
      pts.push([LEN, 0]);
    } else {
      pts = [[0, 0], [a, 1], [a + d, S], [tOff, S], [Math.min(span, tOff + r), 0]];
    }

    // The level the drawn line is at, at any time along it. The dots are placed
    // through this rather than from the parameters, so one can never float off
    // the curve when a fixed note length squeezes the shape.
    const levelAt = t => {
      for (let i = 1; i < pts.length; i++) {
        const [t0p, u0] = pts[i - 1], [t1p, u1] = pts[i];
        if (t <= t1p) return t1p === t0p ? u1 : u0 + (u1 - u0) * ((t - t0p) / (t1p - t0p));
      }
      return pts[pts.length - 1][1];
    };

    c.beginPath();
    c.moveTo(x(pts[0][0]), y(pts[0][1]));
    for (const [t, u] of pts.slice(1)) c.lineTo(x(t), y(u));
    c.strokeStyle = live ? colour : '#39434f';
    c.lineWidth = 1.6;
    c.lineJoin = 'round';
    c.stroke();
    c.lineTo(x(0), y(0));
    c.closePath();
    c.fillStyle = live ? colour + '22' : '#39434f18';
    c.fill();

    // where the note lets go: the key coming up, or the length running out
    c.beginPath();
    c.setLineDash([2, 3]);
    c.moveTo(x(tOff), y(0)); c.lineTo(x(tOff), y(1));
    c.strokeStyle = LEN ? '#7d6a4a' : '#4a5562'; c.lineWidth = 1; c.stroke();
    c.setLineDash([]);

    // ---- the playheads -----------------------------------------------------
    // Drawn with the level it is passing through, so the dot rides the curve and
    // the line tells you where on it you are.
    for (const cur of positions) {
      const px = x(cur);
      c.beginPath();
      c.moveTo(px, y(0)); c.lineTo(px, y(1));
      c.strokeStyle = live ? '#ffffff' : '#66707d';
      c.lineWidth = 1.2;
      c.shadowColor = live ? colour : 'transparent';
      c.shadowBlur = live ? 8 : 0;
      c.stroke();
      c.shadowBlur = 0;
      // level at `cur`, read off the same points the curve was drawn from
      let lv = 0;
      for (let i = 1; i < pts.length; i++) {
        const [t0p, u0] = pts[i - 1], [t1p, u1] = pts[i];
        if (cur <= t1p) {
          lv = t1p === t0p ? u1 : u0 + (u1 - u0) * ((cur - t0p) / (t1p - t0p));
          break;
        }
      }
      c.beginPath();
      c.arc(px, y(Math.max(0, Math.min(1, lv))), 2.6, 0, Math.PI * 2);
      c.fillStyle = live ? '#fff' : '#66707d';
      c.fill();
    }

    // ---- the handles -------------------------------------------------------
    // Three dots carry all four numbers: the peak IS the attack, the corner is
    // the decay and the sustain at once, and the tail is the release. A fourth
    // dot for sustain alone would have nowhere of its own to be.
    //
    // Under a fixed note length the whole shape is squeezed by k, so the times
    // here are screen times. Turning one back into a parameter divides it out.
    const kSq = (LEN && A + R > LEN) ? LEN / (A + R) : 1;
    const dots = LEN
      ? [['A', a],
         ['D', Math.min(Math.max(a, LEN - r), a + d)],
         ['R', Math.max(a, LEN - r)]]
      : [['A', a], ['D', a + d], ['R', tOff + r]];
    const geom = { key, canvas, live, pad, w, h, span, tOff, LEN, k: kSq,
                   dots: dots.map(([id, t]) => ({ id, t, px: x(t), py: y(levelAt(t)) })) };
    envGeom[key] = geom;

    if (live) for (const dt of geom.dots) {
      const held = envDrag && envDrag.key === key && envDrag.id === dt.id;
      const over = envHover && envHover.key === key && envHover.id === dt.id;
      const rad = held ? 6 : over ? 5.4 : 4.2;
      // A ring in the background colour first, so a dot landing on the line or
      // on another dot still reads as a separate thing you can take hold of.
      c.beginPath();
      c.arc(dt.px, dt.py, rad + 1.8, 0, Math.PI * 2);
      c.fillStyle = '#0d1218';
      c.fill();
      c.beginPath();
      c.arc(dt.px, dt.py, rad, 0, Math.PI * 2);
      c.fillStyle = held || over ? colour : '#0d1218';
      c.strokeStyle = colour;
      c.lineWidth = 1.7;
      c.fill();
      c.stroke();
    }

    c.restore();
  };

  shape('amp',  envCanvas.amp,  env.aA, env.aD, env.aS / 100, env.aR, '#4ad9a0', true);
  shape('filt', envCanvas.filt, env.fA, env.fD, env.fS / 100, env.fR, '#b455ff', env.fOn);

}

// ---- dragging the curve ----------------------------------------------------
// Pointer events and a capture, so a drag that wanders out of the box keeps
// going. Dropping a release time because the pointer crossed into the column
// beside it would put the long values out of reach.
const ENV_HIT = 13;

function envHandleAt(geom, ev) {
  if (!geom || !geom.live) return null;
  const r = geom.canvas.getBoundingClientRect();
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  let best = null, bd = ENV_HIT * ENV_HIT;
  // Ties go to the later dot, so a decay corner parked exactly on the attack
  // peak is still the one that comes up, and the two can be pulled apart again.
  for (const dt of geom.dots) {
    const dx = dt.px - px, dy = dt.py - py, d = dx * dx + dy * dy;
    if (d <= bd) { bd = d; best = dt; }
  }
  return best;
}

// Each dot writes only what it is standing on, and each is stopped where its
// neighbour begins: the decay corner cannot walk left through the attack peak,
// the release cannot walk left through the key-up. Two parts of the envelope
// are allowed to meet, never to cross and swap places. The rest of the clamping
// is the parameter's own range, which envSet already enforces.
function envApply(ev) {
  const g = envGeom[envDrag.key];
  if (!g) return;
  const H = ENV_HANDLES[envDrag.key];
  const r = g.canvas.getBoundingClientRect();
  const t = Math.max(0, ((ev.clientX - r.left - g.pad) / Math.max(1, g.w - g.pad * 2)) * envDrag.span);
  const u = Math.max(0, Math.min(1, (g.h - g.pad - (ev.clientY - r.top)) / Math.max(1, g.h - g.pad * 2)));
  const k = envDrag.k || 1;                       // undo the fixed-length squeeze
  if (envDrag.id === 'A') {
    envSet(H.A, t / k);
  } else if (envDrag.id === 'D') {
    envSet(H.D, Math.max(0, t / k - env[H.A]));   // the corner stops at the peak
    envSet(H.S, u * 100);                         // and carries the sustain with it
  } else if (envDrag.id === 'R') {
    envSet(H.R, g.LEN ? Math.max(0, (g.LEN - t) / k)
                      : Math.max(0, t - envDrag.tOff));
  }
  drawEnv();
}

function wireEnvCanvas(key, cv) {
  const at = ev => envHandleAt(envGeom[key], ev);

  cv.addEventListener('pointerdown', ev => {
    const dt = at(ev);
    if (!dt) return;
    const g = envGeom[key];
    envDrag = { key, id: dt.id, span: g.span, tOff: g.tOff, k: g.k };
    envHover = { key, id: dt.id };
    cv.classList.add('grabbing');
    cv.setPointerCapture(ev.pointerId);
    ev.preventDefault();
    drawEnv();
  });

  cv.addEventListener('pointermove', ev => {
    if (envDrag) { if (envDrag.key === key) envApply(ev); return; }
    const dt = at(ev);
    const want = dt ? key + ':' + dt.id : null;
    const have = envHover ? envHover.key + ':' + envHover.id : null;
    cv.classList.toggle('over', !!dt);
    if (want !== have && (want || (have && have.slice(0, key.length + 1) === key + ':'))) {
      envHover = dt ? { key, id: dt.id } : null;
      drawEnv();
    }
  });

  const end = ev => {
    if (!envDrag || envDrag.key !== key) return;
    envDrag = null;
    cv.classList.remove('grabbing');
    try { cv.releasePointerCapture(ev.pointerId); } catch (e) {}
    saveEnv();      // one write per gesture, not one per frame
    drawEnv();      // and now the axis is free to rescale around the new shape
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', () => {
    if (envDrag) return;
    cv.classList.remove('over');
    if (envHover && envHover.key === key) { envHover = null; drawEnv(); }
  });
}

const saveEnv = () => { allEnv[INST] = env; save(); };

// ---- the window ------------------------------------------------------------
// Position and size are remembered, but always clamped back inside the viewport
// on open. A window saved off the edge of a big monitor is a window you cannot
// find again on a laptop, and there is no menu here to reset it from.
const winEl = document.getElementById('envWrap');
// Bumped whenever the window's default size changes in the CSS. A saved width
// from an earlier round is restored over the stylesheet, so without this the
// new default is invisible to anyone who has ever opened the window before.
// Only the size resets; where you put it is yours and stays put.
const WIN_GEN = 2;
let envWin = Object.assign({ open: true, x: null, y: null, w: 0, h: 0 }, preload.envWin || {});
if (envWin.gen !== WIN_GEN) { envWin.w = 0; envWin.h = 0; envWin.gen = WIN_GEN; }

function clampWin() {
  const r = winEl.getBoundingClientRect();
  const maxX = Math.max(8, innerWidth - r.width - 8);
  const maxY = Math.max(8, innerHeight - r.height - 8);
  envWin.x = Math.min(Math.max(8, envWin.x), maxX);
  envWin.y = Math.min(Math.max(8, envWin.y), maxY);
  winEl.style.left = envWin.x + 'px';
  winEl.style.top  = envWin.y + 'px';
}

function placeWin() {
  if (envWin.w) winEl.style.width  = envWin.w + 'px';
  if (envWin.h) winEl.style.height = envWin.h + 'px';
  if (envWin.x == null || envWin.y == null) {
    // first open: bottom right, out of the keyboard's way
    const r = winEl.getBoundingClientRect();
    envWin.x = Math.max(8, innerWidth - r.width - 24);
    envWin.y = Math.max(8, innerHeight - r.height - 24);
  }
  clampWin();
}

// Dragging by the title bar, pointer events so a trackpad, a mouse and a touch
// screen are all the same code path. The pointer is captured, so a fast drag
// that outruns the window does not drop it.
(() => {
  const bar = document.getElementById('envBar');
  let from = null;
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    from = { px: e.clientX, py: e.clientY, x: envWin.x, y: envWin.y };
    bar.classList.add('drag');
    bar.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  bar.addEventListener('pointermove', e => {
    if (!from) return;
    envWin.x = from.x + (e.clientX - from.px);
    envWin.y = from.y + (e.clientY - from.py);
    clampWin();
  });
  const end = e => {
    if (!from) return;
    from = null;
    bar.classList.remove('drag');
    try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
    save();
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
})();

// The curves are sized from the window, so they have to be redrawn when it is
// resized as well as when the page is.
if (window.ResizeObserver) {
  let t = 0;
  new ResizeObserver(() => {
    if (!winEl.classList.contains('show')) return;
    envWin.w = Math.round(winEl.getBoundingClientRect().width);
    envWin.h = Math.round(winEl.getBoundingClientRect().height);
    drawEnv();
    clearTimeout(t); t = setTimeout(save, 400);   // one write per gesture, not per frame
  }).observe(winEl);
}

function setEnvOpen(open) {
  envWin.open = open;
  document.getElementById('envBtn').classList.toggle('on', open && INST === 'clouds');
  showEnv();
  save();
}

function showEnv() {
  // The piano's sound is its samples; the envelope window belongs to the pads.
  const isClouds = INST === 'clouds';
  const on = isClouds && envWin.open;
  document.getElementById('envBtn').style.display = isClouds ? '' : 'none';
  document.getElementById('envBtn').classList.toggle('on', on);
  winEl.classList.toggle('show', on);
  if (!on) return;
  buildEnv();
  placeWin();
  // a second pass once the window has actually been laid out, or the curves are
  // measured against a canvas that is still zero wide
  requestAnimationFrame(drawEnv);
}

document.getElementById('envBtn').onclick = e => { e.target.blur(); setEnvOpen(!envWin.open); };
document.getElementById('envClose').onclick = e => { e.target.blur(); setEnvOpen(false); };
document.getElementById('envReset').onclick = e => {
  env = allEnv[INST] = { ...ENV_DEFAULTS[INST] };
  buildEnv(); save(); e.target.blur();
};
document.getElementById('envCopy').onclick = async e => {
  await copyText(JSON.stringify({ instrument: INST, envelope: env }, null, 2));
  flash(e.target, 'copied');
};
addEventListener('resize', () => { if (winEl.classList.contains('show')) { clampWin(); drawEnv(); } });
// escape closes it, the way a plugin window does
addEventListener('keydown', e => {
  if (e.key === 'Escape' && winEl.classList.contains('show')) setEnvOpen(false);
});
document.getElementById('vol').addEventListener('input', e => {
  document.getElementById('volV').textContent = e.target.value;
  if (master) master.gain.value = Math.pow(e.target.value/100, 2);
  const row = document.querySelector('#envCols .es[data-id="vol"]');
  if (row) {
    row.querySelector('input').value = toSlider(ENV_ROW.vol, +e.target.value);
    row.querySelector('.vl').textContent = envFmt(ENV_ROW.vol, +e.target.value);
  }
  save();
});
document.getElementById('rev').addEventListener('input', e => {
  document.getElementById('revV').textContent = e.target.value;
  if (wet) wet.gain.value = e.target.value/100;
  save();
});
for (const id of ['vol', 'rev']) {
  const slider = document.getElementById(id);
  slider.addEventListener('pointerup', () => slider.blur());
  slider.addEventListener('pointercancel', () => slider.blur());
}

// ---- recorder ---------------------------------------------------------------
// Notes are captured as {t, note, dur, vel} in milliseconds from the first key
// of the take, not from when record was pressed. Nobody plays on the downbeat,
// and a take that starts with four seconds of silence is four seconds of
// silence in every playback.
const TAKES_KEY = 'lekko.player.takes.v1';
let takes = (() => { try { return JSON.parse(localStorage.getItem(TAKES_KEY)) || []; }
                     catch (e) { return []; } })();

// Seed takes live on disk under takes/, not in localStorage. Anything worth
// keeping should survive a cleared browser, a different machine, and me.
// They load alongside the recorded ones and cannot be deleted from the UI.
async function loadSeeds() {
  try {
    const list = await (await fetch('takes/index.json')).json();
    for (const f of list) {
      const t = await (await fetch('takes/' + f)).json();
      const id = 'seed:' + f;
      if (takes.some(x => x.id === id)) continue;
      const ms = Math.max(...t.events.map(e => e.t + e.dur));
      takes.push({ id, name: t.name, created: null, ms, events: t.events, seed: true });
    }
    takes.sort((a, b) => (a.seed === b.seed) ? 0 : (a.seed ? 1 : -1));
    renderTakes();
    requestAnimationFrame(() => { for (const t of takes) if (t._tl) drawTimeline(t, t._tl); });
  } catch (e) {}
}
const saveTakes = () => {
  try {
    localStorage.setItem(TAKES_KEY, JSON.stringify(
      takes.filter(t => !t.seed).map(({ _tl, ...rest }) => rest)));
  } catch (e) {}
};

let rec = null;                       // { t0, events, open:Map }
let recTimer = null;

function recNoteOn(note, vel) {
  if (!rec) return;
  const now = performance.now();
  if (rec.t0 === null) rec.t0 = now;
  rec.open.set(note, { t: now - rec.t0, vel: +vel.toFixed(3) });
}
function recNoteOff(note) {
  if (!rec || !rec.open.has(note)) return;
  const o = rec.open.get(note);
  rec.open.delete(note);
  rec.events.push({ t: Math.round(o.t), note, dur: Math.round(performance.now() - rec.t0 - o.t), vel: o.vel });
}

function setRec(on) {
  const btn = document.getElementById('rec');
  if (on) {
    rec = { t0: null, events: [], open: new Map() };
    btn.classList.add('armed');
    btn.innerHTML = '&#9632; stop';
    recTimer = setInterval(() => {
      const el = document.getElementById('recInfo');
      const secs = rec && rec.t0 !== null ? (performance.now() - rec.t0) / 1000 : 0;
      el.textContent = rec.t0 === null ? 'waiting for the first note'
        : `${secs.toFixed(1)}s · ${rec.events.length + rec.open.size} notes`;
    }, 100);
  } else {
    clearInterval(recTimer);
    btn.classList.remove('armed');
    btn.innerHTML = '&#9679; record';
    if (rec) {
      for (const n of [...rec.open.keys()]) recNoteOff(n);
      rec.events.sort((a, b) => a.t - b.t);
      if (rec.events.length) {
        const ms = Math.max(...rec.events.map(e => e.t + e.dur));
        takes.unshift({
          id: Date.now(),
          name: 'take ' + (takes.length + 1),
          created: new Date().toISOString(),
          ms, events: rec.events
        });
        saveTakes(); renderTakes();
      }
    }
    rec = null;
    document.getElementById('recInfo').textContent = '';
  }
}
document.getElementById('rec').onclick = e => { resume(); setRec(!rec); e.target.blur(); };

// ---- playback ---------------------------------------------------------------
let playing = null;                   // { id, timers:[] }
function stopTake() {
  if (!playing) return;
  playing.timers.forEach(clearTimeout);
  cancelAnimationFrame(playing.raf);
  for (const m of [...held.keys()]) release(m);
  document.querySelectorAll('.tl').forEach(el => el.classList.remove('live'));
  document.querySelectorAll('.take').forEach(el => el.classList.remove('playing'));
  playing = null;
  renderTakes();
}
function playTake(t, fromMs = 0) {
  const wasScrub = playing && playing.id === t.id;
  if (playing) { playing.timers.forEach(clearTimeout); cancelAnimationFrame(playing.raf);
                 for (const m of [...held.keys()]) release(m); playing = null; }
  resume();
  const timers = [];
  for (const e of t.events) {
    if (e.t < fromMs) continue;
    const at = e.t - fromMs;
    timers.push(setTimeout(() => play(e.note, e.vel, false), at));
    timers.push(setTimeout(() => release(e.note), at + Math.max(40, e.dur)));
  }
  timers.push(setTimeout(stopTake, (t.ms - fromMs) + 600));
  playing = { id: t.id, timers, t0: performance.now(), from: fromMs, take: t, raf: 0 };
  const tl = t._tl;
  if (tl) tl.classList.add('live');
  const tick = () => {
    if (!playing) return;
    const now = playing.from + (performance.now() - playing.t0);
    const el = playing.take._tl;
    if (el) {
      el.querySelector('.ph').style.left = (Math.min(1, now / playing.take.ms) * 100) + '%';
      el.querySelector('.tm').textContent =
        `${(now/1000).toFixed(1)} / ${(playing.take.ms/1000).toFixed(1)}s`;
    }
    playing.raf = requestAnimationFrame(tick);
  };
  tick();
  if (!wasScrub) renderTakes();
  else { document.querySelectorAll('.take').forEach(el => el.classList.remove('playing'));
         tl && tl.previousElementSibling.classList.add('playing'); }
}

function renderTakes() {
  const wrap = document.getElementById('takes');
  wrap.textContent = '';
  for (const t of takes) {
    const outer = document.createElement('div');
    outer.className = 'takeRow';
    const row = document.createElement('div');
    row.className = 'take' + (playing && playing.id === t.id ? ' playing' : '');
    row.innerHTML =
      `<input class="nm" type="text" spellcheck="false">
       <span class="meta">${(t.ms/1000).toFixed(1)}s &middot; ${t.events.length} notes</span>
       <button class="pl">${playing && playing.id === t.id ? 'stop' : 'play'}</button>
       <button class="cp">copy</button>
       ${t.seed ? '<span class="meta" style="flex:0">saved</span>' : '<button class="dl">delete</button>'}`;
    const nm = row.querySelector('.nm');
    nm.value = t.name;
    // A text field in a page that listens for letter keys will play notes while
    // you type, so the key handlers skip anything typed into an input.
    nm.addEventListener('input', () => { t.name = nm.value; saveTakes(); });
    nm.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter') nm.blur();
    });
    row.querySelector('.pl').onclick = ev => {
      ev.target.blur();
      (playing && playing.id === t.id) ? stopTake() : playTake(t);
    };
    row.querySelector('.cp').onclick = async ev => {
      await copyText(JSON.stringify(takeJSON(t), null, 2));
      flash(ev.target, 'copied');
    };
    const dl = row.querySelector('.dl');
    if (dl) dl.onclick = ev => {
      if (playing && playing.id === t.id) stopTake();
      takes = takes.filter(x => x.id !== t.id);
      saveTakes(); renderTakes(); ev.target.blur();
    };
    outer.appendChild(row);

    const tl = document.createElement('div');
    tl.className = 'tl' + (playing && playing.id === t.id ? ' live' : '');
    tl.innerHTML = '<canvas></canvas><div class="ph"></div><div class="tm"></div>';
    outer.appendChild(tl);
    wrap.appendChild(outer);

    t._tl = tl;
    drawTimeline(t, tl);
    // Seeking is a press anywhere on the strip. Dragging keeps seeking, which is
    // how you find a gesture: scrub until you hear the shape you meant.
    const seek = ev => {
      const b = tl.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (ev.clientX - b.left) / b.width));
      playTake(t, pct * t.ms);
    };
    tl.addEventListener('pointerdown', ev => {
      ev.preventDefault(); tl.setPointerCapture(ev.pointerId); seek(ev);
      const mv = e2 => seek(e2);
      const up = () => { tl.removeEventListener('pointermove', mv);
                         tl.removeEventListener('pointerup', up); };
      tl.addEventListener('pointermove', mv);
      tl.addEventListener('pointerup', up);
    });
  }
}

function drawTimeline(t, tl) {
  const cv = tl.querySelector('canvas');
  const w = tl.clientWidth || 800, h = tl.clientHeight || 52;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  const ns = t.events.map(e => e.note);
  const lo = Math.min(...ns), hi = Math.max(...ns);
  const span = Math.max(1, hi - lo);
  for (const e of t.events) {
    const x = (e.t / t.ms) * (w - 2);
    const y = 4 + (1 - (e.note - lo) / span) * (h - 11);
    const pc = ((e.note % 12) + 12) % 12;
    c.fillStyle = pc === 0 ? '#b455ff' : pc === 7 ? '#4a9eff' : '#7d8899';
    c.fillRect(x, y, 3, 4);
  }
}

// Exported with the root and the scale alongside the notes, because a list of
// MIDI numbers means nothing without knowing what the root was.
const takeJSON = t => ({
  name: t.name, seconds: +(t.ms/1000).toFixed(2), noteCount: t.events.length,
  instrument: INST,
  rootWritten: ROOT_WRITTEN, rootSoundingHz: 79.5,
  scale: '1 2 3 5 7 8 (major 7)',
  format: 't = ms from first note, note = written MIDI, dur = ms, vel = 0..1',
  events: t.events
});

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
}
function flash(btn, msg) {
  const old = btn.textContent; btn.textContent = msg; btn.blur();
  setTimeout(() => { btn.textContent = old; }, 1200);
}
document.getElementById('copyAll').onclick = async e => {
  await copyText(JSON.stringify({ takes: takes.map(takeJSON) }, null, 2));
  flash(e.target, `copied ${takes.length}`);
};

renderTakes();
loadSeeds();
requestAnimationFrame(() => { for (const t of takes) if (t._tl) drawTimeline(t, t._tl); });
